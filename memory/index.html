
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Cards 00–99</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090b10;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 22px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 16px;
    max-width: 1600px;
    margin: auto;
}

.card {
    min-height: 175px;
    background: #151923;
    border: 1px solid #292f3d;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: transform 0.2s, background 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    background: #202838;
}

.number {
    font-size: 22px;
    font-weight: 800;
    color: #8b95a9;
    letter-spacing: 2px;
}

.word {
    font-size: 23px;
    font-weight: 700;
    text-align: center;
    color: #ffffff;
}

.emoji {
    font-size: 48px;
    line-height: 1.2;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .card {
        min-height: 155px;
        border-radius: 14px;
    }

    .word {
        font-size: 20px;
    }

    .emoji {
        font-size: 42px;
    }
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

});

</html>
