<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KEY="kinship_v2",TKEY="kinship_theme";
let fams=[],aid=null,sel=null,k=1,tx=0,ty=0,focus=null,qs="",pos=new Map(),meRels=null,meComp=null,lpT=0,lpFired=false,rf="All";
const fam=()=>fams.find(f=>f.id===aid);
const get=id=>fam()?.members.find(m=>m.id===id);
const mk=(name,gender,extra={})=>({id:uid(),name,gender:gender||"Other",birth:"",death:"",dead:false,parents:[],spouses:[],...extra});
const isDead=m=>!!(m.dead||m.death);
const GC=g=>g==="Female"?"#f3a5c3":g==="Male"?"#9dc4f2":"#c4c4c4";
const effP=m=>{const ps=m.parents.filter(p=>get(p));if(ps.length===1){const s=get(ps[0]).spouses;if(s.length===1&&get(s[0]))return[ps[0],s[0]]}return ps};
const gi=g=>g==="Male"?0:g==="Female"?1:2;
const ordCmp=ms=>{const ix=new Map(ms.map((m,i)=>[m,i]));return(a,b)=>(a.rank&&b.rank&&a.rank!==b.rank)?a.rank-b.rank:(a.birth&&b.birth&&a.birth!==b.birth)?(a.birth<b.birth?-1:1):gi(a.gender)-gi(b.gender)||ix.get(a)-ix.get(b)};
const parseNames=(s,g)=>String(s).split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const t=x.match(/\s*\((m|f)\)$/i);return{name:t?x.slice(0,t.index).trim():x,gender:t?(t[1].toLowerCase()==="f"?"Female":"Male"):g}}).filter(x=>x.name);
const lc=s=>s[0].toLowerCase()+s.slice(1);

/* ---------- data hygiene ---------- */
function clean(ms){
  const seen=new Set();
  ms=ms.filter(m=>m&&typeof m.id==="string"&&typeof m.name==="string"&&!seen.has(m.id)&&seen.add(m.id));
  const ids=new Set(ms.map(m=>m.id));
  const r=ms.map(m=>({id:m.id,name:m.name,gender:m.gender==="Male"||m.gender==="Female"?m.gender:"Other",birth:typeof m.birth==="string"?m.birth:"",death:typeof m.death==="string"?m.death:"",dead:!!(m.dead||m.death),
    parents:[...new Set(Array.isArray(m.parents)?m.parents:[])].filter(x=>ids.has(x)&&x!==m.id).slice(0,2),
    spouses:[...new Set(Array.isArray(m.spouses)?m.spouses:m.spouse?[m.spouse]:[])].filter(x=>ids.has(x)&&x!==m.id),
    ...(Number.isInteger(m.rank)&&m.rank>0?{rank:m.rank}:{})}));
  const by=new Map(r.map(m=>[m.id,m]));
  r.forEach(m=>m.spouses=m.spouses.filter(s=>by.get(s).spouses.includes(m.id)));
  return r;
}
function cyc(ms){
  const by=new Map(ms.map(m=>[m.id,m]));
  const reach=(a,t,v=new Set())=>{if(a===t)return true;if(v.has(a))return false;v.add(a);return by.get(a).parents.some(x=>reach(x,t,v))};
  return ms.some(m=>m.parents.some(p=>reach(p,m.id)));
}

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({fams,aid}))}catch(e){if(!save.w){save.w=1;toast("Couldn’t save to this browser — export a backup")}}}
function seed(){
  const D=(id,n,g,p,s,x)=>({id,name:n,gender:g,birth:"",death:"",dead:!!x,parents:p,spouses:s}),M="Male",F="Female";
  return{id:uid(),name:"Mahabharata",members:[
    D("sh","Shantanu",M,[],["ga","sa"],1),D("ga","Ganga",F,[],["sh"]),D("sa","Satyavati",F,[],["sh"]),
    D("bh","Bhishma",M,["sh","ga"],[],1),D("vi","Vichitravirya",M,["sh","sa"],["am","ab"],1),
    D("am","Ambika",F,[],["vi"]),D("ab","Ambalika",F,[],["vi"]),
    D("dh","Dhritarashtra",M,["vi","am"],["gn"],1),D("gn","Gandhari",F,[],["dh"],1),
    D("pa","Pandu",M,["vi","ab"],["ku","ma"],1),D("ku","Kunti",F,[],["pa","su"]),D("ma","Madri",F,[],["pa"],1),
    D("su","Surya",M,[],["ku"]),D("ka","Karna",M,["su","ku"],[],1),
    D("yu","Yudhishthira",M,["pa","ku"],["dr"]),D("bm","Bhima",M,["pa","ku"],["dr"]),D("ar","Arjuna",M,["pa","ku"],["dr"]),
    D("na","Nakula",M,["pa","ma"],["dr"]),D("sd","Sahadeva",M,["pa","ma"],["dr"]),D("dr","Draupadi",F,[],["yu","bm","ar","na","sd"]),
    D("du","Duryodhana",M,["dh","gn"],[],1),D("ds","Dushasana",M,["dh","gn"],[],1),D("dj","Dussaha",M,["dh","gn"],[],1),
    D("dm","Durmukha",M,["dh","gn"],[],1),D("vk","Vikarna",M,["dh","gn"],[],1),D("cs","Chitrasena",M,["dh","gn"],[],1),
    D("vv","Vivinshati",M,["dh","gn"],[],1),D("dy","Durjaya",M,["dh","gn"],[],1),
    D("dl","Dussala",F,["dh","gn"],["jd"]),D("jd","Jayadratha",M,[],["dl"],1)
  ]};
}
function load(){
  let raw=null;
  try{
    raw=localStorage.getItem(KEY);const d=JSON.parse(raw);
    if(d&&Array.isArray(d.fams)){
      fams=d.fams.filter(f=>f&&typeof f.id==="string"&&typeof f.name==="string"&&Array.isArray(f.members)).map(f=>({id:f.id,name:f.name,me:typeof f.me==="string"?f.me:"",members:clean(f.members)})).filter(f=>!cyc(f.members));
      fams.forEach(f=>{if(!f.members.some(m=>m.id===f.me))f.me=""});
      if(fams.length)aid=fams.some(f=>f.id===d.aid)?d.aid:fams[0].id;
    }
  }catch(e){fams=[]}
  const n0=fams.length;
  fams=fams.filter(f=>!(f.name==="Sharma Family"&&f.members.length===6&&f.members[0].id==="a"));
  if(!fams.length||fams.length<n0){
    if(raw&&!fams.length){try{localStorage.setItem(KEY+"_bak",raw)}catch(e){}}
    const f=seed();fams.unshift(f);aid=f.id;save();
  }
  try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
}

/* ---------- ui helpers ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}
function dialog({title,text,fields=[],ok="Confirm",cancel="Cancel"}){
  return new Promise(res=>{
    const m=$("dlg");
    const inp=f=>f.radio?`<div class="rg">${f.options.map(o=>`<label><input type="radio" name="f_${f.id}" value="${esc(o)}"${o===f.value?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`:f.options?`<select id="f_${f.id}">${f.options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===f.value?" selected":""}>${esc(t)}</option>`}).join("")}</select>`:`<input id="f_${f.id}" value="${esc(f.value)}" placeholder="${esc(f.ph)}" autocomplete="off">`;
    m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:""}${fields.map(f=>f.radio?`<div class="rgw"><span class="rgl">${esc(f.label)}</span>${inp(f)}</div>`:`<label>${esc(f.label)}${inp(f)}</label>`).join("")}<div class="row">${cancel?`<button class="btn" id="dX">${esc(cancel)}</button>`:""}<button class="btn pri" id="dOk">${esc(ok)}</button></div></div>`;
    m.classList.add("open");
    const done=v=>{m.classList.remove("open");m.onclick=null;m.onkeydown=null;res(v)};
    const ins=m.querySelectorAll("input,select");(ins[0]||$("dOk")).focus();
    $("dOk").onclick=()=>{const v={};fields.forEach(f=>v[f.id]=f.radio?((m.querySelector(`input[name="f_${f.id}"]:checked`)||{}).value||f.value||""):$("f_"+f.id).value.trim());done(fields.length?v:true)};
    if($("dX"))$("dX").onclick=()=>done(null);
    m.onclick=e=>{if(e.target===m)done(null)};
    m.onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")$("dOk").click();if(e.key==="Escape")done(null)};
  });
}
const note=(title,text)=>dialog({title,text,ok:"OK",cancel:null});
function drawer(open){$("drawer").classList.toggle("open",open);$("shade").classList.toggle("on",open||$("panel").classList.contains("open"))}
function closePanel(){$("panel").classList.remove("open");sel=null;$("shade").classList.remove("on");renderTree()}

/* ---------- relationship engine ---------- */
const CATS=["Spouses","Parents","Step-parents","Siblings","Step-siblings","Children","Step-children","Grandparents","Great-grandparents","Grandchildren","Great-grandchildren","Uncles","Aunts","Cousins","Second cousins","Nephews","Nieces","In-laws","Other kin"];
const RC={"Spouses":"#e9779f","Parents":"#5b9bea","Step-parents":"#4fb6b0","Siblings":"#e8a94b","Step-siblings":"#d98b5f","Children":"#6cc08b","Step-children":"#a4c85e","Grandparents":"#9b7be0","Great-grandparents":"#7f8cd9","Grandchildren":"#55b4d4","Great-grandchildren":"#7ac7a0","Uncles":"#d9b84b","Aunts":"#e58f8f","Cousins":"#5fb0a0","Second cousins":"#8fa8c8","Nephews":"#c98bd9","Nieces":"#e08bb5","In-laws":"#a3a3a3","Other kin":"#b0a38a","All":"#999"};
function relsOf(m){
  const ms=fam().members,out=[],seen=new Set([m.id]),mp=effP(m),cmp=ordCmp(ms);
  const par=x=>effP(x).map(get),kid=x=>ms.filter(c=>effP(c).includes(x.id)),sp=x=>x.spouses.map(get).filter(Boolean);
  const sib=x=>{const p=effP(x);return ms.filter(c=>c.id!==x.id&&effP(c).some(i=>p.includes(i)))};
  const G=(x,a,b,c)=>x.gender==="Male"?a:x.gender==="Female"?b:c;
  const uq=l=>[...new Map(l.filter(Boolean).map(x=>[x.id,x])).values()];
  const add=(x,l,cat)=>{if(!x||seen.has(x.id))return;seen.add(x.id);out.push({m:x,l,cat})};
  const gr=n=>"Great-".repeat(Math.max(0,n)),cap=s=>s[0].toUpperCase()+s.slice(1);
  const up=[[m]],dn=[[m]];
  for(let d=1;d<=6;d++){up[d]=uq(up[d-1].flatMap(par));dn[d]=uq(dn[d-1].flatMap(kid))}
  sp(m).forEach(x=>add(x,G(x,"Husband","Wife","Spouse"),"Spouses"));
  up[1].forEach(x=>add(x,G(x,"Father","Mother","Parent"),"Parents"));
  up[1].forEach(p=>sp(p).forEach(s=>{if(!mp.includes(s.id))add(s,G(s,"Stepfather","Stepmother","Step-parent"),"Step-parents")}));
  sib(m).forEach(x=>{const xp=effP(x),half=xp.filter(i=>mp.includes(i)).length===1&&(xp.length>1||mp.length>1);add(x,half?"Half-"+G(x,"brother","sister","sibling"):G(x,"Brother","Sister","Sibling"),"Siblings")});
  up[1].forEach(p=>sp(p).forEach(s=>{if(!mp.includes(s.id))kid(s).forEach(x=>add(x,G(x,"Stepbrother","Stepsister","Step-sibling"),"Step-siblings"))}));
  dn[1].forEach(x=>add(x,G(x,"Son","Daughter","Child"),"Children"));
  sp(m).forEach(s=>kid(s).forEach(x=>add(x,G(x,"Stepson","Stepdaughter","Step-child"),"Step-children")));
  for(let d=2;d<=6;d++){
    up[d].forEach(x=>{const b=G(x,"grandfather","grandmother","grandparent");add(x,d===2?cap(b):gr(d-2)+b,d===2?"Grandparents":"Great-grandparents")});
    dn[d].forEach(x=>{const b=G(x,"grandson","granddaughter","grandchild");add(x,d===2?cap(b):gr(d-2)+b,d===2?"Grandchildren":"Great-grandchildren")});
  }
  for(let d=1;d<=3;d++)up[d].forEach(a=>sib(a).forEach(u=>{
    add(u,d===1?G(u,"Uncle","Aunt","Uncle"):gr(d-1)+G(u,"uncle","aunt","uncle"),u.gender==="Female"?"Aunts":"Uncles");
    sp(u).forEach(s=>add(s,(d===1?G(s,"Uncle","Aunt","Aunt"):gr(d-1)+G(s,"uncle","aunt","aunt"))+" (by marriage)",s.gender==="Female"?"Aunts":"Uncles"));
    if(d<=2){const k1=kid(u),k2=uq(k1.flatMap(kid));k1.forEach(x=>add(x,d===1?"Cousin":"Parent’s cousin",d===1?"Cousins":"Other kin"));k2.forEach(x=>add(x,d===1?"Cousin’s child":"Second cousin",d===1?"Other kin":"Second cousins"))}
  }));
  sib(m).forEach(s=>{kid(s).forEach(x=>add(x,G(x,"Nephew","Niece","Nephew"),x.gender==="Female"?"Nieces":"Nephews"));uq(kid(s).flatMap(kid)).forEach(x=>add(x,G(x,"Grand-nephew","Grand-niece","Grand-nephew"),"Other kin"))});
  sp(m).forEach(s=>{par(s).forEach(x=>add(x,G(x,"Father-in-law","Mother-in-law","Parent-in-law"),"In-laws"));sib(s).forEach(x=>add(x,G(x,"Brother-in-law","Sister-in-law","Sibling-in-law"),"In-laws"))});
  sib(m).forEach(s=>sp(s).forEach(x=>add(x,G(x,"Brother-in-law","Sister-in-law","Sibling-in-law"),"In-laws")));
  dn[1].forEach(c=>sp(c).forEach(x=>add(x,G(x,"Son-in-law","Daughter-in-law","Child-in-law"),"In-laws")));
  return out.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||cmp(a.m,b.m));
}
function comp(a){
  const ms=fam().members,adj=new Map(ms.map(m=>[m.id,[]]));
  ms.forEach(m=>[...m.parents,...m.spouses].forEach(x=>{if(adj.has(x)){adj.get(m.id).push(x);adj.get(x).push(m.id)}}));
  const seen=new Set([a]),st=[a];
  while(st.length)for(const y of adj.get(st.pop())||[])if(!seen.has(y)){seen.add(y);st.push(y)}
  return seen;
}
function relLabel(id){
  const f=fam();if(!meRels||!f.me)return null;
  if(id===f.me)return"You";
  if(meRels.has(id))return"Your "+lc(meRels.get(id));
  return meComp&&meComp.has(id)?"Relative":"Not connected";
}

/* ---------- layout ---------- */
const W=176,H=64,S=64,GY=170;
function layout(ms){
  const by=new Map(ms.map(m=>[m.id,m])),unitOf=new Map(),units=[],cmp=ordCmp(ms);
  ms.forEach(m=>{
    if(unitOf.has(m.id))return;
    const comp=[],st=[m];
    while(st.length){const x=st.pop();if(unitOf.has(x.id)||comp.includes(x))continue;comp.push(x);x.spouses.forEach(s=>by.has(s)&&st.push(by.get(s)))}
    const hub=comp.reduce((a,b)=>b.spouses.length>a.spouses.length?b:a),oth=comp.filter(x=>x!==hub).sort((a,b)=>hub.spouses.indexOf(a.id)-hub.spouses.indexOf(b.id)),h=Math.floor(oth.length/2);
    const u={m:[...oth.slice(0,h),hub,...oth.slice(h)],ch:[]};u.m.forEach(x=>unitOf.set(x.id,u));units.push(u);
  });
  units.forEach(u=>{
    const seen=new Set(),list=[];
    u.m.forEach(p=>ms.forEach(c=>{if(c.parents.includes(p.id)){const cu=unitOf.get(c.id);if(cu!==u&&!seen.has(cu)){seen.add(cu);list.push({cu,c,k:c.parents.map(x=>u.m.findIndex(y=>y.id===x)).sort((a,b)=>a-b).join()})}}}));
    list.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:cmp(a.c,b.c));
    u.ch=list.map(x=>x.cu);
  });
  const GX=36,P=new Map(),uw=u=>u.m.length*W+(u.m.length-1)*S,hasPar=m=>m.parents.some(p=>by.has(p));
  function claim(u,d){
    u.d=d;u.kids=[];
    u.ch.forEach(c=>{if(!c.vis){c.vis=true;u.kids.push(c)}});
    u.kids.forEach(c=>claim(c,d+1));
    u.sw=Math.max(uw(u),u.kids.reduce((a,c)=>a+c.sw,0)+GX*Math.max(0,u.kids.length-1));
  }
  function place(u,left){
    const tot=u.kids.reduce((a,c)=>a+c.sw,0)+GX*Math.max(0,u.kids.length-1);
    let cur=left+(u.sw-tot)/2;
    u.kids.forEach(c=>{place(c,cur);cur+=c.sw+GX});
    let cx=u.kids.length?(u.kids[0].cx+u.kids[u.kids.length-1].cx)/2:left+u.sw/2;
    cx=Math.max(left+uw(u)/2,Math.min(left+u.sw-uw(u)/2,cx));
    u.cx=cx;u.m.forEach((m,i)=>P.set(m.id,{x:cx-uw(u)/2+i*(W+S),y:u.d*GY}));
  }
  const roots=units.filter(u=>!u.m.some(hasPar));
  roots.forEach(r=>r.vis=true);roots.forEach(r=>claim(r,0));
  units.filter(u=>!u.vis).forEach(u=>{u.vis=true;roots.push(u);claim(u,0)});
  let x=0;roots.forEach(r=>{place(r,x);x+=r.sw+GX*2});
  const shift=(x-GX*2)/2;P.forEach(p=>p.x-=shift);
  return P;
}

/* ---------- render ---------- */
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent&&parent.appendChild(e);return e}
function heart(a,b){const adj=Math.abs(a.x-b.x)<=W+S+1&&a.y===b.y;return{x:(a.x+b.x+W)/2,y:adj?a.y+H/2:Math.max(a.y,b.y)+H+22,adj}}
function familiesOf(ms){const ids=new Set(ms.map(m=>m.id)),r=new Map();ms.forEach(c=>{const ps=effP(c).filter(p=>ids.has(p)).sort();if(!ps.length)return;const id=ps.join("+");if(!r.has(id))r.set(id,{id,parents:ps,kids:[]});r.get(id).kids.push(c.id)});return r}
function focusFam(id){focus=focus===id?null:id;renderTree(true)}
function clearFocus(){focus=null;renderTree(true)}
let ordPick=[],hlBase=null,hlCats=new Set();

function renderTree(refit){

  $('mid').style.display=ms.length?'':'none';

  pos=layout(ms);
  const mm=f.me&&get(f.me);meRels=mm?new Map(relsOf(mm).map(o=>[o.m.id,o.l])):null;meComp=mm?comp(mm.id):null;

  if(hlBase&&hlCats.size&&get(hlBase))relsOf(get(hlBase)).forEach(o=>{if(hlCats.has(o.cat))hlMap.set(o.m.id,RC[o.cat])});
  const fl=familiesOf(ms),keys=[...fl.keys()];
  fl.forEach((x,id)=>x.col=famColor(keys.indexOf(id)));
  const FS=focus&&fl.get(focus)?new Set([...fl.get(focus).parents,...fl.get(focus).kids]):null;
  if(focus&&!FS)focus=null;
  const dm=id=>FS&&!FS.has(id)?' dim':'';
  /* corridor routing: interval-graph lane assignment per generation gap */
  const dd=new Map([...pos].map(([id,p])=>[id,Math.round(p.y/GY)])),md=Math.max(...dd.values());
  const fams2=[...fl.values()].filter(x=>x.parents.every(p=>pos.has(p))&&x.kids.every(c=>pos.has(c)));
  fams2.forEach(x=>{
    x.d=Math.max(0,Math.min(...x.kids.map(c=>dd.get(c)))-1);
    const xs=[...x.parents,...x.kids].map(i=>pos.get(i).x+W/2);
    x.lo=Math.min(...xs);x.hi=Math.max(...xs);
  });
  const byD=new Map(),nL=new Map();
  fams2.forEach(x=>{if(!byD.has(x.d))byD.set(x.d,[]);byD.get(x.d).push(x)});
  byD.forEach((list,d)=>{
    list.sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
    const ends=[];
    list.forEach(x=>{let l=0;while(l<ends.length&&ends[l]+16>x.lo)l++;x.lane=l;ends[l]=x.hi});
    nL.set(d,ends.length);
  });
  const Y=[0];
  for(let d=0;d<md;d++)Y[d+1]=Y[d]+H+Math.max(104,82+(nL.get(d)||0)*13);
  pos.forEach((p,id)=>{p.y=Y[dd.get(id)]});
  fams2.forEach(x=>{
    const ps=x.parents.map(p=>pos.get(p));
    x.my=Y[x.d]+H+46+x.lane*13;
    x.h=x.parents.length===2&&get(x.parents[0]).spouses.includes(x.parents[1])?heart(ps[0],ps[1]):null;
  });
  const bindFam=(n,x)=>{n.addEventListener('click',e=>{e.stopPropagation();focusFam(x.id)});n.addEventListener('pointerenter',()=>hoverFams([x.id],true));n.addEventListener('pointerleave',()=>hoverFams([x.id],false))};
  ms.forEach(c=>{

    const d=x.h?`M${x.h.x} ${x.h.y+14}V${my}H${tx0}V${ty0}`:ps.map(p=>{const pp=pos.get(p.id);return `M${pp.x+W/2} ${pp.y+H}V${my}H${tx0}V${ty0}`}).join('');
    bindFam(el('path',{d,class:'ed fnode'+(dimc?' dim':''),style:`stroke:${x.col};stroke-width:1.9`,'data-f':x.id},L),x);
  });
  fams2.filter(x=>!x.h).forEach(x=>{
    const p0=pos.get(x.parents[0]);
    bindFam(el('circle',{cx:p0.x+W/2,cy:x.my,r:5,class:'fnode'+(FS&&!FS.has(x.parents[0])?' dim':''),style:`fill:var(--bg);stroke:${x.col};stroke-width:1.8`},L),x);
  });

    const a=pos.get(m.id),b=pos.get(s),h=heart(a,b),c0=a.x+W/2,c1=b.x+W/2,fx=fl.get([m.id,s].sort().join('+'));

    if(h.adj){const l=a.x<b.x?a:b,r=a.x<b.x?b:a;el('path',{d:`M${l.x+W} ${l.y+H/2}H${r.x}`,class:'sp'},g)}

    el('circle',{cx:h.x,cy:h.y,r:13,class:'hb',style:fx?`stroke:${fx.col};stroke-width:1.8`:''},g);

  });

}
function showTip(m,e){const l=relLabel(m.id),t=$("tip");if(!l){t.style.display="none";return}t.textContent=l;t.style.display="block";t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8)+"px";t.style.top=(e.clientY+16)+"px"}
function hideTip(){$("tip").style.display="none"}
function applyT(){$("layer").setAttribute("transform",`translate(${tx},${ty}) scale(${k})`)}
function fitView(set){
  if(!fam().members.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pos.forEach((p,id)=>{if(set&&!set.has(id))return;x0=Math.min(x0,p.x);x1=Math.max(x1,p.x+W);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y+H)});

const svg=$("tree"),ptrs=new Map();let pan=null,down=null,pinch=null;
svg.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY};hideCtx()});
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){clearTimeout(lpT);const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};pan=null;down=null;return}

  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;tx+=cx-pinch.cx;ty+=cy-pinch.cy;pinch.cx=cx;pinch.cy=cy;zoom(pinch.k*d/pinch.d/k,cx,cy);return}

  f.members.forEach(x=>{x.parents=x.parents.filter(p=>p!==id);x.spouses=x.spouses.filter(s=>s!==id)});
  if(f.me===id)f.me="";
  save();if(sel===id)closePanel();renderAll();toast("Member deleted");
}

/* ---------- adding & linking ---------- */
function addRelative(m,rel,names,gender,other,oname){
  const list=parseNames(names,gender),ms=fam().members,added=[];
  if(!list.length)return;
  if(rel==="Sibling"&&!m.parents.length)return note("Add parents first","Siblings need shared parents, so "+m.name+" needs at least one parent before you add a sibling.");
  if(rel==="Child"&&!other&&oname&&oname.trim()){const o=mk(oname.trim(),m.gender==="Male"?"Female":m.gender==="Female"?"Male":"Other");o.spouses=[m.id];m.spouses.push(o.id);ms.push(o);other=o.id;added.push(o)}
  list.forEach(({name,gender:g})=>{
    const n=mk(name,g);
    if(rel==="Parent"){if(m.parents.length>=2)return toast("Already has two parents");const o=get(m.parents[0]);m.parents.push(n.id);if(o){o.spouses.push(n.id);n.spouses.push(o.id)}}
    else if(rel==="Sibling")n.parents=[...m.parents];
    else if(rel==="Child"){n.parents=[m.id];if(other)n.parents.push(other)}
    else if(rel==="Spouse"){m.spouses.push(n.id);n.spouses.push(m.id)}
    ms.push(n);added.push(n);
  });
  if(!added.length)return;
  save();renderAll(true);
  if(sel===m.id&&$("panel").classList.contains("open"))openMember(m.id);
  note("Added",added.map(x=>x.name).join(", ")+" → "+rel.toLowerCase()+(list.length>1?"s":"")+" of "+m.name);
}
async function quickAdd(m,dir){
  const sp=dir!=="down",kin=m.spouses.map(get).filter(Boolean);
  const gd=sp?(m.gender==="Male"?"Female":m.gender==="Female"?"Male":dir==="right"?"Female":"Male"):"Male";
  const fields=[{id:"n",label:sp?"Spouse name(s), comma separated":"Child name(s) · males eldest first, then females",ph:"e.g. Ram, Sita (f)"},{id:"g",label:"Gender",options:["Male","Female","Other"],value:gd,radio:true}];
  if(!sp&&kin.length>1)fields.push({id:"o",label:"Other parent",options:kin.map(x=>[x.id,x.name])});
  if(!sp&&!kin.length)fields.push({id:"p",label:"Other parent (optional)",ph:"Name"});
  const r=await dialog({title:sp?(gd==="Female"?"Add wife":"Add husband"):"Add child",fields,ok:"Add"});
  if(!r||!r.n)return;
  addRelative(m,sp?"Spouse":"Child",r.n,r.g,sp?"":kin.length===1?kin[0].id:r.o||"",r.p);
}
async function addMember(){
  const ms=fam().members,fields=[{id:"n",label:"Name(s) · males eldest first, then females",ph:"e.g. Ram, Shyam, Sita (f)"},{id:"g",label:"Gender",options:["Male","Female","Other"],value:"Male",radio:true}];
  if(ms.length)fields.push({id:"r",label:"Connect as",options:["Child of","Parent of","Spouse of","Sibling of"]},{id:"w",label:"Existing member",options:[...ms].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>[x.id,x.name])});
  const r=await dialog({title:"New member",fields,ok:"Add"});
  if(!r||!r.n)return;
  if(!ms.length){parseNames(r.n,r.g).forEach(x=>ms.push(mk(x.name,x.gender)));save();renderAll(true);return toast("Member added")}
  const y=get(r.w);if(!y)return;
  let oth=y.spouses.length===1?y.spouses[0]:"";
  if(r.r==="Child of"&&y.spouses.length>1){
    const q=await dialog({title:"Other parent",text:y.name+" has more than one spouse.",fields:[{id:"o",label:"Which spouse?",options:y.spouses.map(get).filter(Boolean).map(s=>[s.id,s.name])}],ok:"Add"});
    if(!q)return;oth=q.o;
  }
  addRelative(y,{"Child of":"Child","Parent of":"Parent","Spouse of":"Spouse","Sibling of":"Sibling"}[r.r],r.n,r.g,oth);
}
async function linkRel(m,rel,id){
  const o=get(id);if(!o)return toast("Pick a member");
  const anc=(x,t,v=new Set())=>{if(!x||v.has(x.id))return false;v.add(x.id);return effP(x).some(p=>p===t||anc(get(p),t,v))};
  const join=(c,p)=>{if(c.parents.includes(p.id))return true;if(c.parents.length>=2){toast("Already has two parents");return false}const p0=get(c.parents[0]);c.parents.push(p.id);if(p0&&!p0.spouses.includes(p.id)){p0.spouses.push(p.id);p.spouses.push(p0.id)}return true};
  if(rel==="Child of"){if(anc(o,m.id))return toast("That would create a loop");if(!join(m,o))return}
  else if(rel==="Parent of"){if(anc(m,o.id))return toast("That would create a loop");if(!join(o,m))return}
  else if(rel==="Spouse of"){if(!m.spouses.includes(o.id)){m.spouses.push(o.id);o.spouses.push(m.id)}}
  else{
    const p=effP(o);if(!p.length)return toast("Add parents to "+o.name+" first");
    if(p.some(x=>x===m.id||anc(get(x),m.id)))return toast("That would create a loop");
    const same=m.parents.length===p.length&&m.parents.every(x=>p.includes(x));
    if(m.parents.length&&!same&&!await dialog({title:"Replace parents?",text:`${m.name} already has parents. They will be replaced with ${o.name}’s parents.`,ok:"Replace"}))return;
    m.parents=p.slice(0,2);
  }
  save();renderAll(true);openMember(m.id);note("Linked",m.name+" is now "+rel.toLowerCase()+" "+o.name+".");
}

/* ---------- presentation ---------- */
const gend=(m,a,b,c)=>m.gender==="Male"?a:m.gender==="Female"?b:c;
const PR={Male:["he","his","him"],Female:["she","her","her"]},pr=(m,i)=>(PR[m.gender]||["they","their","them"])[i];
const lst=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
const yrs=m=>(m.birth?m.birth.slice(0,4):"")+(m.death?" – "+m.death.slice(0,4):isDead(m)?" †":"");
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const kc=n=>n===1?"1 child":n+" children";
const OW=["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"],ordw=n=>OW[n-1]||n+"th";
const ordn=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const nms=ps=>ps.map(p=>p.name).join(" & ");
const AC={t:"#9a7bd9",m:"#e0708a",k:"#d9a441",e:"#4fb69a"};
const CL=["Each child carried a little of their parents’ hearts into the future.","Laughter, first steps, whispered lullabies — the family grew.","And so the family tree grew another branch."];
const kidsOf=(ms,u)=>ms.filter(c=>!u.includes(c)&&effP(c).some(p=>u.some(x=>x.id===p)));
const pairKids=(ms,a,b)=>ms.filter(c=>{const p=effP(c);return p.includes(a.id)&&p.includes(b.id)});
const parNote=x=>{const ps=effP(x).map(get).filter(Boolean);return ps.length?gend(x,"Son","Daughter","Child")+" of "+nms(ps):""};
/* birth order: explicit rank, else birth dates (if all given), else the order they were added */
function sorder(ms,l){
  const ix=new Map(ms.map((m,i)=>[m,i])),all=f=>l.length&&l.every(f);
  const key=all(m=>m.rank)?m=>m.rank:all(m=>m.birth)?m=>m.birth:m=>ix.get(m);
  return[...l].sort((a,b)=>{const x=key(a),y=key(b);return x<y?-1:x>y?1:ix.get(a)-ix.get(b)});
}
function unitOf(m){
  const out=[m],seen=new Set([m.id]);
  for(let i=0;i<out.length;i++)out[i].spouses.forEach(s=>{const x=get(s);if(x&&!seen.has(x.id)){seen.add(x.id);out.push(x)}});
  const hub=out.reduce((a,b)=>b.spouses.length>a.spouses.length?b:a);
  return[hub,...out.filter(x=>x!==hub)];
}
function mkGen(){const gm=new Map();const g=m=>{if(gm.has(m.id))return gm.get(m.id);gm.set(m.id,1);const v=1+Math.max(0,...effP(m).map(get).filter(Boolean).map(g));gm.set(m.id,v);return v};return g}

/* slide: a marriage */
function mSlide(a,b,o){
  const anchor=b.spouses.length>a.spouses.length?b:a,tot=anchor.spouses.length,n=anchor.spouses.indexOf((anchor===a?b:a).id)+1;
  const L=[["Two lives, once separate, began to walk the same road.","Some stories begin with a single promise.",`Love found ${a.name} and ${b.name}, and a new chapter began.`,"A glance, a promise — and two families became one."][o.idx%4]];
  L.push(tot>1?(n===1?`This was ${anchor.name}’s first marriage — the first of ${tot} unions in ${pr(anchor,1)} story.`:`This was ${anchor.name}’s ${ordw(n)} marriage — another heart welcomed into ${pr(anchor,1)} life.`):"Hand in hand, they promised to build a home filled with warmth.");
  L.push(o.kn>1?`Soon, ${o.kn} little ones would fill their home with laughter.`:o.kn===1?"Soon, a little one would make their house a home.":"Their love, quiet and true, became part of this family’s story.");
  const card=x=>({m:x,role:gend(x,"Groom","Bride","Partner"),note:parNote(x)||(o.root?"Root ancestor":"Joined the family")});
  return{t:"m",ac:AC.m,g:o.g,G:o.G,kicker:`Chapter ${o.ch} · Generation ${o.g}`,chip:tot>1?`${anchor.name} · marriage ${n} of ${tot}`:"A marriage",title:`${a.name} & ${b.name}`,a:[card(a),card(b)],lines:L};
}
/* slide: children born, in birth order */
function kSlide(ks,ps,o){
  const n=ks.length,nm=nms(ps),th=ps.length>1?"their":pr(ps[0],1),cl=CL[o.idx%3],g=Math.max(...ks.map(o.gen)),L=[];
  if(o.only)L.push(`${nm} had ${lst(ks.map(c=>c.name))}, ${n>1?"through whom":"the child through whom"} the story would flow on.`,cl);
  else if(n===1)L.push(`${nm} welcomed a little blessing into ${th} home: ${ks[0].name}.`,"A tiny heartbeat turned a house into a home.");
  else if(n===2)L.push(`In the home of ${nm}, two little blessings arrived.`,`First came ${ks[0].name}, and then ${ks[1].name}.`,cl);
  else L.push(`In the home of ${nm}, ${n} little blessings arrived, one after another.`,`First came ${ks[0].name}, and last of all ${ks[n-1].name}, the youngest, completing the circle.`,cl);
  return{t:"k",ac:AC.k,g,G:o.G,kicker:`Chapter ${o.ch} · Generation ${g}`,chip:`${kc(n)} · ${n>1&&!o.only?"in order of birth":"a precious beginning"}`,title:`Children of ${nm}`,pr:ps,lines:L,
    kids:ks.map((c,i)=>({m:c,role:gend(c,"Son","Daughter","Child"),ord:o.only?"Carries the line":n===1?"Only child":i===0?"First-born":i===n-1?"Youngest":ordn(i+1)+" born",tgt:o.hl?o.hl(c):false}))};
}

/* the whole family: root ancestor outward — marriage, then the children born of it */
function storyAll(){
  const f=fam(),ms=f.members;if(!ms.length)return[];
  const gen=mkGen(),G=Math.max(...ms.map(gen)),covered=new Set(),shown=new Set(),sl=[];let ch=0,idx=0,first=null;
  const dc=(x,v=new Set())=>{if(!v.has(x.id)){v.add(x.id);kidsOf(ms,[x]).forEach(c=>dc(c,v))}return v};
  const score=m=>unitOf(m).reduce((s,x)=>s+dc(x).size,0);
  const run=head=>{
    const q=[head];
    while(q.length){
      const u=unitOf(q.shift());if(u.some(x=>covered.has(x.id)))continue;
      u.forEach(x=>{covered.add(x.id);shown.add(x.id)});ch++;
      const root=u.every(x=>!effP(x).length),g=Math.max(...u.map(gen)),used=new Set(),order=[],pairs=[],sp=new Set();
      u.forEach(x=>x.spouses.map(get).filter(s=>s&&u.includes(s)).forEach(s=>{const key=[x.id,s.id].sort().join("+");if(!sp.has(key)){sp.add(key);pairs.push([x,s])}}));
      pairs.forEach(([a,b])=>{
        const ks=sorder(ms,pairKids(ms,a,b));
        sl.push(mSlide(a,b,{idx:idx++,ch,g,G,kn:ks.length,root}));
        if(ks.length){sl.push(kSlide(ks,[a,b],{idx:idx++,ch,G,gen}));ks.forEach(c=>{used.add(c.id);order.push(c)})}
      });
      const rest=kidsOf(ms,u).filter(c=>!used.has(c.id));
      u.forEach(p=>{
        const ks=sorder(ms,rest.filter(c=>!used.has(c.id)&&effP(c).includes(p.id)));
        if(ks.length){sl.push(kSlide(ks,[p],{idx:idx++,ch,G,gen}));ks.forEach(c=>{used.add(c.id);order.push(c)})}
      });
      if(!pairs.length&&!order.length)sl.push({t:"m",ac:AC.t,g,G,kicker:`Chapter ${ch} · Generation ${g}`,chip:"A quiet branch",title:u[0].name,a:[{m:u[0],role:"",note:parNote(u[0])}],lines:[`${u[0].name} stands quietly in this family’s story.`]});
      order.forEach(c=>{shown.add(c.id);if(!covered.has(c.id)&&(unitOf(c).length>1||kidsOf(ms,[c]).length))q.push(c)});
    }
  };
  ms.filter(m=>!effP(m).length).sort((a,b)=>score(b)-score(a)).forEach(r=>{if(covered.has(r.id))return;if(!first)first=unitOf(r);run(r)});
  ms.forEach(m=>{if(!covered.has(m.id)&&!shown.has(m.id))run(m)});
  const roots=first?first.map(x=>x.name):[],young=sorder(ms,ms.filter(m=>gen(m)===G));
  return[{t:"t",big:1,ac:AC.t,kicker:"A family story",title:f.name,lines:["Every family is a story, told one generation at a time.",`${plural(ms.length,"life")}, woven together across ${plural(G,"generation")}.`,roots.length?`It all begins with ${lst(roots)}.`:""].filter(Boolean)},
    ...sl,
    {t:"e",big:1,ac:AC.e,kicker:"The story goes on",title:"With love, onward",kids:young.slice(0,8).map(x=>({m:x,role:"",note:parNote(x)})),
      lines:[`From ${roots.length?lst(roots):"the very first ancestor"} to ${young.length>3?young.slice(0,3).map(x=>x.name).join(", ")+" and more":lst(young.map(x=>x.name))}, the story has travelled ${plural(G,"generation")}.`,`${plural(ms.length,"life")} bound by love — and every new birth adds another page.`]}];
}

/* direct line only: root ancestor → … → member (no cousins or other branches) */
function storyTo(m){
  const ms=fam().members,gen=mkGen(),A=new Map();
  const walk=(x,d)=>effP(x).map(get).filter(Boolean).forEach(p=>{if((A.get(p.id)||0)<d+1){A.set(p.id,d+1);walk(p,d+1)}});
  walk(m,0);
  const anc=[...A.keys()].map(get),depth=Math.max(0,...A.values()),G=Math.max(...ms.map(gen)),cps=new Map();
  [m,...anc].forEach(x=>{
    const ps=effP(x).map(get).filter(Boolean);if(!ps.length)return;
    const key=ps.map(p=>p.id).sort().join("+");
    if(!cps.has(key))cps.set(key,{ps,kids:[],d:0});
    const c=cps.get(key);c.kids.push(x);c.d=Math.max(c.d,...ps.map(p=>A.get(p.id)||0));
  });
  const roots=anc.filter(a=>!effP(a).length);
  const sl=[{t:"t",big:1,ac:AC.t,kicker:"A lineage story",title:m.name,lines:["Every life begins long before its first breath.",roots.length?`This is the road from ${lst(roots.map(r=>r.name))} to ${m.name} — ${plural(depth,"generation")} of love.`:`${m.name} stands at the very beginning of this family.`,"Only the direct line is told here; cousins and other branches rest quietly in the background."]}];
  let ch=0,idx=0;
  [...cps.values()].sort((a,b)=>b.d-a.d).forEach(c=>{
    ch++;const own=c.kids.includes(m),ks=sorder(ms,own?(c.ps.length===2?pairKids(ms,c.ps[0],c.ps[1]):kidsOf(ms,c.ps)):c.kids),g=Math.max(...c.ps.map(gen)),root=c.ps.every(p=>!effP(p).length);
    if(c.ps.length===2&&c.ps[0].spouses.includes(c.ps[1].id))sl.push(mSlide(c.ps[0],c.ps[1],{idx:idx++,ch,g,G,kn:pairKids(ms,c.ps[0],c.ps[1]).length,root}));
    sl.push(kSlide(ks,c.ps,{idx:idx++,ch,G,gen,only:!own,hl:own?x=>x===m:()=>true}));
  });
  const chain=[m];let c=m;
  for(;;){const ps=effP(c).map(get).filter(Boolean).sort((a,b)=>(a.gender==="Male"?0:1)-(b.gender==="Male"?0:1));if(!ps.length||chain.includes(ps[0]))break;c=ps[0];chain.unshift(c)}
  sl.push({t:"e",ac:AC.e,g:gen(m),G,kicker:`Generation ${gen(m)}`,title:`${m.name} arrives`,chip:A.size?`${plural(A.size,"ancestor")} · ${plural(depth,"generation")}`:"The beginning",a:[{m,tgt:1,role:"",note:parNote(m)}],chain:chain.length>1?chain.map(x=>x.name):null,
    lines:[`And so ${m.name} came into the world${m.birth?" in "+m.birth.slice(0,4):""}.`,A.size?`Behind ${pr(m,2)} stand ${plural(A.size,"ancestor")}, each one a link in a chain of love.`:`${m.name} stands at the root of this family.`,"Every step you just saw led here."]});
  return sl;
}

function slideHTML(s){
  const ini=m=>esc((Array.from(m.name.trim())[0]||"?").toUpperCase()),col=m=>isDead(m)?"#8c8c8c":GC(m.gender);
  const card=(c,cls,d)=>`<div class="pc ${cls}${c.tgt?" tgt":""}" style="--d:${d}s"><div class="av" style="--g:${col(c.m)}">${ini(c.m)}</div><b>${esc(c.m.name)}</b>${yrs(c.m)?`<small>${esc(yrs(c.m))}</small>`:""}${c.role?`<em>${esc(c.role)}</em>`:""}${c.note?`<span class="nt">${esc(c.note)}</span>`:""}${c.ord?`<u class="od">${esc(c.ord)}</u>`:""}</div>`;
  let body="",t0=.6;
  if(s.a){
    body=s.a.length===2?`<div class="mrow">${card(s.a[0],"m fl",.3)}<div class="knot" style="--d:.9s"><i></i><i class="r2"></i><span>♥</span></div>${card(s.a[1],"m fr",.3)}</div>`:`<div class="mrow">${card(s.a[0],"m",.3)}</div>`;
    t0=s.a.length===2?1.9:1;
  }
  if(s.kids){
    const n=s.kids.length,st=Math.min(.6,4/n),sz=n>9?"xs":n>5?"sm":"";
    if(s.pr)body+=`<div class="pchip" style="--d:.2s">${s.pr.map(p=>`<span class="mi" style="--g:${col(p)}">${ini(p)}</span>${esc(p.name)}`).join('<span class="hh">♥</span>')}</div><div class="thread"></div>`;
    body+=`<div class="prow">${s.kids.map((c,i)=>card(c,sz,(1+i*st).toFixed(2))).join("")}</div>`;
    t0=1+n*st+.5;
  }
  let chain="";
  if(s.chain){chain=`<div class="chain">${s.chain.map((x,i)=>`<span style="--d:${(t0+i*.25).toFixed(2)}s">${esc(x)}</span>`).join("<u>→</u>")}</div>`;t0+=s.chain.length*.25+.3}
  const lines=`<div class="lines">${s.lines.map((t,i)=>`<p class="ln" style="--d:${(t0+i*1.3).toFixed(2)}s">${esc(t)}</p>`).join("")}</div>`;
  return{html:`<div class="sl${s.big?" big":""}"><div class="si"><div class="sk">${esc(s.kicker)}</div><h2>${esc(s.title)}</h2>${s.chip?`<div class="chip">${esc(s.chip)}</div>`:""}${body}${chain}${lines}</div></div>`,dur:Math.min(26000,Math.max(8000,(t0+s.lines.length*1.3+3)*1000))};
}
function rail(s){
  const el=$("pRail");if(!s.g){el.innerHTML="";return}
  let h="";if(s.G<=10)for(let i=1;i<=s.G;i++)h+=(i>1?`<s class="${i<=s.g?"on":""}"></s>`:"")+`<span class="rd${i<=s.g?" on":""}${i===s.g?" cur":""}">${i}</span>`;
  el.innerHTML=h+`<span class="rl2">Generation ${s.g} of ${s.G}</span>`;
}
function fx(s){
  const gl={m:["♥","✦","❀"],k:["✦","✿","·"],t:["✦","❀","♥"],e:["✦","♥","✿"]}[s.t]||["✦"];let h="";
  for(let i=0;i<16;i++){const t=14+Math.random()*12;h+=`<i style="--x:${(Math.random()*100).toFixed(1)}%;--s:${(10+Math.random()*18).toFixed(0)}px;--t:${t.toFixed(1)}s;--dl:${(-Math.random()*t).toFixed(1)}s;--r:${(Math.random()*360-180).toFixed(0)}deg">${gl[i%gl.length]}</i>`}
  $("pFx").innerHTML=h;

/* keep every slide inside the viewport: scale the slide down to fit, never scroll */
function fit(){
  const b=$("pBody"),s=b.firstElementChild;if(!s)return;
  s.style.setProperty("--sc",1);
  const sc=Math.min(1,(b.clientHeight-12)/s.offsetHeight,(b.clientWidth-12)/Math.max(s.offsetWidth,s.scrollWidth));
  s.style.setProperty("--sc",Math.max(.4,sc).toFixed(3));
}
let pS=[],pI=0,pT=0,pOn=true,pDur=8000;
function openPres(slides,title){
  if(!slides||!slides.length)return toast("Nothing to play yet");
  pS=slides;pI=0;pOn=true;$("pTitle").textContent=title;$("pres").classList.add("open");hideCtx();showSlide();
}
function closePres(){clearTimeout(pT);$("pres").classList.remove("open")}
function arm(){
  clearTimeout(pT);$("pPlay").textContent=pOn?"⏸":"▶";
  if(!pOn)return;
  if(pI>=pS.length-1){pOn=false;$("pPlay").textContent="▶";return}

function showSlide(){

  $("pPrev").disabled=pI===0;$("pNext").disabled=pI===pS.length-1;arm();
}
function go(d){const n=pI+d;if(n<0||n>=pS.length)return;pI=n;showSlide()}
$("pX").onclick=closePres;
$("pPrev").onclick=()=>go(-1);$("pNext").onclick=()=>go(1);
$("pPlay").onclick=()=>{if(pOn)pOn=false;else{pOn=true;if(pI>=pS.length-1){pI=0;showSlide();return}}arm()};
let sx0=null;
$("pBody").addEventListener("touchstart",e=>{sx0=e.touches[0].clientX},{passive:true});
$("pBody").addEventListener("touchend",e=>{if(sx0===null)return;const dx=e.changedTouches[0].clientX-sx0;sx0=null;if(Math.abs(dx)>50)go(dx<0?1:-1)});
$("playBtn").onclick=()=>openPres(storyAll(),fam().name);
addEventListener("resize",()=>{if($("pres").classList.contains("open"))fit()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if($("pres").classList.contains("open"))fit()});

/* ---------- families & chrome ---------- */
function renderAll(refit){
  const f=fam();$("title").textContent=f.name;
  $("famList").innerHTML="";
  fams.forEach(x=>{
    const r=document.createElement("div");r.className="frow";
    r.innerHTML=`<button class="fam${x.id===aid?" on":""}"></button><span class="fa"><button data-a="r" title="Rename" aria-label="Rename">✎</button><button data-a="d" title="Delete" aria-label="Delete">✕</button></span>`;
    const b=r.firstChild;b.textContent=x.name;
    b.onclick=()=>{aid=x.id;sel=null;focus=null;$("panel").classList.remove("open");save();renderAll(true);drawer(false)};
    r.querySelector('[data-a="r"]').onclick=e=>{e.stopPropagation();renFam(x.id)};
    r.querySelector('[data-a="d"]').onclick=e=>{e.stopPropagation();delFam(x.id)};
    $("famList").appendChild(r);
  });
  renderTree(refit);
  const n=f.members.length,g=n?new Set([...pos.values()].map(p=>p.y)).size:0;
  $("stat").textContent=`${n} member${n===1?"":"s"} · ${g} generation${g===1?"":"s"}`;
}
async function renFam(id){
  const x=fams.find(f=>f.id===id);drawer(false);
  const r=await dialog({title:"Rename family",fields:[{id:"n",label:"Name",value:x.name}],ok:"Save"});
  if(!r||!r.n)return;x.name=r.n;save();renderAll();
}
async function delFam(id){
  const x=fams.find(f=>f.id===id);drawer(false);
  if(!await dialog({title:"Delete family?",text:`“${x.name}” and all its members will be removed.`,ok:"Delete"}))return;
  fams=fams.filter(f=>f.id!==id);
  if(!fams.length)fams=[{id:uid(),name:"My Family",members:[]}];
  if(aid===id){aid=fams[0].id;sel=null;focus=null;$("panel").classList.remove("open")}
  save();renderAll(true);
}
$("mBtn").onclick=()=>drawer(true);
$("shade").onclick=()=>{drawer(false);if($("panel").classList.contains("open"))closePanel()};
$("zIn").onclick=()=>zoom(1.2);$("zOut").onclick=()=>zoom(.83);$("fit").onclick=()=>fitView();
$("addBtn").onclick=addMember;$("first").onclick=addMember;
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){toast("Full screen unavailable")}};
$("newFam").onclick=async()=>{
  drawer(false);
  const r=await dialog({title:"New family",fields:[{id:"n",label:"Name",ph:"e.g. Thapa Family"}],ok:"Create"});
  if(!r||!r.n)return;
  const f={id:uid(),name:r.n,members:[]};fams.push(f);aid=f.id;save();renderAll(true);
};
$("thm").onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;
  try{localStorage.setItem(TKEY,nx)}catch(e){}
};

/* ---------- import / export ---------- */
$("exp").onclick=async()=>{
  drawer(false);
  const f=fam(),txt=JSON.stringify({app:"Kinship",version:3,family:f},null,2);
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:"application/json"})),a=document.createElement("a");
    a.href=u;a.download=(f.name.replace(/[\\\/:*?"<>|\u0000-\u001f]/g,"").trim()||"family")+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }catch(e){}
  let copied=false;try{await navigator.clipboard.writeText(txt);copied=true}catch(e){}
  toast(copied?"Download started · JSON also copied to clipboard":"Download started");
};
async function importText(txt){
  try{
    const p=JSON.parse(txt),inc=p&&(p.family||p);
    if(!inc||typeof inc.name!=="string"||!Array.isArray(inc.members))throw new Error("This is not a valid family file.");
    const ms=clean(inc.members);
    if(ms.length!==inc.members.length)throw new Error("The file has an invalid or duplicate member.");
    if(cyc(ms))throw new Error("The file contains circular parent links.");
    const mp=new Map(ms.map(m=>[m.id,uid()])),me=mp.get(inc.me)||"";
    ms.forEach(m=>{m.id=mp.get(m.id);m.parents=m.parents.map(x=>mp.get(x));m.spouses=m.spouses.map(x=>mp.get(x))});
    if(!await dialog({title:"Import family?",text:`“${inc.name}” will be added as a new family.`,ok:"Import"}))return;
    const f={id:uid(),name:inc.name,members:ms,me};fams.push(f);aid=f.id;save();renderAll(true);toast("Imported");
  }catch(err){note("Import failed",err.message)}
}
$("imp").onclick=()=>{drawer(false);$("file").click()};
$("impP").onclick=async()=>{drawer(false);let t="";try{t=await navigator.clipboard.readText()}catch(e){return note("Import failed","Clipboard access isn’t available here. Use Import file instead.")}importText(t)};
$("file").onchange=e=>{
  const file=e.target.files?.[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{importText(rd.result);e.target.value=""};
  rd.onerror=()=>{note("Import failed","The file could not be read.");e.target.value=""};
  rd.readAsText(file);
};

/* ---------- search & keys ---------- */
const hits=()=>qs?fam().members.filter(m=>m.name.toLowerCase().includes(qs)):[];
function openSearch(){$("srch").classList.add("open");$("sq").value=qs;$("sq").focus();$("sq").select();updS()}
function closeSearch(clear){$("srch").classList.remove("open");if(clear){qs="";renderTree()}}
function updS(){qs=$("sq").value.trim().toLowerCase();const h=hits();$("sc").textContent=qs?(h.length?h.length+" found · Enter to jump":"No match"):"Type a name";renderTree()}
$("sq").oninput=updS;
$("sq").onkeydown=e=>{if(e.key==="Enter"){const h=hits();if(h[0]){closeSearch(false);fitView(new Set([h[0].id]))}}if(e.key==="Escape")closeSearch(true)};
$("srch").onclick=e=>{if(e.target===$("srch"))closeSearch(false)};
$("sBtn").onclick=openSearch;
document.addEventListener("keydown",e=>{
  if($("pres").classList.contains("open")){
    if(e.key==="Escape")closePres();
    else if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}
    else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(-1)}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){e.preventDefault();openSearch();return}
  if(e.key==="Escape"&&!$("dlg").classList.contains("open")){hideCtx();closeInfo(true);drawer(false);$("srch").classList.remove("open");if(qs){qs="";renderTree()}if(focus)clearFocus();if($("panel").classList.contains("open"))closePanel()}
});
let lw=innerWidth;
addEventListener("resize",()=>{if(innerWidth!==lw){lw=innerWidth;fitView()}});
document.querySelectorAll(".ib[title]").forEach(b=>b.setAttribute("aria-label",b.title));

load();renderAll(true);
</script>
