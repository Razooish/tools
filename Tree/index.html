<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f2f2;--card:#fafafa;--lt:40%;--fg:#222;--line:rgba(34,34,34,.15);--soft:rgba(34,34,34,.05);--mute:rgba(34,34,34,.55);--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#1e1e1e;--lt:64%;--fg:#dcdcdc;--line:rgba(220,220,220,.14);--soft:rgba(220,220,220,.06);--mute:rgba(220,220,220,.55)}}
:root[data-theme="dark"]{--bg:#161616;--card:#1e1e1e;--lt:64%;--fg:#dcdcdc;--line:rgba(220,220,220,.14);--soft:rgba(220,220,220,.06);--mute:rgba(220,220,220,.55)}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--mute)}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-button{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar h1{font:600 24px var(--serif);margin:0 auto 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:17px;line-height:1;flex-shrink:0}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500}
.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dng{text-decoration:underline;border:0;background:none;color:var(--mute);padding:8px 0}
.ib,.btn,.fam,.fa button,.tabs button,.ri,.chips span,.dng,.card rect,#ctx button,#ctx label{transition:background .18s,border-color .18s,color .18s,transform .18s,opacity .18s,stroke .18s,fill .18s}
.ib:hover{background:var(--soft);border-color:var(--fg);transform:translateY(-1px)}.btn:hover{background:var(--soft);border-color:var(--fg)}.pri:hover{background:var(--fg);opacity:.8}
#addBtn{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);height:44px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap}
#addBtn:hover{transform:translateX(-50%) translateY(-1px)}
#tree{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;transform:translateZ(0);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:26px 26px}
#tree.drag{cursor:grabbing}
#tree text{text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}
.card{cursor:pointer}.card rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.card:hover rect{stroke:var(--fg);stroke-width:2}.card.sel rect,.card.me rect{stroke:var(--fg);stroke-width:2.2}
.card.hit rect{fill:color-mix(in srgb,var(--fg) 20%,var(--card));stroke:var(--fg);stroke-width:2}
.nm{font:600 15px var(--serif);fill:var(--fg)}.dt{font:11px var(--sans);fill:var(--mute)}
.avt{font:600 14px var(--sans);fill:#262626;text-anchor:middle}.you{font:600 8px var(--sans);letter-spacing:1px;fill:var(--mute);text-anchor:end}
.ed{fill:none;stroke:var(--mute);stroke-width:1.3}.sp{stroke:var(--fg);stroke-width:1.3}
.ht{font-size:17px;fill:var(--fg);text-anchor:middle;dominant-baseline:central}.hb{fill:var(--bg)}
.hull{fill:transparent;stroke:transparent;stroke-width:1.2;stroke-dasharray:5 5;cursor:pointer;transition:.2s}.hull:hover,.hull.on{fill:var(--soft);stroke:var(--mute)}
.dim{opacity:.14}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rg label{margin:0}.rg input{display:none}.rg span{display:block;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--fg);cursor:pointer;background:var(--bg);transition:.18s}.rg span:hover{border-color:var(--fg);background:var(--soft)}.rg input:checked+span,.rg input:checked+span:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rgw{display:flex;flex-direction:column;gap:5px}.rgl{font-size:11px;color:var(--mute)}
.obw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ob{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:12px;transition:.18s}.ob:hover{background:var(--soft);border-color:var(--fg)}.ob b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:10px}.ob.cur{border-style:dashed}.ob.me{border-color:var(--fg);font-weight:600}
#info{position:fixed;inset:0;z-index:19;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.15)}#info.open{display:flex}.il{max-height:50vh;overflow-y:auto}.ir{display:flex;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);font-size:13px;cursor:pointer;transition:.18s}.ir:hover{background:var(--soft)}.ir i{width:10px;height:10px;border-radius:50%;flex-shrink:0}.ir span{flex:1}.ir input{width:auto;accent-color:var(--fg)}.ir b{color:var(--mute);font-weight:600}
.card.hl rect{fill:color-mix(in srgb,var(--c) 42%,var(--card));stroke:var(--c);stroke-width:2.4}
.fnode{cursor:pointer}.fnode:hover circle,circle.fnode:hover{fill:var(--soft)}.ed.fnode{pointer-events:stroke}.ed.fhl{stroke-width:3;opacity:1}#layer.hov .ed:not(.fhl){opacity:.12}
.arw{opacity:0;pointer-events:none;cursor:pointer;transition:opacity .18s}.arw circle{fill:var(--bg);stroke:var(--fg);stroke-width:1.2;transition:fill .18s}
.arw text{font:13px var(--sans);fill:var(--fg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.card:hover .arw,.card.sel .arw{opacity:1;pointer-events:auto}.arw:hover circle{fill:var(--fg)}.arw:hover text{fill:var(--bg)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;opacity:0;pointer-events:none;transition:.2s}.shade.on{opacity:1;pointer-events:auto}
aside,#panel{position:fixed;top:0;bottom:0;z-index:9;background:var(--bg);border:0 solid var(--line);transition:transform .25s;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
aside{left:0;width:280px;max-width:86vw;border-right-width:1px;transform:translateX(-100%)}aside.open{transform:none}
#panel{right:0;width:390px;max-width:100%;border-left-width:1px;transform:translateX(100%)}#panel.open{transform:none}
.brand{font:600 28px var(--serif);margin-bottom:22px}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.fam{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam:hover{background:var(--soft)}.fam.on{background:var(--fg);color:var(--bg)}.fam.on:hover{opacity:.85}
.frow{position:relative;display:flex;align-items:center}.frow .fam{padding-right:64px}
.fa{position:absolute;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .18s}.frow:hover .fa{opacity:1}
.fa button{width:26px;height:26px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--mute)}.fa button:hover{background:var(--soft);color:var(--fg)}
.fam.on+.fa button{color:var(--bg)}.fam.on+.fa button:hover{background:rgba(128,128,128,.3);color:var(--bg)}
@media(hover:none){.fa{opacity:1}}
#stat{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--mute);font-size:12px;white-space:nowrap;pointer-events:none}
.stat{color:var(--mute);font-size:12px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.ph h2{font:600 26px var(--serif);margin:0}
.fg{display:grid;grid-template-columns:1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--mute)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;outline:none;color:var(--fg);transition:border-color .18s}
input:hover,select:hover{border-color:var(--mute)}input:focus,select:focus{border-color:var(--fg)}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px;cursor:pointer}.chk input{width:auto;accent-color:var(--fg)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.add{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.add h3{margin:0 0 12px;font:600 18px var(--serif)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}.chips label{margin:0}.chips input{display:none}
.chips span{display:block;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--fg);cursor:pointer;background:var(--bg)}
.chips span:hover{border-color:var(--fg);background:var(--soft)}.chips input:checked+span,.chips input:checked+span:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tabs button{border-radius:999px;padding:5px 11px;font-size:12px}
.rc{background:color-mix(in srgb,var(--c) 22%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 50%,var(--bg))}
.tabs button.rc:hover,.ri.rc:hover{background:color-mix(in srgb,var(--c) 40%,var(--bg))}.tabs button.rc.on{background:var(--c);border-color:var(--c);color:#222}
.rl{max-height:230px;overflow-y:auto;padding-right:4px}
.ri{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:8px;margin-bottom:6px;text-align:left}.ri small{color:var(--mute);white-space:nowrap}
.ord{max-height:170px;overflow-y:auto;padding-right:4px}.or{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:13px}.or small{color:var(--mute)}.or.me{background:var(--fg);color:var(--bg)}.or.me small{color:var(--bg);opacity:.7}
#dlg,#srch{position:fixed;inset:0;z-index:20;display:none;padding:16px}
#dlg{place-items:center;background:rgba(0,0,0,.5)}#dlg.open{display:grid}
#srch{align-items:flex-start;justify-content:center;padding-top:90px;background:rgba(0,0,0,.18)}#srch.open{display:flex}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.box h3{font:600 24px var(--serif);margin:0}.box p{margin:0;color:var(--mute);line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
#empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;z-index:2}#empty h2{font:600 34px var(--serif);margin:0 0 14px}
#tip{position:fixed;z-index:15;display:none;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 11px;border-radius:8px;font-size:12px}
#ctx{position:fixed;z-index:25;display:none;flex-direction:column;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
#ctx button,#ctx label{display:flex;flex-direction:row;align-items:center;gap:8px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;color:var(--fg);cursor:pointer;width:100%}
#ctx button:hover,#ctx label:hover{background:var(--soft)}#ctx input{width:auto;accent-color:var(--fg)}
.cr{padding:8px 12px 8px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);margin-bottom:4px}.cr b{display:block;color:var(--fg);font:600 17px var(--serif)}
@media(max-width:640px){.bar h1,#zIn,#zOut,.lg{display:none}.ib{width:36px;height:36px}#sBtn{margin-left:auto}#addBtn{height:40px;padding:0 18px;font-size:14px}
#panel{width:100%;top:auto;height:80vh;border-left-width:0;border-top-width:1px;border-radius:18px 18px 0 0;transform:translateY(100%)}#srch{padding-top:70px}}
</style>
</head>
<body>

<div class="bar">
  <button class="ib" id="mBtn" title="Menu">☰</button>
  <h1 id="title"></h1>
  <button class="ib" id="zOut" title="Zoom out">−</button>
  <button class="ib" id="zIn" title="Zoom in">+</button>
  <button class="ib" id="fit" title="Fit to screen">⌂</button>
  <button class="ib" id="sBtn" title="Search (Ctrl+F)">⌕</button>
  <button class="ib" id="fs" title="Full screen">⛶</button>
  <button class="btn pri" id="addBtn">＋ Add <span class="lg">member</span></button>
</div>

<svg id="tree"><g id="layer"></g></svg>
<div id="empty"><div><h2>Begin your lineage</h2><button class="btn pri" id="first">Add first member</button></div></div>
<div id="stat"></div>
<div class="shade" id="shade"></div>

<aside id="drawer">
  <div class="brand">Kinship</div>
  <div class="lbl">Families</div>
  <div id="famList"></div>
  <button class="fam" id="newFam">＋ New family</button>
  <div class="lbl">Manage</div>
  <button class="fam" id="exp">Export</button>
  <button class="fam" id="imp">Import</button>
  <button class="fam" id="thm">Switch theme</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</aside>

<div id="panel"></div>
<div id="ctx"><div class="cr" id="cRel"></div><button id="cInfo">ⓘ Info &amp; relations</button><button id="cEdit">Edit member</button><button id="cDel">Delete member</button><label><input type="checkbox" id="cMe"> This is me</label></div>
<div id="tip"></div>
<div id="srch"><div class="box"><input id="sq" placeholder="Search members…" autocomplete="off"><div class="stat" id="sc">Type a name</div></div></div>
<div id="info"></div>
<div id="dlg"></div>
<div id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KEY="kinship_v2",TKEY="kinship_theme";
let fams=[],aid=null,sel=null,k=1,tx=0,ty=0,focus=null,qs="",pos=new Map(),meRels=null,lpT=0,lpFired=false,rf="All";
const fam=()=>fams.find(f=>f.id===aid);
const get=id=>fam()?.members.find(m=>m.id===id);
const mk=(name,gender,extra={})=>({id:uid(),name,gender:gender||"Not specified",birth:"",death:"",dead:false,parents:[],spouses:[],...extra});
const isDead=m=>!!(m.dead||m.death);
const GC=g=>g==="Female"?"#f3a5c3":g==="Male"?"#9dc4f2":"#c4c4c4";
const effP=m=>{const ps=m.parents.filter(p=>get(p));if(ps.length===1){const s=get(ps[0]).spouses;if(s.length===1&&get(s[0]))return[ps[0],s[0]]}return ps};
const gi=g=>g==="Male"?0:g==="Female"?1:2;
const ordCmp=ms=>(a,b)=>(a.rank&&b.rank&&a.rank!==b.rank)?a.rank-b.rank:(a.birth&&b.birth&&a.birth!==b.birth)?(a.birth<b.birth?-1:1):gi(a.gender)-gi(b.gender)||ms.indexOf(a)-ms.indexOf(b);
const parseNames=(s,g)=>String(s).split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const t=x.match(/\s*\((m|f)\)$/i);return{name:t?x.slice(0,t.index).trim():x,gender:t?(t[1].toLowerCase()==="f"?"Female":"Male"):g}}).filter(x=>x.name);
const lc=s=>s[0].toLowerCase()+s.slice(1);
const od=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({fams,aid}))}catch(e){}}
function seed(){
  const D=(id,n,g,p,s,x)=>({id,name:n,gender:g,birth:"",death:"",dead:!!x,parents:p,spouses:s}),M="Male",F="Female";
  return{id:uid(),name:"Mahabharata",members:[
    D("sh","Shantanu",M,[],["ga","sa"],1),D("ga","Ganga",F,[],["sh"]),D("sa","Satyavati",F,[],["sh"]),
    D("bh","Bhishma",M,["sh","ga"],[],1),D("vi","Vichitravirya",M,["sh","sa"],["am","ab"],1),
    D("am","Ambika",F,[],["vi"]),D("ab","Ambalika",F,[],["vi"]),
    D("dh","Dhritarashtra",M,["vi","am"],["gn"],1),D("gn","Gandhari",F,[],["dh"],1),
    D("pa","Pandu",M,["vi","ab"],["ku","ma"],1),D("ku","Kunti",F,[],["pa","su"]),D("ma","Madri",F,[],["pa"],1),
    D("su","Surya",M,[],["ku"]),D("ka","Karna",M,["su","ku"],[],1),
    D("yu","Yudhishthira",M,["pa","ku"],["dr"]),D("bm","Bhima",M,["pa","ku"],["dr"]),D("ar","Arjuna",M,["pa","ku"],["dr"]),
    D("na","Nakula",M,["pa","ma"],["dr"]),D("sd","Sahadeva",M,["pa","ma"],["dr"]),D("dr","Draupadi",F,[],["yu","bm","ar","na","sd"]),
    D("du","Duryodhana",M,["dh","gn"],[],1),D("ds","Dushasana",M,["dh","gn"],[],1),D("dj","Dussaha",M,["dh","gn"],[],1),
    D("dm","Durmukha",M,["dh","gn"],[],1),D("vk","Vikarna",M,["dh","gn"],[],1),D("cs","Chitrasena",M,["dh","gn"],[],1),
    D("vv","Vivinshati",M,["dh","gn"],[],1),D("dy","Durjaya",M,["dh","gn"],[],1),
    D("dl","Dussala",F,["dh","gn"],["jd"]),D("jd","Jayadratha",M,[],["dl"],1)
  ]};
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.fams)&&d.fams.length){fams=d.fams;aid=fams.some(f=>f.id===d.aid)?d.aid:fams[0].id}}catch(e){}
  const n0=fams.length;
  fams=fams.filter(f=>!(f.name==="Sharma Family"&&f.members.length===6&&f.members[0].id==="a"));
  if(!fams.length||fams.length<n0){const f=seed();fams.unshift(f);aid=f.id;save()}
  fams.forEach(f=>f.members.forEach(m=>{if(!Array.isArray(m.spouses))m.spouses=m.spouse?[m.spouse]:[];delete m.spouse;delete m.notes;m.parents=m.parents||[];m.birth=m.birth||"";m.death=m.death||""}));
  try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
}

/* ---------- ui helpers ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}
function dialog({title,text,fields=[],ok="Confirm",cancel="Cancel"}){
  return new Promise(res=>{
    const m=$("dlg");
    const inp=f=>f.radio?`<div class="rg">${f.options.map(o=>`<label><input type="radio" name="f_${f.id}" value="${esc(o)}"${o===f.value?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`:f.options?`<select id="f_${f.id}">${f.options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===f.value?" selected":""}>${esc(t)}</option>`}).join("")}</select>`:`<input id="f_${f.id}" value="${esc(f.value)}" placeholder="${esc(f.ph)}" autocomplete="off">`;
    m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:""}${fields.map(f=>f.radio?`<div class="rgw"><span class="rgl">${esc(f.label)}</span>${inp(f)}</div>`:`<label>${esc(f.label)}${inp(f)}</label>`).join("")}<div class="row">${cancel?`<button class="btn" id="dX">${esc(cancel)}</button>`:""}<button class="btn pri" id="dOk">${esc(ok)}</button></div></div>`;
    m.classList.add("open");

/* ---------- relationship engine ---------- */
const CATS=["Spouses","Parents","Step-parents","Siblings","Step-siblings","Children","Step-children","Grandparents","Great-grandparents","Grandchildren","Great-grandchildren","Uncles","Aunts","Cousins","Second cousins","Nephews","Nieces","In-laws","Other kin"];

  up[1].forEach(x=>add(x,G(x,"Father","Mother","Parent"),"Parents"));

  }));

function connected(a,b){

/* ---------- layout ---------- */
const W=176,H=64,S=64,GY=170;

    while(st.length){const x=st.pop();if(unitOf.has(x.id)||comp.includes(x))continue;comp.push(x);x.spouses.forEach(s=>by.has(s)&&st.push(by.get(s)))}

  });

  });
  const GX=36,P=new Map(),uw=u=>u.m.length*W+(u.m.length-1)*S,hasPar=m=>m.parents.some(p=>by.has(p));
  function claim(u,d){
    u.d=d;u.kids=[];
    u.ch.forEach(c=>{if(!c.vis){c.vis=true;u.kids.push(c)}});
    u.kids.forEach(c=>claim(c,d+1));
    u.sw=Math.max(uw(u),u.kids.reduce((a,c)=>a+c.sw,0)+GX*Math.max(0,u.kids.length-1));
  }
  function place(u,left){
    const tot=u.kids.reduce((a,c)=>a+c.sw,0)+GX*Math.max(0,u.kids.length-1);
    let cur=left+(u.sw-tot)/2;

}

function addRelative(m,rel,names,gender,other,oname){

  });

function linkRel(m,rel,id){

  fams.forEach(x=>{
    const r=document.createElement("div");r.className="frow";
    r.innerHTML=`<button class="fam${x.id===aid?" on":""}"></button><span class="fa"><button data-a="r" title="Rename">✎</button><button data-a="d" title="Delete">✕</button></span>`;
    const b=r.firstChild;b.textContent=x.name;
    b.onclick=()=>{aid=x.id;sel=null;focus=null;$("panel").classList.remove("open");save();renderAll(true);drawer(false)};
    r.querySelector('[data-a="r"]').onclick=e=>{e.stopPropagation();renFam(x.id)};
    r.querySelector('[data-a="d"]').onclick=e=>{e.stopPropagation();delFam(x.id)};
    $("famList").appendChild(r);
  });
  renderTree(refit);
  const n=f.members.length,g=n?new Set([...pos.values()].map(p=>p.y)).size:0;
  $("stat").textContent=`${n} member${n===1?"":"s"} · ${g} generation${g===1?"":"s"}`;
}
async function renFam(id){
  const x=fams.find(f=>f.id===id);drawer(false);
  const r=await dialog({title:"Rename family",fields:[{id:"n",label:"Name",value:x.name}],ok:"Save"});
  if(!r||!r.n)return;x.name=r.n;save();renderAll();
}
async function delFam(id){
  const x=fams.find(f=>f.id===id);drawer(false);
  if(!await dialog({title:"Delete family?",text:`“${x.name}” and all its members will be removed.`,ok:"Delete"}))return;
  fams=fams.filter(f=>f.id!==id);
  if(!fams.length)fams=[{id:uid(),name:"My Family",members:[]}];
  if(aid===id){aid=fams[0].id;sel=null;focus=null;$("panel").classList.remove("open")}
  save();renderAll(true);
}
$("mBtn").onclick=()=>drawer(true);
$("shade").onclick=()=>{drawer(false);if($("panel").classList.contains("open"))closePanel()};
$("zIn").onclick=()=>zoom(1.2);$("zOut").onclick=()=>zoom(.83);$("fit").onclick=()=>fitView();
$("addBtn").onclick=addMember;$("first").onclick=addMember;
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){toast("Full screen unavailable")}};
$("newFam").onclick=async()=>{
  drawer(false);
  const r=await dialog({title:"New family",fields:[{id:"n",label:"Name",ph:"e.g. Thapa Family"}],ok:"Create"});
  if(!r||!r.n)return;
  const f={id:uid(),name:r.n,members:[]};fams.push(f);aid=f.id;save();renderAll(true);
};
$("thm").onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;
  try{localStorage.setItem(TKEY,nx)}catch(e){}
};

/* ---------- import / export ---------- */
$("exp").onclick=()=>{
  drawer(false);
  const f=fam(),b=new Blob([JSON.stringify({app:"Kinship",version:3,family:f},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=f.name.replace(/[^a-z0-9]/gi,"_")+".json";a.click();URL.revokeObjectURL(u);toast("Exported");
};
$("imp").onclick=()=>{drawer(false);$("file").click()};
$("file").onchange=e=>{
  const file=e.target.files?.[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const p=JSON.parse(rd.result),inc=p.family||p;
      if(!inc||typeof inc.name!=="string"||!Array.isArray(inc.members))throw new Error("This is not a valid family file.");
      const ids=new Set();
      inc.members.forEach(m=>{if(!m||typeof m.id!=="string"||typeof m.name!=="string"||ids.has(m.id))throw new Error("The file has an invalid or duplicate member.");ids.add(m.id)});
      const ms=inc.members.map(m=>({id:m.id,name:m.name,gender:m.gender||"Not specified",birth:m.birth||"",death:m.death||"",dead:!!(m.dead||m.death),
        parents:Array.isArray(m.parents)?[...new Set(m.parents)].filter(x=>ids.has(x)&&x!==m.id).slice(0,2):[],
        spouses:[...new Set(Array.isArray(m.spouses)?m.spouses:m.spouse?[m.spouse]:[])].filter(x=>ids.has(x)&&x!==m.id)}));
      const by=new Map(ms.map(m=>[m.id,m]));
      const reach=(a,t,v=new Set())=>{if(a===t)return true;if(v.has(a))return false;v.add(a);return by.get(a).parents.some(x=>reach(x,t,v))};
      if(ms.some(m=>m.parents.some(p=>reach(p,m.id))))throw new Error("The file contains circular parent links.");
      ms.forEach(m=>m.spouses=m.spouses.filter(s=>by.get(s).spouses.includes(m.id)));
      if(!await dialog({title:"Import family?",text:`“${inc.name}” will be added as a new family.`,ok:"Import"}))return;
      const f={id:uid(),name:inc.name,members:ms,me:ids.has(inc.me)?inc.me:""};fams.push(f);aid=f.id;save();renderAll(true);toast("Imported");
    }catch(err){note("Import failed",err.message)}
    finally{e.target.value=""}
  };
  rd.onerror=()=>note("Import failed","The file could not be read.");
  rd.readAsText(file);
};

/* ---------- search & keys ---------- */
const hits=()=>qs?fam().members.filter(m=>m.name.toLowerCase().includes(qs)):[];
function openSearch(){$("srch").classList.add("open");$("sq").value=qs;$("sq").focus();$("sq").select();updS()}
function closeSearch(clear){$("srch").classList.remove("open");if(clear){qs="";renderTree()}}
function updS(){qs=$("sq").value.trim().toLowerCase();const h=hits();$("sc").textContent=qs?(h.length?h.length+" found · Enter to jump":"No match"):"Type a name";renderTree()}
$("sq").oninput=updS;
$("sq").onkeydown=e=>{if(e.key==="Enter"){const h=hits();if(h[0]){closeSearch(false);fitView(new Set([h[0].id]))}}if(e.key==="Escape")closeSearch(true)};
$("srch").onclick=e=>{if(e.target===$("srch"))closeSearch(false)};
$("sBtn").onclick=openSearch;
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){e.preventDefault();openSearch();return}
  if(e.key==="Escape"&&!$("dlg").classList.contains("open")){hideCtx();closeInfo(true);drawer(false);$("srch").classList.remove("open");if(qs){qs="";renderTree()}if(focus)clearFocus();if($("panel").classList.contains("open"))closePanel()}
});
addEventListener("resize",()=>fitView());

load();renderAll(true);
</script>
