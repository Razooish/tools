<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites</title>
    <style>
         :root {
            --bg: #f5f4f0;
            --surface: #ffffff;
            --ink: #1b1c1f;
            --muted: #85858c;
            --line: #e4e2db;
            --accent: #3b4cca;
            --accent-ink: #ffffff;
            --danger: #d6455d;
            --scrim: rgba(24, 24, 30, .38);
            --shadow: 0 1px 2px rgba(20, 20, 30, .04), 0 10px 28px -14px rgba(20, 20, 30, .16);
            --pop: 0 18px 50px -12px rgba(20, 20, 30, .28);
            --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Avenir Next", "Nunito", "Helvetica Neue", system-ui, sans-serif;
        }
        
        :root[data-theme="dark"] {
            --bg: #121317;
            --surface: #1b1c22;
            --ink: #ececf0;
            --muted: #7f808a;
            --line: #2b2c35;
            --accent: #8c9bff;
            --accent-ink: #12131a;
            --danger: #ff6b85;
            --scrim: rgba(0, 0, 0, .6);
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .6);
            --pop: 0 18px 50px -12px rgba(0, 0, 0, .7);
        }
        
        * {
            box-sizing: border-box;
            margin: 0
        }
        
        html {
            color-scheme: light
        }
        
        :root[data-theme="dark"] {
            color-scheme: dark
        }
        
        [hidden] {
            display: none!important
        }
        
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            min-height: 100vh;
            transition: background .3s, color .3s;
            -webkit-font-smoothing: antialiased
        }
        
        button,
        input {
            font: inherit;
            color: inherit
        }
        
        .wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 28px 24px 96px
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 52px;
            gap: 12px
        }
        
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.02em
        }
        
        h1 a {
            color: inherit;
            text-decoration: none
        }
        
        .tools {
            display: flex;
            gap: 8px;
            align-items: center
        }
        
        .pill {
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            text-decoration: none;
            transition: all .2s;
            white-space: nowrap
        }
        
        .pill:hover {
            border-color: var(--muted)
        }
        
        .pill.on {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent)
        }
        
        .pill svg {
            width: 16px;
            height: 16px;
            flex: none
        }
        
        .theme {
            width: 40px;
            padding: 0;
            justify-content: center
        }
        
        .theme svg {
            width: 18px;
            height: 18px;
            transition: transform .25s
        }
        
        .theme:hover svg {
            transform: rotate(25deg)
        }
        
        .sun {
            display: none
        }
        
        :root[data-theme="dark"] .sun {
            display: block
        }
        
        :root[data-theme="dark"] .moon {
            display: none
        }
        
        .bar {
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px;
            box-shadow: var(--shadow);
            transition: border-color .2s
        }
        
        .bar:focus-within {
            border-color: var(--accent)
        }
        
        .bar input {
            background: transparent;
            border: 0;
            outline: 0;
            padding: 12px 18px;
            min-width: 0
        }
        
        .bar input::placeholder {
            color: var(--muted)
        }
        
        #url {
            flex: 1
        }
        
        .catbtn {
            flex: none;
            width: 180px;
            border: 0;
            border-left: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            padding: 0 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            text-align: left;
            transition: color .2s
        }
        
        .catbtn:hover {
            color: var(--ink)
        }
        
        .catbtn.has {
            color: var(--ink)
        }
        
        .catbtn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .catbtn svg {
            width: 14px;
            height: 14px;
            flex: none
        }
        
        .btn {
            border: 0;
            border-radius: 999px;
            padding: 0 24px;
            height: 44px;
            cursor: pointer;
            font-weight: 600;
            background: var(--accent);
            color: var(--accent-ink);
            transition: transform .15s, opacity .2s
        }
        
        .btn:hover {
            opacity: .9
        }
        
        .btn:active {
            transform: scale(.96)
        }
        
        .btn.sm {
            height: 34px;
            padding: 0 16px;
            font-size: 13px
        }
        
        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }
        
        .btn.ghost:hover {
            background: var(--bg);
            opacity: 1
        }
        
        .btn.danger {
            background: var(--danger);
            color: #fff
        }
        
        .err {
            min-height: 20px;
            margin: 10px 0 0 22px;
            font-size: 13px;
            color: var(--danger)
        }
        
        .chips {
            position: relative;
            margin: 22px -24px 30px
        }
        
        .chips-in {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 24px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%)
        }
        
        .chips-in::-webkit-scrollbar {
            display: none
        }
        
        .chip {
            flex: none;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all .2s
        }
        
        .chip:hover {
            color: var(--ink);
            border-color: var(--muted)
        }
        
        .chip.on {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink)
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px
        }
        
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding: 22px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform .25s cubic-bezier(.2, .8, .2, 1), border-color .2s, box-shadow .2s;
            -webkit-touch-callout: none;
            user-select: none
        }
        
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--muted)
        }
        
        .card.ctx {
            border-color: var(--accent)
        }
        
        .card:focus-visible,
        .chip:focus-visible,
        .pill:focus-visible,
        .btn:focus-visible,
        .mi:focus-visible,
        .catbtn:focus-visible,
        h1 a:focus-visible,
        .glink:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }
        
        .ico {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
            flex: none
        }
        
        .ico img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: inherit
        }
        
        .ico.s {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 12px
        }
        
        .ico.s img {
            padding: 4px
        }
        
        .t {
            font-weight: 600;
            font-size: 17px;
            letter-spacing: -.01em;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .h {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .c {
            position: absolute;
            top: 24px;
            right: 22px;
            font-size: 12px;
            color: var(--muted);
            max-width: 92px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .check {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--bg);
            display: grid;
            place-items: center;
            transition: all .2s
        }
        
        .check svg {
            width: 14px;
            height: 14px;
            opacity: 0;
            stroke: var(--accent-ink);
            transform: scale(.6);
            transition: all .2s
        }
        
        .grouping .card {
            cursor: pointer
        }
        
        .card.picked {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), var(--shadow)
        }
        
        .card.picked .check {
            background: var(--accent);
            border-color: var(--accent)
        }
        
        .card.picked .check svg {
            opacity: 1;
            transform: none
        }
        
        .empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--muted);
            padding: 72px 0
        }
        
        .card.pop {
            animation: pop .4s cubic-bezier(.2, .9, .3, 1.3)
        }
        
        @keyframes pop {
            from {
                transform: scale(.88);
                opacity: 0
            }
        }
        
        .gfab {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            height: 44px;
            padding: 0 22px;
            box-shadow: var(--pop);
            animation: drop .25s cubic-bezier(.2, .9, .3, 1.2)
        }
        
        @keyframes drop {
            from {
                transform: translate(-50%, -14px);
                opacity: 0
            }
        }
        
        .groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px
        }
        
        .gcard {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--shadow);
            transition: border-color .2s
        }
        
        .gcard.ctx {
            border-color: var(--accent)
        }
        
        .ghead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px
        }
        
        .gt {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.015em;
            line-height: 1.25;
            word-break: break-word
        }
        
        .gn {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px
        }
        
        .glist {
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        
        .glink {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            margin: 0 -8px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: background .15s
        }
        
        .glink:hover {
            background: var(--bg)
        }
        
        .glink span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px
        }
        
        .menu {
            position: fixed;
            z-index: 50;
            min-width: 176px;
            padding: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--pop);
            transform-origin: top left;
            animation: menu .14s ease-out
        }
        
        @keyframes menu {
            from {
                transform: scale(.94);
                opacity: 0
            }
        }
        
        .mi {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            text-align: left
        }
        
        .mi:hover,
        .mi:focus-visible {
            background: var(--bg)
        }
        
        .mi.danger {
            color: var(--danger)
        }
        
        .mi svg {
            width: 16px;
            height: 16px;
            flex: none
        }
        
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: var(--scrim);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            padding: 20px;
            animation: fade .2s
        }
        
        @keyframes fade {
            from {
                opacity: 0
            }
        }
        
        .modal {
            width: 100%;
            max-width: 420px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--pop);
            animation: rise .28s cubic-bezier(.2, .9, .3, 1.1)
        }
        
        @keyframes rise {
            from {
                transform: translateY(14px) scale(.96);
                opacity: 0
            }
        }
        
        .mh {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px
        }
        
        .modal h2 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.015em
        }
        
        .mh .cnt {
            font-size: 13px;
            color: var(--muted)
        }
        
        .modal p {
            color: var(--muted);
            line-height: 1.5;
            margin: -8px 0 24px;
            font-size: 15px
        }
        
        .modal p b {
            color: var(--ink);
            font-weight: 600
        }
        
        .f {
            display: block;
            margin-bottom: 14px
        }
        
        .f>span {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 6px 4px
        }
        
        .f input {
            width: 100%;
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            outline: 0;
            transition: border-color .2s
        }
        
        .f input:focus {
            border-color: var(--accent)
        }
        
        .row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px
        }
        
        .row .btn {
            padding: 0 22px
        }
        
        .merr {
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
            margin: -4px 0 0 4px
        }
        
        .picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }
        
        .opt {
            position: relative;
            cursor: pointer
        }
        
        .opt input {
            position: absolute;
            opacity: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer
        }
        
        .opt span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--bg);
            font-size: 14px;
            color: var(--muted);
            transition: all .15s
        }
        
        .opt:hover span {
            color: var(--ink);
            border-color: var(--muted)
        }
        
        .opt input:checked+span {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink)
        }
        
        .opt input:disabled {
            cursor: not-allowed
        }
        
        .opt input:disabled+span {
            opacity: .4
        }
        
        .opt input:focus-visible+span {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }
        
        .sellist {
            max-height: 190px;
            overflow-y: auto;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        
        .selrow {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 4px;
            font-size: 15px
        }
        
        .selrow span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            background: var(--ink);
            color: var(--bg);
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 14px;
            box-shadow: var(--pop);
            animation: drop2 .25s ease-out
        }
        
        @keyframes drop2 {
            from {
                transform: translate(-50%, 10px);
                opacity: 0
            }
        }
        
        @media (max-width:620px) {
            .bar {
                flex-wrap: wrap;
                border-radius: 26px
            }
            #url {
                flex-basis: 100%
            }
            .catbtn {
                flex: 1;
                width: auto;
                border-left: 0;
                border-top: 1px solid var(--line);
                height: 44px
            }
            .pill .lbl {
                display: none
            }
            .pill {
                padding: 0 12px
            }
            .gfab {
                top: 70px
            }
        }
        
        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none!important;
                transition: none!important
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1><a href="#" id="home-link">Favorites</a></h1>
            <div class="tools">
                <a class="pill" id="groupsLink" href="#groups" aria-label="Groups">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span class="lbl">Groups</span>
                </a>
                <button class="pill" id="groupMode" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg>
        <span class="lbl">Group</span>
      </button>
                <button class="pill theme" id="theme" type="button" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
            </div>
        </header>

        <section id="homeView">
            <div class="bar">
                <input id="url" type="text" placeholder="Paste a link you love" aria-label="Website link" autocomplete="off" spellcheck="false">
                <button class="catbtn" id="catBtn" type="button"><span id="catLabel">Category</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
                <button class="btn" id="save" type="button">Save</button>
            </div>
            <div class="err" id="err" role="alert"></div>
            <div class="chips" id="chips" hidden>
                <div class="chips-in" id="chipsIn"></div>
            </div>
            <main class="grid" id="grid"></main>
        </section>

        <section id="groupsView" hidden>
            <div class="groups" id="groups"></div>
        </section>
    </div>

    <button class="pill on gfab" id="gfab" type="button" hidden></button>

    <script>
        (function() {
            var KEY = 'favorites.v3',
                OLD = 'favorites.v2',
                GKEY = 'favorites.groups',
                THEME = 'favorites.theme';
            var MAX = 5;
            var BASE = ['Work', 'Design', 'Development', 'News', 'Learning', 'Reading', 'Tools', 'Shopping', 'Entertainment', 'Music', 'Social', 'Finance', 'Travel', 'Health', 'Food', 'Inspiration'];
            var items = [],
                groups = [],
                filter = 'All',
                newCats = [],
                grouping = false,
                sel = {};
            var $ = function(id) {
                return document.getElementById(id)
            };
            var store = {
                get: function(k) {
                    try {
                        return localStorage.getItem(k)
                    } catch (e) {
                        return null
                    }
                },
                set: function(k, v) {
                    try {
                        localStorage.setItem(k, v)
                    } catch (e) {}
                }
            };
            try {
                items = JSON.parse(store.get(KEY) || store.get(OLD)) || []
            } catch (e) {
                items = []
            }
            try {
                groups = JSON.parse(store.get(GKEY)) || []
            } catch (e) {
                groups = []
            }
            if (!Array.isArray(items)) items = [];
            if (!Array.isArray(groups)) groups = [];
            items.forEach(function(it) {
                if (!it.cats) {
                    it.cats = it.cat ? [it.cat] : []
                }
                delete it.cat
            });

            /* theme */
            var root = document.documentElement;
            var st = store.get(THEME);
            if (st) root.setAttribute('data-theme', st);
            else if (window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) root.setAttribute('data-theme', 'dark');
            $('theme').addEventListener('click', function() {
                var n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', n);
                store.set(THEME, n);
            });

            /* helpers */
            function save() {
                store.set(KEY, JSON.stringify(items));
                store.set(GKEY, JSON.stringify(groups))
            }

            function esc(s) {
                return String(s).replace(/[&<>"']/g, function(c) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[c]
                })
            }

            function hue(s) {
                var h = 0;
                for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
                return h
            }

            function find(id) {
                for (var i = 0; i < items.length; i++)
                    if (items[i].id === id) return items[i]
            }

            function arr(x) {
                return [].slice.call(x)
            }

            function parse(raw) {
                raw = (raw || '').trim();
                if (!raw || /\s/.test(raw)) return null;
                if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) raw = 'https://' + raw;
                try {
                    var u = new URL(raw);
                    if (!/^(https?|ftp):$/.test(u.protocol) || !u.hostname) return null;
                    return u;
                } catch (e) {
                    return null
                }
            }

            function hostOf(u) {
                return u.hostname.replace(/^www\./, '')
            }

            function titleOf(u) {
                var host = hostOf(u);
                if (/^[\d.]+$/.test(host) || host.indexOf(':') > -1 || host.indexOf('.') < 0) return host;
                var p = host.split('.');
                var base = (p.length > 2 && p[p.length - 2].length <= 3) ? p[p.length - 3] : p[p.length - 2];
                return base.charAt(0).toUpperCase() + base.slice(1);
            }

            function icon(it, cls) {
                return '<div class="ico ' + (cls || '') + '" style="background:hsl(' + hue(it.host) + ' 55% 52%)">' + esc((it.title[0] || '?').toUpperCase()) +
                    '<img src="https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(it.host) + '" alt="" onerror="this.remove()" onload="if(this.naturalWidth<=16)this.remove()"></div>';
            }

            function allCats() {
                var c = BASE.slice();
                items.forEach(function(it) {
                    it.cats.forEach(function(x) {
                        if (c.indexOf(x) < 0) c.push(x)
                    })
                });
                return c;
            }

            function toast(msg) {
                var t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(function() {
                    t.remove()
                }, 3000);
            }
            var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

            /* render home */
            function render() {
                var used = [];
                items.forEach(function(it) {
                    it.cats.forEach(function(c) {
                        if (used.indexOf(c) < 0) used.push(c)
                    })
                });
                used.sort();
                if (filter !== 'All' && used.indexOf(filter) < 0) filter = 'All';

                var inner = $('chipsIn'),
                    prev = inner.scrollLeft;
                $('chips').hidden = !used.length;
                inner.innerHTML = ['All'].concat(used).map(function(c) {
                    return '<button type="button" class="chip' + (c === filter ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>';
                }).join('');
                inner.style.scrollBehavior = 'auto';
                inner.scrollLeft = prev;
                inner.style.scrollBehavior = '';

                var list = items.filter(function(x) {
                    return filter === 'All' || x.cats.indexOf(filter) > -1
                });
                $('grid').innerHTML = list.length ? list.map(function(x) {
                    var label = x.cats.length ? esc(x.cats[0]) + (x.cats.length > 1 ? ' +' + (x.cats.length - 1) : '') : '';
                    return '<a class="card' + (sel[x.id] ? ' picked' : '') + '" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" data-id="' + x.id + '">' +
                        icon(x) +
                        '<div><div class="t">' + esc(x.title) + '</div><div class="h">' + esc(x.host) + '</div></div>' +
                        (grouping ? '<span class="check">' + CHECK + '</span>' : (label ? '<span class="c">' + label + '</span>' : '')) + '</a>';
                }).join('') : '<div class="empty">Your saved sites will appear here.</div>';
                $('grid').classList.toggle('grouping', grouping);
                updateFab();
            }

            /* render groups */
            function renderGroups() {
                groups = groups.filter(function(g) {
                    g.ids = g.ids.filter(function(id) {
                        return find(id)
                    });
                    return g.ids.length
                });
                $('groups').innerHTML = groups.length ? groups.map(function(g) {
                    return '<div class="gcard" data-gid="' + g.id + '"><div class="ghead"><div><div class="gt">' + esc(g.title) + '</div><div class="gn">' + g.ids.length + (g.ids.length === 1 ? ' link' : ' links') + '</div></div>' +
                        '<button class="btn sm" type="button" data-open="' + g.id + '">Open all</button></div><div class="glist">' +
                        g.ids.map(function(id) {
                            var it = find(id);
                            return '<a class="glink" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + icon(it, 's') + '<span>' + esc(it.title) + '</span></a>'
                        }).join('') +
                        '</div></div>';
                }).join('') : '<div class="empty" style="grid-column:1/-1">Groups you create will appear here.</div>';
            }

            /* routing */
            function route() {
                var g = location.hash === '#groups';
                $('homeView').hidden = g;
                $('groupsView').hidden = !g;
                $('groupMode').hidden = g;
                $('groupsLink').classList.toggle('on', g);
                if (g) {
                    setGrouping(false);
                    renderGroups()
                } else render();
                closeMenu();
            }
            window.addEventListener('hashchange', route);

            /* category label on add bar */
            function catLabel() {
                var n = newCats.length;
                $('catLabel').textContent = n === 0 ? 'Category' : n === 1 ? newCats[0] : n + ' categories';
                $('catBtn').classList.toggle('has', n > 0);
            }

            /* add */
            function add() {
                var u = parse($('url').value);
                if (!u) {
                    $('err').textContent = 'That link doesn\u2019t look right. Try something like example.com';
                    return
                }
                items.unshift({
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                    url: u.href,
                    host: hostOf(u),
                    title: titleOf(u),
                    cats: newCats.slice()
                });
                save();
                $('err').textContent = '';
                $('url').value = '';
                newCats = [];
                catLabel();
                filter = 'All';
                render();
                var f = $('grid').querySelector('.card');
                if (f) f.classList.add('pop');
                $('url').focus();
            }
            $('save').addEventListener('click', add);
            $('url').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    add()
                }
            });
            $('url').addEventListener('input', function() {
                $('err').textContent = ''
            });

            /* chips */
            $('chipsIn').addEventListener('click', function(e) {
                var b = e.target.closest('.chip');
                if (!b) return;
                filter = b.getAttribute('data-c');
                render();
                var on = $('chipsIn').querySelector('.chip.on');
                if (on && on.scrollIntoView) on.scrollIntoView({
                    inline: 'center',
                    block: 'nearest',
                    behavior: 'smooth'
                });
            });
            $('chipsIn').addEventListener('wheel', function(e) {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    this.scrollLeft += e.deltaY;
                    e.preventDefault()
                }
            }, {
                passive: false
            });

            /* modal base */
            var scrim = null;

            function closeModal() {
                if (scrim) {
                    scrim.remove();
                    scrim = null
                }
            }

            function openModal(html) {
                closeModal();
                scrim = document.createElement('div');
                scrim.className = 'scrim';
                scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
                document.body.appendChild(scrim);
                scrim.addEventListener('mousedown', function(e) {
                    if (e.target === scrim) closeModal()
                });
                return scrim;
            }

            /* category picker */
            function pickerHTML(selected) {
                return '<div class="picker">' + allCats().map(function(c) {
                    return '<label class="opt"><input type="checkbox" value="' + esc(c) + '"' + (selected.indexOf(c) > -1 ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
                }).join('') + '</div>';
            }

            function bindPicker(box, onChange) {
                function sync(changed) {
                    var boxes = arr(box.querySelectorAll('input')),
                        n = boxes.filter(function(b) {
                            return b.checked
                        }).length;
                    if (n > MAX && changed) {
                        changed.checked = false;
                        n = MAX
                    }
                    boxes.forEach(function(b) {
                        b.disabled = !b.checked && n >= MAX
                    });
                    if (onChange) onChange(n);
                }
                box.addEventListener('change', function(e) {
                    sync(e.target)
                });
                sync();
            }

            function picked(box) {
                return arr(box.querySelectorAll('input')).filter(function(b) {
                    return b.checked
                }).map(function(b) {
                    return b.value
                })
            }

            function catModal() {
                var s = openModal('<div class="mh"><h2>Choose categories</h2><span class="cnt" id="cc"></span></div>' + pickerHTML(newCats) +
                    '<div class="row"><button class="btn ghost" type="button" id="cClear">Clear</button><button class="btn" type="button" id="cDone">Done</button></div>');
                var box = s.querySelector('.picker');
                bindPicker(box, function(n) {
                    s.querySelector('#cc').textContent = n + ' of ' + MAX
                });
                s.querySelector('#cClear').addEventListener('click', function() {
                    arr(box.querySelectorAll('input')).forEach(function(b) {
                        b.checked = false
                    });
                    box.dispatchEvent(new Event('change'));
                });
                s.querySelector('#cDone').addEventListener('click', function() {
                    newCats = picked(box);
                    catLabel();
                    closeModal()
                });
            }
            $('catBtn').addEventListener('click', catModal);

            /* context menu */
            var menuEl = null,
                menuTarget = null;
            var IE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
            var ID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

            function closeMenu() {
                if (menuEl) {
                    menuEl.remove();
                    menuEl = null
                }
                if (menuTarget) {
                    menuTarget.classList.remove('ctx');
                    menuTarget = null
                }
            }

            function openMenu(card, x, y, onEdit, onDel) {
                closeMenu();
                menuTarget = card;
                card.classList.add('ctx');
                var m = document.createElement('div');
                m.className = 'menu';
                m.setAttribute('role', 'menu');
                m.innerHTML = '<button class="mi" type="button" role="menuitem" data-a="e">' + IE + 'Edit</button><button class="mi danger" type="button" role="menuitem" data-a="d">' + ID + 'Delete</button>';
                document.body.appendChild(m);
                menuEl = m;
                m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px';
                m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
                m.addEventListener('click', function(e) {
                    var b = e.target.closest('.mi');
                    if (!b) return;
                    var a = b.getAttribute('data-a');
                    closeMenu();
                    if (a === 'e') onEdit();
                    else onDel();
                });
                m.querySelector('.mi').focus();
            }

            function ctxAt(e, el) {
                var r = el.getBoundingClientRect();
                return [e.clientX || r.left + 20, e.clientY || r.top + 20]
            }
            $('grid').addEventListener('contextmenu', function(e) {
                var c = e.target.closest('.card');
                if (!c || grouping) return;
                e.preventDefault();
                var p = ctxAt(e, c),
                    id = c.getAttribute('data-id');
                openMenu(c, p[0], p[1], function() {
                    editModal(id)
                }, function() {
                    delModal(id)
                });
            });
            $('groups').addEventListener('contextmenu', function(e) {
                var c = e.target.closest('.gcard');
                if (!c) return;
                e.preventDefault();
                var p = ctxAt(e, c),
                    id = c.getAttribute('data-gid');
                openMenu(c, p[0], p[1], function() {
                    renameGroup(id)
                }, function() {
                    delGroup(id)
                });
            });
            document.addEventListener('mousedown', function(e) {
                if (menuEl && !menuEl.contains(e.target)) closeMenu()
            });
            window.addEventListener('scroll', closeMenu, true);
            window.addEventListener('resize', closeMenu);
            var lp = null,
                lpFired = false;

            function longPress(host, sel2, fn) {
                host.addEventListener('touchstart', function(e) {
                    var c = e.target.closest(sel2);
                    if (!c) return;
                    lpFired = false;
                    var t = e.touches[0];
                    lp = setTimeout(function() {
                        lpFired = true;
                        fn(c, t.clientX, t.clientY)
                    }, 550);
                }, {
                    passive: true
                });
                ['touchend', 'touchmove', 'touchcancel'].forEach(function(n) {
                    host.addEventListener(n, function() {
                        clearTimeout(lp)
                    }, {
                        passive: true
                    })
                });
                host.addEventListener('click', function(e) {
                    if (lpFired) {
                        e.preventDefault();
                        e.stopPropagation();
                        lpFired = false
                    }
                }, true);
            }
            longPress($('grid'), '.card', function(c, x, y) {
                if (grouping) return;
                var id = c.getAttribute('data-id');
                openMenu(c, x, y, function() {
                    editModal(id)
                }, function() {
                    delModal(id)
                })
            });
            longPress($('groups'), '.gcard', function(c, x, y) {
                var id = c.getAttribute('data-gid');
                openMenu(c, x, y, function() {
                    renameGroup(id)
                }, function() {
                    delGroup(id)
                })
            });

            /* edit / delete item */
            function editModal(id) {
                var it = find(id);
                if (!it) return;
                var s = openModal(
                    '<div class="mh"><h2>Edit favorite</h2></div>' +
                    '<label class="f"><span>Name</span><input id="eName" value="' + esc(it.title) + '" maxlength="60"></label>' +
                    '<label class="f"><span>Link</span><input id="eUrl" value="' + esc(it.url) + '" spellcheck="false"></label>' +
                    '<div class="f"><span>Categories <b id="ec" style="font-weight:400"></b></span>' + pickerHTML(it.cats) + '</div>' +
                    '<div class="merr" id="eErr" style="margin-top:12px"></div>' +
                    '<div class="row"><button class="btn ghost" type="button" id="eCancel">Cancel</button><button class="btn" type="button" id="eSave">Save</button></div>');
                var box = s.querySelector('.picker'),
                    name = s.querySelector('#eName');
                bindPicker(box, function(n) {
                    s.querySelector('#ec').textContent = '(' + n + '/' + MAX + ')'
                });
                name.focus();
                name.select();

                function commit() {
                    var u = parse(s.querySelector('#eUrl').value);
                    if (!u) {
                        s.querySelector('#eErr').textContent = 'Enter a valid link.';
                        return
                    }
                    it.url = u.href;
                    it.host = hostOf(u);
                    it.title = name.value.trim() || titleOf(u);
                    it.cats = picked(box);
                    save();
                    closeModal();
                    render();
                }
                s.querySelector('#eSave').addEventListener('click', commit);
                s.querySelector('#eCancel').addEventListener('click', closeModal);
                s.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
                        e.preventDefault();
                        commit()
                    }
                });
            }

            function confirmModal(title, body, okLabel, onOk) {
                var s = openModal('<div class="mh"><h2>' + title + '</h2></div><p>' + body + '</p>' +
                    '<div class="row"><button class="btn ghost" type="button" id="xCancel">Cancel</button><button class="btn danger" type="button" id="xOk">' + okLabel + '</button></div>');
                s.querySelector('#xCancel').addEventListener('click', closeModal);
                var ok = s.querySelector('#xOk');
                ok.focus();
                ok.addEventListener('click', function() {
                    onOk();
                    closeModal()
                });
            }

            function delModal(id) {
                var it = find(id);
                if (!it) return;
                confirmModal('Delete this site?', '<b>' + esc(it.title) + '</b> will be removed from your favorites and any groups.', 'Delete', function() {
                    items = items.filter(function(x) {
                        return x.id !== id
                    });
                    delete sel[id];
                    save();
                    render();
                });
            }

            /* group mode */
            function setGrouping(on) {
                grouping = on;
                if (!on) sel = {};
                $('groupMode').classList.toggle('on', on);
                $('groupMode').setAttribute('aria-pressed', on);
                closeMenu();
                if (!$('homeView').hidden) render();
            }
            $('groupMode').addEventListener('click', function() {
                setGrouping(!grouping)
            });

            function updateFab() {
                var n = Object.keys(sel).length,
                    f = $('gfab');
                var was = f.hidden;
                f.hidden = !(grouping && n > 0);
                f.textContent = 'Group selected (' + n + ')';
            }
            $('grid').addEventListener('click', function(e) {
                if (!grouping) return;
                var c = e.target.closest('.card');
                if (!c) return;
                e.preventDefault();
                var id = c.getAttribute('data-id');
                if (sel[id]) {
                    delete sel[id];
                    c.classList.remove('picked')
                } else {
                    sel[id] = 1;
                    c.classList.add('picked')
                }
                updateFab();
            });
            $('gfab').addEventListener('click', function() {
                var ids = items.filter(function(x) {
                    return sel[x.id]
                }).map(function(x) {
                    return x.id
                });
                if (!ids.length) return;
                var s = openModal('<div class="mh"><h2>New group</h2><span class="cnt">' + ids.length + (ids.length === 1 ? ' link' : ' links') + '</span></div>' +
                    '<div class="sellist">' + ids.map(function(id) {
                        var it = find(id);
                        return '<div class="selrow">' + icon(it, 's') + '<span>' + esc(it.title) + '</span></div>'
                    }).join('') + '</div>' +
                    '<label class="f"><span>Group title</span><input id="gTitle" maxlength="40" placeholder="e.g. Morning reads"></label>' +
                    '<div class="merr" id="gErr"></div>' +
                    '<div class="row"><button class="btn ghost" type="button" id="gCancel">Cancel</button><button class="btn" type="button" id="gOk">Create group</button></div>');
                var inp = s.querySelector('#gTitle');
                inp.focus();

                function make() {
                    var t = inp.value.trim();
                    if (!t) {
                        s.querySelector('#gErr').textContent = 'Give your group a title.';
                        return
                    }
                    groups.unshift({
                        id: Date.now().toString(36),
                        title: t,
                        ids: ids
                    });
                    save();
                    closeModal();
                    setGrouping(false);
                    toast('Group created');
                }
                s.querySelector('#gOk').addEventListener('click', make);
                s.querySelector('#gCancel').addEventListener('click', closeModal);
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        make()
                    }
                });
            });

            /* groups screen */
            function openAll(gid) {
                var g = groups.filter(function(x) {
                    return x.id === gid
                })[0];
                if (!g) return;
                var blocked = false;
                g.ids.forEach(function(id) {
                    var it = find(id);
                    if (!it) return;
                    var w = window.open(it.url, '_blank');
                    if (w) {
                        try {
                            w.opener = null
                        } catch (e) {}
                    } else blocked = true;
                });
                if (blocked) toast('Allow pop-ups for this page to open every link');
            }
            $('groups').addEventListener('click', function(e) {
                var b = e.target.closest('[data-open]');
                if (b) openAll(b.getAttribute('data-open'));
            });

            function renameGroup(id) {
                var g = groups.filter(function(x) {
                    return x.id === id
                })[0];
                if (!g) return;
                var s = openModal('<div class="mh"><h2>Rename group</h2></div><label class="f"><span>Group title</span><input id="rT" maxlength="40" value="' + esc(g.title) + '"></label>' +
                    '<div class="merr" id="rErr"></div><div class="row"><button class="btn ghost" type="button" id="rC">Cancel</button><button class="btn" type="button" id="rS">Save</button></div>');
                var inp = s.querySelector('#rT');
                inp.focus();
                inp.select();

                function ok() {
                    var t = inp.value.trim();
                    if (!t) {
                        s.querySelector('#rErr').textContent = 'Give your group a title.';
                        return
                    }
                    g.title = t;
                    save();
                    closeModal();
                    renderGroups()
                }
                s.querySelector('#rS').addEventListener('click', ok);
                s.querySelector('#rC').addEventListener('click', closeModal);
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        ok()
                    }
                });
            }

            function delGroup(id) {
                var g = groups.filter(function(x) {
                    return x.id === id
                })[0];
                if (!g) return;
                confirmModal('Delete this group?', '<b>' + esc(g.title) + '</b> will be removed. Your saved sites stay in Favorites.', 'Delete', function() {
                    groups = groups.filter(function(x) {
                        return x.id !== id
                    });
                    save();
                    renderGroups();
                });
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeMenu();
                    if (scrim) closeModal();
                    else if (grouping) setGrouping(false)
                }
            });

            catLabel();
            route();
        })();
    </script>
</body>

</html>
