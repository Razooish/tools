<div class="tip"><p><b>No duplicates, ever.</b> Saving a link you already have simply adds any new categories to it. Variations like <b>www.</b>, <b>https://</b> or a trailing slash count as the same link.</p></div>
<div class="row"><button class="b" id="hx">Got it</button></div>`, "wide"))
            }

            function privModal() {
                done(openModal(`<div class="mh"><div class="logo">${STAR}</div><div><h2>Privacy policy</h2><p class="lead">The short version: your shelf is yours. No account, no server, no tracking.</p></div></div>
<div class="sec"><h3>What is stored</h3><p>Your links, categories, groups and preferences (such as dark mode) are saved in this browser’s local storage on this device. They are never uploaded to us or anyone else.</p></div>
<div class="sec"><h3>What we never do</h3><ul><li>No sign-up, no accounts, no email addresses.</li><li>No analytics, advertising, cookies or fingerprinting.</li><li>No reading of your browsing history. Favorites only knows what you type into it.</li></ul></div>
<div class="sec"><h3>The one outside request</h3><p>To show each site’s icon, the domain of every saved site (for example <b>neal.fun</b>) is requested from Google’s favicon service, so Google can see those domains along with ordinary network details like your IP address. Your categories, groups and full link paths are not sent. Prefer zero outside requests? Turn off <b>Show site icons</b> in Settings and letter badges are used instead.</p></div>
<div class="sec"><h3>When you open a link</h3><p>Links open in a new tab without passing referrer information. From that moment the website you visit applies its own privacy policy.</p></div>
<div class="sec"><h3>You are in control</h3><ul><li><b>Export</b> a backup or CSV at any time, in a simple readable format.</li><li><b>Erase all</b> in Settings removes everything instantly.</li><li>Clearing your browser data, or using a private window, also clears your shelf. Export a backup first.</li><li>Nothing syncs between devices. Use export and import to move your shelf.</li></ul></div>
<div class="tip"><p>If this policy ever changes, the update ships with the app and this page will describe it.</p></div>
<div class="row"><button class="b" id="hx">Close</button></div>`, "wide"))
            }

            function aboutModal() {
                done(openModal(`<div class="mh"><div class="logo">${STAR}</div><div><h2>Favorites</h2><p class="lead">Version 1.0 · A private shelf for the sites you love.</p></div></div>
<p>Favorites is a small, fast home for the places you keep coming back to: the blog you read with coffee, the tool you use every week, the playground you show friends. No clutter, no feeds, no accounts, just your links, beautifully kept.</p>
<div class="sec"><h3>What it does</h3><ul><li><b>Save fast.</b> Paste or type links with categories in one line, or pick categories with a tap.</li><li><b>Find instantly.</b> The box doubles as a live search, ranked by relevance.</li><li><b>Stay organised.</b> Categories, groups, and one-click “Open all”.</li><li><b>Work everywhere.</b> Phone, tablet or desktop, light or dark.</li><li><b>Own your data.</b> Everything stays in your browser, with simple export and import.</li></ul></div>
<div class="sec"><h3>Good to know</h3><p>Favorites works offline once loaded. Only site icons need a connection, and they fall back to letter badges when unavailable.</p></div>
<div class="row"><button class="b" id="hx">Close</button></div>`, ""))
            }
            $("info").onclick = howModal;

            /* ---------- settings + data ---------- */
            const dl = (n, t, ty) => {
                const u = URL.createObjectURL(new Blob([t], {
                        type: ty
                    })),
                    a = document.createElement("a");
                a.href = u;
                a.download = n;
                document.body.append(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(u), 1e3)
            };
            const sv = $("settingsView");
            sv.addEventListener("change", e => {
                const t = e.target,
                    k = t.dataset.k;
                if (t.id === "file") {
                    const f = t.files[0];
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = () => {
                        try {
                            const d = JSON.parse(r.result),
                                list = Array.isArray(d) ? d : arr(d && (d.links || d.items));
                            if (!list.length && !arr(d && d.groups).length) throw 0;
                            const legacy = {};
                            let nw = 0,
                                up = 0;
                            list.forEach(x => {
                                const o = typeof x === "string" ? {
                                    url: x
                                } : x;
                                if (!o || typeof o !== "object") return;
                                const u2 = upsert(o.url, o.categories || o.cats || (o.cat ? [o.cat] : []));
                                if (!u2) return;
                                if (o.id) legacy[o.id] = u2.item.key;
                                if (u2.isNew) nw++;
                                else if (u2.changed) up++
                            });
                            arr(d && d.groups).forEach(g => addGroup(g, legacy));
                            save();
                            renderSettings();
                            toast(`Imported ${nw} new ${nw===1?"link":"links"}${up?`, updated ${up}`:""}`)
                        } catch (x) {
                            toast("That file isn’t a valid backup.")
                        }
                    };
                    r.readAsText(f);
                    t.value = "";
                    return
                }
                if (!k) return;
                if (k === "mode") setMode(t.checked ? "dark" : "light");
                else S[k] = t.type === "checkbox" ? t.checked : k === "every" ? +t.value : t.value;
                save();
                applyS()
            });
            sv.addEventListener("click", e => {
                const rm = e.target.closest("[data-rm]");
                if (rm) {
                    const c = rm.dataset.rm;
                    items.forEach(i => i.cats = i.cats.filter(x => x !== c));
                    picked.delete(c.toLowerCase());
                    updPick();
                    save();
                    renderSettings();
                    return
                }
                const a = e.target.closest("[data-act]");
                if (!a) return;
                const k = a.dataset.act;
                if (k === "how") howModal();
                else if (k === "priv") privModal();
                else if (k === "about") aboutModal();
                else if (k === "exp") dl("favorites-backup.json", JSON.stringify({
                    links: items.map(i => i.cats.length ? {
                        url: i.url,
                        categories: i.cats
                    } : {
                        url: i.url
                    }),
                    groups: groups.map(g => ({
                        title: g.title,
                        links: g.keys.map(find).filter(Boolean).map(i => i.url)
                    }))
                }, null, 2), "application/json");
                else if (k === "csv") dl("favorites.csv", "url,categories\n" + items.map(i => [i.url, i.cats.join("|")].map(v => {
                    v = String(v);
                    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
                    return '"' + v.replace(/"/g, '""') + '"'
                }).join(",")).join("\n"), "text/csv");
                else if (k === "imp") Q(sv, "#file").click();
                else if (k === "clr") confirmModal("Erase everything?", "All links, groups and categories will be removed. Export a backup first if you may need them.", "Erase all", () => {
                    items = [];
                    groups = [];
                    picked.clear();
                    updPick();
                    save();
                    renderSettings()
                })
            });

            /* ---------- sprinkles, nudge, typewriter placeholder ---------- */
            for (let i = 0; i < 26; i++) {
                const s = document.createElement("i");
                s.style.cssText = `left:${Math.random()*100}%;--d:${16+Math.random()*20}s;--r:${Math.random()*360}deg;animation-delay:-${Math.random()*30}s;opacity:${.25+Math.random()*.35}`;
                $("sp").append(s)
            }
            let nt;

            function applyS() {
                $("sp").hidden = !S.spr;
                clearInterval(nt);
                if (!S.nudge) return;
                nt = setInterval(() => {
                    if (document.hidden || selecting || location.hash || scrim || menuEl) return;
                    const c = [...$("grid").querySelectorAll(".card")].filter(e => {
                        const r = e.getBoundingClientRect();
                        return r.bottom > 0 && r.top < innerHeight
                    });
                    if (!c.length) return;
                    const e = c[Math.random() * c.length | 0];
                    e.classList.remove("nudge");
                    void e.offsetWidth;
                    e.classList.add("nudge");
                    setTimeout(() => e.classList.remove("nudge"), 1500)
                }, S.every * 1000)
            }
            const EX = ["Search, or add: neal.fun fun", "neal.fun, ncase.me fun", "aeon.co read, github.com dev", "figma.com design tools"];
            let ei = 0,
                ci2 = 0,
                dn = false,
                cur = true;
            const draw = () => $("url").placeholder = EX[ei].slice(0, ci2) + (cur ? "|" : " ");
            setInterval(() => {
                cur = !cur;
                draw()
            }, 530);
            (function tick() {
                const w = EX[ei];
                if (!dn) {
                    ci2++;
                    draw();
                    if (ci2 >= w.length) {
                        dn = true;
                        return setTimeout(tick, 1700)
                    }
                    return setTimeout(tick, 75)
                }
                ci2--;
                draw();
                if (ci2 <= 0) {
                    dn = false;
                    ei = (ei + 1) % EX.length;
                    return setTimeout(tick, 450)
                }
                setTimeout(tick, 35)
            })();
            addEventListener("storage", e => {
                if (e.key && Object.values(K).includes(e.key)) {
                    loadAll();
                    setMode(st.get(K.m) || mode);
                    applyS();
                    route()
                }
            });
            addEventListener("keydown", e => {
                if (e.key === "Escape") {
                    if (scrim) closeModal();
                    else if (menuEl) closeMenu();
                    else if (selecting) setSel(false);
                    else if (document.activeElement === $("url") && $("url").value) {
                        $("url").value = "";
                        render()
                    }
                } else if (e.key === "/" && vw === "home" && !scrim && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
                    e.preventDefault();
                    $("url").focus()
                }
            });
            loadAll();
            setMode(st.get(K.m) || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"));
            applyS();
            updPick();
            route();
        })();
    </script>
</body>

</html>
