<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites</title>
    <style>
         :root {
            --bg: #f7f3e8;
            --surface: #fffdf7;
            --ink: #241d0c;
            --muted: #8d8468;
            --line: #e8dfc6;
            --accent: #c8921a;
            --accent-ink: #1c1400;
            --danger: #d6455d;
            --scrim: rgba(30, 24, 8, .4);
            --edge: color-mix(in srgb, var(--line) 60%, #000 40%);
            --pop: 0 18px 50px -12px rgba(30, 24, 8, .3);
            --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Avenir Next", Nunito, "Helvetica Neue", system-ui, sans-serif
        }
        
        :root[data-mode=dark] {
            --bg: #14120c;
            --surface: #1e1b12;
            --ink: #f1ead6;
            --muted: #928a70;
            --line: #34301f;
            --accent: #e6b13a;
            --accent-ink: #1a1300;
            --danger: #ff6b85;
            --scrim: rgba(0, 0, 0, .6);
            --pop: 0 18px 50px -12px rgba(0, 0, 0, .7)
        }
        
        :root[data-theme=love] {
            --accent: #e0457b;
            --accent-ink: #fff;
            --bg: #fbeff3;
            --surface: #fffafb;
            --line: #f3d3de;
            --ink: #3a1423;
            --muted: #a77a89
        }
        
        :root[data-theme=love][data-mode=dark] {
            --accent: #ff7aa5;
            --accent-ink: #2a0a16;
            --bg: #1a0e13;
            --surface: #251319;
            --line: #40202c;
            --ink: #fde8ef;
            --muted: #b0808f
        }
        
        :root[data-theme=github] {
            --accent: #0969da;
            --accent-ink: #fff;
            --bg: #f6f8fa;
            --surface: #fff;
            --line: #d0d7de;
            --ink: #1f2328;
            --muted: #656d76
        }
        
        :root[data-theme=github][data-mode=dark] {
            --accent: #2f81f7;
            --accent-ink: #fff;
            --bg: #0d1117;
            --surface: #161b22;
            --line: #30363d;
            --ink: #e6edf3;
            --muted: #7d8590
        }
        
        :root[data-theme=hacker],
        :root[data-theme=hacker][data-mode=dark] {
            --accent: #00ff66;
            --accent-ink: #001a08;
            --bg: #020a04;
            --surface: #06140a;
            --line: #0f3a1c;
            --ink: #b7ffcf;
            --muted: #3f9a5e;
            --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace
        }
        
        * {
            box-sizing: border-box;
            margin: 0
        }
        
        html {
            color-scheme: light
        }
        
        :root[data-mode=dark],
        :root[data-theme=hacker] {
            color-scheme: dark
        }
        
        [hidden] {
            display: none!important
        }
        
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            min-height: 100vh;
            transition: background .3s, color .3s;
            -webkit-font-smoothing: antialiased
        }
        
        button,
        input,
        select {
            font: inherit;
            color: inherit
        }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }
        
        ::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0
        }
        
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
            background: transparent
        }
        
        ::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--accent) 55%, transparent);
            border-radius: 99px
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent)
        }
        
        .wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 28px 24px 96px
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 44px;
            gap: 12px
        }
        
        .ttl {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0
        }
        
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.02em
        }
        
        h1 a {
            color: inherit;
            text-decoration: none
        }
        
        .tools {
            display: flex;
            gap: 8px;
            align-items: center
        }
        
        .pill {
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            text-decoration: none;
            transition: all .2s;
            white-space: nowrap
        }
        
        .pill:hover {
            border-color: var(--accent)
        }
        
        .pill.on {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent)
        }
        
        .pill svg {
            width: 17px;
            height: 17px;
            flex: none
        }
        
        .sq {
            width: 40px;
            padding: 0;
            justify-content: center
        }
        
        .sun {
            display: none
        }
        
        :root[data-mode=dark] .sun {
            display: block
        }
        
        :root[data-mode=dark] .moon {
            display: none
        }
        
        .bar {
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px;
            box-shadow: 0 5px 0 var(--edge), 0 14px 24px -10px rgba(0, 0, 0, .25);
            transition: border-color .2s
        }
        
        .bar:focus-within {
            border-color: var(--accent)
        }
        
        .bar input {
            background: transparent;
            border: 0;
            outline: 0;
            padding: 12px 18px;
            min-width: 0
        }
        
        .bar input::placeholder {
            color: var(--muted)
        }
        
        #url {
            flex: 1
        }
        
        .catbtn {
            flex: none;
            width: 180px;
            border: 0;
            border-left: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            padding: 0 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            text-align: left
        }
        
        .catbtn:hover,
        .catbtn.has {
            color: var(--ink)
        }
        
        .catbtn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .catbtn svg {
            width: 14px;
            height: 14px;
            flex: none
        }
        
        .btn {
            border: 0;
            border-radius: 999px;
            padding: 0 24px;
            height: 44px;
            cursor: pointer;
            font-weight: 600;
            background: var(--accent);
            color: var(--accent-ink);
            transition: transform .15s, opacity .2s
        }
        
        .btn:hover {
            opacity: .9
        }
        
        .btn:active {
            transform: scale(.96)
        }
        
        .btn.sm {
            height: 34px;
            padding: 0 16px;
            font-size: 13px
        }
        
        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }
        
        .btn.ghost:hover {
            background: var(--bg);
            opacity: 1
        }
        
        .btn.danger {
            background: var(--danger);
            color: #fff
        }
        
        .err {
            min-height: 20px;
            margin: 10px 0 0 22px;
            font-size: 13px;
            color: var(--danger)
        }
        
        .chips {
            position: relative;
            margin: 18px -24px 28px
        }
        
        .chips-in {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 24px 8px;
            scroll-behavior: smooth
        }
        
        .chip {
            flex: none;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            gap: 7px;
            align-items: center;
            transition: all .2s
        }
        
        .chip:hover {
            color: var(--ink);
            border-color: var(--accent)
        }
        
        .chip.on {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent)
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            perspective: 1100px
        }
        
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding: 22px;
            background: linear-gradient(160deg, color-mix(in srgb, var(--surface) 88%, #fff), var(--surface));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 6px 0 var(--edge), 0 16px 22px -10px rgba(0, 0, 0, .28);
            text-decoration: none;
            color: inherit;
            transform-style: preserve-3d;
            transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, border-color .2s;
            -webkit-touch-callout: none;
            user-select: none
        }
        
        .card:hover {
            transform: rotateX(7deg) rotateY(-4deg) translateY(-4px);
            box-shadow: 0 10px 0 var(--edge), 0 24px 28px -12px rgba(0, 0, 0, .35);
            border-color: var(--accent)
        }
        
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--edge)
        }
        
        .card.ctx {
            border-color: var(--accent)
        }
        
        .card:focus-visible,
        .chip:focus-visible,
        .pill:focus-visible,
        .btn:focus-visible,
        .mi:focus-visible,
        .catbtn:focus-visible,
        .glink:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }
        
        .ico {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
            flex: none
        }
        
        .ico img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
            background: none;
            border: 0
        }
        
        .ico.s {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 12px
        }
        
        .ico.s img {
            padding: 2px
        }
        
        .t {
            font-weight: 600;
            font-size: 17px;
            letter-spacing: -.01em;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .h {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .c {
            position: absolute;
            top: 24px;
            right: 22px;
            font-size: 12px;
            color: var(--muted);
            max-width: 92px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .check {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--bg);
            display: grid;
            place-items: center;
            transition: all .2s
        }
        
        .check svg {
            width: 13px;
            height: 13px;
            opacity: 0;
            stroke: var(--accent-ink);
            transform: scale(.6);
            transition: all .2s
        }
        
        .grouping .card {
            cursor: pointer
        }
        
        .card.picked {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 6px 0 var(--edge)
        }
        
        .card.picked .check {
            background: var(--accent);
            border-color: var(--accent)
        }
        
        .card.picked .check svg {
            opacity: 1;
            transform: none
        }
        
        .empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--muted);
            padding: 72px 0
        }
        
        .card.pop {
            animation: pop .4s cubic-bezier(.2, .9, .3, 1.3)
        }
        
        @keyframes pop {
            from {
                transform: scale(.88);
                opacity: 0
            }
        }
        
        .gfab {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            height: 44px;
            padding: 0 22px;
            box-shadow: var(--pop)
        }
        
        .groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px
        }
        
        .gcard {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 6px 0 var(--edge), 0 16px 22px -10px rgba(0, 0, 0, .25)
        }
        
        .gcard.ctx {
            border-color: var(--accent)
        }
        
        .ghead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px
        }
        
        .gt {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.015em;
            word-break: break-word
        }
        
        .gn {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px
        }
        
        .glist {
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        
        .glink {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            margin: 0 -8px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit
        }
        
        .glink:hover {
            background: var(--bg)
        }
        
        .glink span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px
        }
        
        .menu {
            position: fixed;
            z-index: 50;
            min-width: 176px;
            padding: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--pop);
            animation: fade .14s
        }
        
        .mi {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            text-align: left
        }
        
        .mi:hover,
        .mi:focus-visible {
            background: var(--bg)
        }
        
        .mi.danger {
            color: var(--danger)
        }
        
        .mi svg {
            width: 16px;
            height: 16px;
            flex: none
        }
        
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: var(--scrim);
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            padding: 20px;
            animation: fade .2s
        }
        
        @keyframes fade {
            from {
                opacity: 0
            }
        }
        
        .modal {
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--pop)
        }
        
        .mh {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px
        }
        
        .modal h2 {
            font-size: 19px;
            font-weight: 700
        }
        
        .modal h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin: 20px 0 10px
        }
        
        .mh .cnt {
            font-size: 13px;
            color: var(--muted)
        }
        
        .modal p {
            color: var(--muted);
            line-height: 1.5;
            margin: -8px 0 24px;
            font-size: 15px
        }
        
        .modal p b {
            color: var(--ink)
        }
        
        .f {
            display: block;
            margin-bottom: 14px
        }
        
        .f>span {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 6px 4px
        }
        
        .f input {
            width: 100%;
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            outline: 0
        }
        
        .f input:focus {
            border-color: var(--accent)
        }
        
        .row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
            flex-wrap: wrap
        }
        
        .row.l {
            justify-content: flex-start;
            margin-top: 0
        }
        
        .row .btn {
            padding: 0 20px
        }
        
        .merr {
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
            margin: -4px 0 0 4px
        }
        
        .picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }
        
        .opt {
            position: relative;
            cursor: pointer
        }
        
        .opt input {
            position: absolute;
            opacity: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer
        }
        
        .opt span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--bg);
            font-size: 14px;
            color: var(--muted);
            transition: all .15s
        }
        
        .opt:hover span {
            color: var(--ink);
            border-color: var(--accent)
        }
        
        .opt input:checked+span {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink)
        }
        
        .opt input:disabled+span {
            opacity: .4
        }
        
        .opt input:focus-visible+span {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }
        
        .sellist {
            max-height: 190px;
            overflow-y: auto;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        
        .selrow {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 4px;
            font-size: 15px
        }
        
        .themes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px
        }
        
        .th {
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 10px 4px;
            background: var(--bg);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px
        }
        
        .th i {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: block
        }
        
        .th.on {
            border-color: var(--accent)
        }
        
        .cust {
            display: flex;
            gap: 12px;
            margin-top: 12px
        }
        
        .cust label {
            flex: 1;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px
        }
        
        .cust input[type=color] {
            width: 100%;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            padding: 2px
        }
        
        .cc {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 6px 6px 12px;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--line);
            font-size: 13px
        }
        
        .cc button {
            border: 0;
            background: var(--line);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            line-height: 1
        }
        
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            background: var(--ink);
            color: var(--bg);
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 14px;
            box-shadow: var(--pop);
            max-width: 90vw
        }
        
        @media(max-width:620px) {
            .wrap {
                padding: 20px 14px 90px
            }
            .bar {
                flex-wrap: wrap;
                border-radius: 26px
            }
            #url {
                flex-basis: 100%
            }
            .catbtn {
                flex: 1;
                width: auto;
                border-left: 0;
                border-top: 1px solid var(--line);
                height: 44px
            }
            .pill .lbl {
                display: none
            }
            .pill {
                padding: 0 12px
            }
            .pill.sq {
                padding: 0
            }
            .gfab {
                top: 70px
            }
            .chips {
                margin: 18px -14px 24px
            }
            .chips-in {
                padding: 4px 14px 8px
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px
            }
            .card {
                padding: 12px 6px;
                gap: 8px;
                align-items: center;
                text-align: center;
                border-radius: 14px;
                box-shadow: 0 4px 0 var(--edge), 0 10px 14px -8px rgba(0, 0, 0, .28)
            }
            .card:hover {
                transform: none
            }
            .card .ico {
                width: 40px;
                height: 40px;
                font-size: 17px;
                border-radius: 12px
            }
            .card>div:not(.ico) {
                width: 100%;
                min-width: 0
            }
            .t {
                font-size: 12px
            }
            .h,
            .c {
                display: none
            }
            .check {
                top: 6px;
                right: 6px;
                width: 20px;
                height: 20px
            }
            .themes {
                grid-template-columns: repeat(3, 1fr)
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none!important;
                transition: none!important
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="ttl">
                <a class="pill sq" id="back" href="#" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
                <h1><a href="#" id="title">Favorites</a></h1>
            </div>
            <div class="tools">
                <a class="pill" id="groupsLink" href="#groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Groups</span></a>
                <button class="pill" id="groupMode" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg><span class="lbl">Group</span></button>
                <button class="pill sq" id="settings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
                <button class="pill sq" id="theme" type="button" aria-label="Toggle light or dark"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            </div>
        </header>
        <section id="homeView">
            <div class="bar">
                <input id="url" type="text" placeholder="Paste links, comma separated: aeon.co, ncase.me" aria-label="Website links" autocomplete="off" spellcheck="false">
                <button class="catbtn" id="catBtn" type="button"><span id="catLabel">Category</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
                <button class="btn" id="save" type="button">Save</button>
            </div>
            <div class="err" id="err" role="alert"></div>
            <div class="chips" id="chips" hidden>
                <div class="chips-in" id="chipsIn"></div>
            </div>
            <main class="grid" id="grid"></main>
        </section>
        <section id="groupsView" hidden>
            <div class="groups" id="groups"></div>
        </section>
    </div>
    <button class="pill on gfab" id="gfab" type="button" hidden></button>
    <script>
        (function() {
            var KEY = 'favorites.v3',
                OLD = 'favorites.v2',
                GKEY = 'favorites.groups',
                THEME = 'favorites.theme',
                SKEY = 'favorites.settings',
                MAX = 5;
            var CI = {
                Work: '💼',
                Design: '🎨',
                Development: '💻',
                News: '📰',
                Learning: '🎓',
                Reading: '📚',
                Tools: '🛠️',
                Shopping: '🛍️',
                Entertainment: '🎬',
                Music: '🎵',
                Social: '💬',
                Finance: '💰',
                Travel: '✈️',
                Health: '❤️‍🩹',
                Food: '🍜',
                Inspiration: '✨'
            };
            var BASE = Object.keys(CI);
            var items = [],
                groups = [],
                S = {
                    theme: 'gold',
                    custom: {
                        accent: '#c8921a',
                        bg: '#f7f3e8'
                    },
                    cats: []
                },
                filter = 'All',
                newCats = [],
                grouping = false,
                sel = {};
            var $ = function(id) {
                return document.getElementById(id)
            };
            var store = {
                get: function(k) {
                    try {
                        return localStorage.getItem(k)
                    } catch (e) {
                        return null
                    }
                },
                set: function(k, v) {
                    try {
                        localStorage.setItem(k, v)
                    } catch (e) {}
                }
            };

            function load(k, d) {
                try {
                    var v = JSON.parse(store.get(k));
                    return v == null ? d : v
                } catch (e) {
                    return d
                }
            }
            items = load(KEY, null) || load(OLD, []);
            groups = load(GKEY, []);
            var sv = load(SKEY, null);
            if (sv && typeof sv === 'object')
                for (var k in sv) S[k] = sv[k];
            if (!Array.isArray(items)) items = [];
            if (!Array.isArray(groups)) groups = [];
            if (!Array.isArray(S.cats)) S.cats = [];
            items.forEach(function(it) {
                if (!it.cats) it.cats = it.cat ? [it.cat] : [];
                delete it.cat
            });
            var root = document.documentElement;

            function save() {
                store.set(KEY, JSON.stringify(items));
                store.set(GKEY, JSON.stringify(groups));
                store.set(SKEY, JSON.stringify(S))
            }

            function lum(h) {
                var n = parseInt(h.slice(1), 16);
                return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255
            }

            function applyTheme() {
                root.setAttribute('data-theme', S.theme);
                var st = root.style;
                ['--accent', '--accent-ink', '--bg'].forEach(function(p) {
                    st.removeProperty(p)
                });
                if (S.theme === 'custom') {
                    st.setProperty('--accent', S.custom.accent);
                    st.setProperty('--accent-ink', lum(S.custom.accent) > .6 ? '#111' : '#fff');
                    st.setProperty('--bg', S.custom.bg)
                }
            }
            var mode = store.get(THEME) || (window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
            root.setAttribute('data-mode', mode);
            applyTheme();
            $('theme').addEventListener('click', function() {
                mode = root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-mode', mode);
                store.set(THEME, mode)
            });

            function esc(s) {
                return String(s).replace(/[&<>"']/g, function(c) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[c]
                })
            }

            function hue(s) {
                var h = 0;
                for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
                return h
            }

            function find(id) {
                for (var i = 0; i < items.length; i++)
                    if (items[i].id === id) return items[i]
            }

            function arr(x) {
                return [].slice.call(x)
            }

            function ci(c) {
                return CI[c] || '🏷️'
            }

            function parse(raw) {
                raw = (raw || '').trim();
                if (!raw || /\s/.test(raw)) return null;
                if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) raw = 'https://' + raw;
                try {
                    var u = new URL(raw);
                    if (!/^(https?|ftp):$/.test(u.protocol) || !u.hostname) return null;
                    return u
                } catch (e) {
                    return null
                }
            }

            function hostOf(u) {
                return u.hostname.replace(/^www\./, '')
            }

            function titleOf(u) {
                var host = hostOf(u);
                if (/^[\d.]+$/.test(host) || host.indexOf(':') > -1 || host.indexOf('.') < 0) return host;
                var p = host.split('.');
                var b = (p.length > 2 && p[p.length - 2].length <= 3) ? p[p.length - 3] : p[p.length - 2];
                return b.charAt(0).toUpperCase() + b.slice(1)
            }

            function icon(it, cls) {
                return '<div class="ico ' + (cls || '') + '" style="background:hsl(' + hue(it.host) + ' 55% 52%)">' + esc((it.title[0] || '?').toUpperCase()) + '<img src="https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(it.host) + '" alt="" onerror="this.remove()" onload="if(this.naturalWidth<=16)this.remove();else{this.parentNode.style.background=\'none\';this.parentNode.style.color=\'transparent\'}"></div>'
            }

            function allCats() {
                var c = BASE.concat(S.cats);
                items.forEach(function(it) {
                    it.cats.forEach(function(x) {
                        if (c.indexOf(x) < 0) c.push(x)
                    })
                });
                return c
            }

            function toast(m) {
                var t = document.createElement('div');
                t.className = 'toast';
                t.textContent = m;
                document.body.appendChild(t);
                setTimeout(function() {
                    t.remove()
                }, 3200)
            }
            var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

            function render() {
                var used = [];
                items.forEach(function(it) {
                    it.cats.forEach(function(c) {
                        if (used.indexOf(c) < 0) used.push(c)
                    })
                });
                used.sort();
                if (filter !== 'All' && used.indexOf(filter) < 0) filter = 'All';
                var inner = $('chipsIn'),
                    prev = inner.scrollLeft;
                $('chips').hidden = !used.length;
                inner.innerHTML = ['All'].concat(used).map(function(c) {
                    return '<button type="button" class="chip' + (c === filter ? ' on' : '') + '" data-c="' + esc(c) + '"><span>' + (c === 'All' ? '🌐' : ci(c)) + '</span>' + esc(c) + '</button>'
                }).join('');
                inner.style.scrollBehavior = 'auto';
                inner.scrollLeft = prev;
                inner.style.scrollBehavior = '';
                var list = items.filter(function(x) {
                    return filter === 'All' || x.cats.indexOf(filter) > -1
                });
                $('grid').innerHTML = list.length ? list.map(function(x) {
                    var label = x.cats.length ? esc(x.cats[0]) + (x.cats.length > 1 ? ' +' + (x.cats.length - 1) : '') : '';
                    return '<a class="card' + (sel[x.id] ? ' picked' : '') + '" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" data-id="' + x.id + '">' + icon(x) + '<div><div class="t">' + esc(x.title) + '</div><div class="h">' + esc(x.host) + '</div></div>' + (grouping ? '<span class="check">' + CHECK + '</span>' : (label ? '<span class="c">' + label + '</span>' : '')) + '</a>'
                }).join('') : '<div class="empty">Your saved sites will appear here.</div>';
                $('grid').classList.toggle('grouping', grouping);
                updateFab();
            }

            function renderGroups() {
                groups = groups.filter(function(g) {
                    g.ids = g.ids.filter(function(id) {
                        return find(id)
                    });
                    return g.ids.length
                });
                $('groups').innerHTML = groups.length ? groups.map(function(g) {
                    return '<div class="gcard" data-gid="' + g.id + '"><div class="ghead"><div><div class="gt">' + esc(g.title) + '</div><div class="gn">' + g.ids.length + (g.ids.length === 1 ? ' link' : ' links') + '</div></div><button class="btn sm" type="button" data-open="' + g.id + '">Open all</button></div><div class="glist">' +
                        g.ids.map(function(id) {
                            var it = find(id);
                            return '<a class="glink" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + icon(it, 's') + '<span>' + esc(it.title) + '</span></a>'
                        }).join('') + '</div></div>'
                }).join('') : '<div class="empty" style="grid-column:1/-1">Groups you create will appear here.</div>';
            }

            function route() {
                var g = location.hash === '#groups';
                $('homeView').hidden = g;
                $('groupsView').hidden = !g;
                ['groupMode', 'settings', 'groupsLink'].forEach(function(i) {
                    $(i).hidden = g
                });
                $('back').hidden = !g;
                $('title').textContent = g ? 'Groups' : 'Favorites';
                if (g) {
                    setGrouping(false);
                    renderGroups()
                } else render();
                closeMenu();
            }
            window.addEventListener('hashchange', route);

            function catLabel() {
                var n = newCats.length;
                $('catLabel').textContent = n === 0 ? 'Category' : n === 1 ? ci(newCats[0]) + ' ' + newCats[0] : n + ' categories';
                $('catBtn').classList.toggle('has', n > 0)
            }

            function add() {
                var parts = $('url').value.split(',').map(function(s) {
                        return s.trim()
                    }).filter(Boolean),
                    bad = [],
                    n = 0;
                if (!parts.length) {
                    $('err').textContent = 'Enter a link, like example.com';
                    return
                }
                parts.reverse().forEach(function(p) {
                    var u = parse(p);
                    if (!u) {
                        bad.push(p);
                        return
                    }
                    items.unshift({
                        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                        url: u.href,
                        host: hostOf(u),
                        title: titleOf(u),
                        cats: newCats.slice()
                    });
                    n++;
                });
                save();
                if (bad.length) {
                    $('err').textContent = 'Skipped invalid: ' + bad.reverse().join(', ');
                    $('url').value = bad.join(', ')
                } else {
                    $('err').textContent = '';
                    $('url').value = ''
                }
                if (n) {
                    newCats = [];
                    catLabel();
                    filter = 'All';
                    render();
                    var f = $('grid').querySelector('.card');
                    if (f) f.classList.add('pop');
                    if (n > 1) toast(n + ' links saved')
                }
                $('url').focus();
            }
            $('save').addEventListener('click', add);
            $('url').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    add()
                }
            });
            $('url').addEventListener('input', function() {
                $('err').textContent = ''
            });
            $('chipsIn').addEventListener('click', function(e) {
                var b = e.target.closest('.chip');
                if (!b) return;
                filter = b.getAttribute('data-c');
                render();
                var on = $('chipsIn').querySelector('.chip.on');
                if (on && on.scrollIntoView) on.scrollIntoView({
                    inline: 'center',
                    block: 'nearest',
                    behavior: 'smooth'
                })
            });
            $('chipsIn').addEventListener('wheel', function(e) {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    this.scrollLeft += e.deltaY;
                    e.preventDefault()
                }
            }, {
                passive: false
            });

            var scrim = null;

            function closeModal() {
                if (scrim) {
                    scrim.remove();
                    scrim = null
                }
            }

            function openModal(html) {
                closeModal();
                scrim = document.createElement('div');
                scrim.className = 'scrim';
                scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
                document.body.appendChild(scrim);
                scrim.addEventListener('mousedown', function(e) {
                    if (e.target === scrim) closeModal()
                });
                return scrim
            }

            function pickerHTML(selected) {
                return '<div class="picker">' + allCats().map(function(c) {
                    return '<label class="opt"><input type="checkbox" value="' + esc(c) + '"' + (selected.indexOf(c) > -1 ? ' checked' : '') + '><span>' + ci(c) + ' ' + esc(c) + '</span></label>'
                }).join('') + '</div>'
            }

            function bindPicker(box, onChange) {
                function sync(ch) {
                    var bx = arr(box.querySelectorAll('input')),
                        n = bx.filter(function(b) {
                            return b.checked
                        }).length;
                    if (n > MAX && ch) {
                        ch.checked = false;
                        n = MAX
                    }
                    bx.forEach(function(b) {
                        b.disabled = !b.checked && n >= MAX
                    });
                    if (onChange) onChange(n)
                }
                box.addEventListener('change', function(e) {
                    sync(e.target)
                });
                sync();
            }

            function picked(box) {
                return arr(box.querySelectorAll('input')).filter(function(b) {
                    return b.checked
                }).map(function(b) {
                    return b.value
                })
            }

            function catModal() {
                var s = openModal('<div class="mh"><h2>Choose categories</h2><span class="cnt" id="cc"></span></div>' + pickerHTML(newCats) + '<div class="row"><button class="btn ghost" type="button" id="cClear">Clear</button><button class="btn" type="button" id="cDone">Done</button></div>');
                var box = s.querySelector('.picker');
                bindPicker(box, function(n) {
                    s.querySelector('#cc').textContent = n + ' of ' + MAX
                });
                s.querySelector('#cClear').addEventListener('click', function() {
                    arr(box.querySelectorAll('input')).forEach(function(b) {
                        b.checked = false
                    });
                    box.dispatchEvent(new Event('change'))
                });
                s.querySelector('#cDone').addEventListener('click', function() {
                    newCats = picked(box);
                    catLabel();
                    closeModal()
                });
            }
            $('catBtn').addEventListener('click', catModal);

            var menuEl = null,
                menuTarget = null;
            var IE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
            var ID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

            function closeMenu() {
                if (menuEl) {
                    menuEl.remove();
                    menuEl = null
                }
                if (menuTarget) {
                    menuTarget.classList.remove('ctx');
                    menuTarget = null
                }
            }

            function openMenu(card, x, y, onEdit, onDel) {
                closeMenu();
                menuTarget = card;
                card.classList.add('ctx');
                var m = document.createElement('div');
                m.className = 'menu';
                m.setAttribute('role', 'menu');
                m.innerHTML = '<button class="mi" type="button" data-a="e">' + IE + 'Edit</button><button class="mi danger" type="button" data-a="d">' + ID + 'Delete</button>';
                document.body.appendChild(m);
                menuEl = m;
                m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px';
                m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
                m.addEventListener('click', function(e) {
                    var b = e.target.closest('.mi');
                    if (!b) return;
                    var a = b.getAttribute('data-a');
                    closeMenu();
                    if (a === 'e') onEdit();
                    else onDel()
                });
                m.querySelector('.mi').focus();
            }

            function ctxAt(e, el) {
                var r = el.getBoundingClientRect();
                return [e.clientX || r.left + 20, e.clientY || r.top + 20]
            }
            $('grid').addEventListener('contextmenu', function(e) {
                var c = e.target.closest('.card');
                if (!c || grouping) return;
                e.preventDefault();
                var p = ctxAt(e, c),
                    id = c.getAttribute('data-id');
                openMenu(c, p[0], p[1], function() {
                    editModal(id)
                }, function() {
                    delModal(id)
                })
            });
            $('groups').addEventListener('contextmenu', function(e) {
                var c = e.target.closest('.gcard');
                if (!c) return;
                e.preventDefault();
                var p = ctxAt(e, c),
                    id = c.getAttribute('data-gid');
                openMenu(c, p[0], p[1], function() {
                    renameGroup(id)
                }, function() {
                    delGroup(id)
                })
            });
            document.addEventListener('mousedown', function(e) {
                if (menuEl && !menuEl.contains(e.target)) closeMenu()
            });
            window.addEventListener('scroll', closeMenu, true);
            window.addEventListener('resize', closeMenu);
            var lp = null,
                lpFired = false;

            function longPress(host, s2, fn) {
                host.addEventListener('touchstart', function(e) {
                    var c = e.target.closest(s2);
                    if (!c) return;
                    lpFired = false;
                    var t = e.touches[0];
                    lp = setTimeout(function() {
                        lpFired = true;
                        fn(c, t.clientX, t.clientY)
                    }, 550)
                }, {
                    passive: true
                });
                ['touchend', 'touchmove', 'touchcancel'].forEach(function(n) {
                    host.addEventListener(n, function() {
                        clearTimeout(lp)
                    }, {
                        passive: true
                    })
                });
                host.addEventListener('click', function(e) {
                    if (lpFired) {
                        e.preventDefault();
                        e.stopPropagation();
                        lpFired = false
                    }
                }, true);
            }
            longPress($('grid'), '.card', function(c, x, y) {
                if (grouping) return;
                var id = c.getAttribute('data-id');
                openMenu(c, x, y, function() {
                    editModal(id)
                }, function() {
                    delModal(id)
                })
            });
            longPress($('groups'), '.gcard', function(c, x, y) {
                var id = c.getAttribute('data-gid');
                openMenu(c, x, y, function() {
                    renameGroup(id)
                }, function() {
                    delGroup(id)
                })
            });

            function editModal(id) {
                var it = find(id);
                if (!it) return;
                var s = openModal('<div class="mh"><h2>Edit favorite</h2></div><label class="f"><span>Name</span><input id="eName" value="' + esc(it.title) + '" maxlength="60"></label><label class="f"><span>Link</span><input id="eUrl" value="' + esc(it.url) + '" spellcheck="false"></label><div class="f"><span>Categories <b id="ec" style="font-weight:400"></b></span>' + pickerHTML(it.cats) + '</div><div class="merr" id="eErr" style="margin-top:12px"></div><div class="row"><button class="btn ghost" type="button" id="eCancel">Cancel</button><button class="btn" type="button" id="eSave">Save</button></div>');
                var box = s.querySelector('.picker'),
                    name = s.querySelector('#eName');
                bindPicker(box, function(n) {
                    s.querySelector('#ec').textContent = '(' + n + '/' + MAX + ')'
                });
                name.focus();
                name.select();

                function commit() {
                    var u = parse(s.querySelector('#eUrl').value);
                    if (!u) {
                        s.querySelector('#eErr').textContent = 'Enter a valid link.';
                        return
                    }
                    it.url = u.href;
                    it.host = hostOf(u);
                    it.title = name.value.trim() || titleOf(u);
                    it.cats = picked(box);
                    save();
                    closeModal();
                    render()
                }
                s.querySelector('#eSave').addEventListener('click', commit);
                s.querySelector('#eCancel').addEventListener('click', closeModal);
                s.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
                        e.preventDefault();
                        commit()
                    }
                });
            }

            function confirmModal(title, body, ok, onOk) {
                var s = openModal('<div class="mh"><h2>' + title + '</h2></div><p>' + body + '</p><div class="row"><button class="btn ghost" type="button" id="xCancel">Cancel</button><button class="btn danger" type="button" id="xOk">' + ok + '</button></div>');
                s.querySelector('#xCancel').addEventListener('click', closeModal);
                var b = s.querySelector('#xOk');
                b.focus();
                b.addEventListener('click', function() {
                    onOk();
                    closeModal()
                });
            }

            function delModal(id) {
                var it = find(id);
                if (!it) return;
                confirmModal('Delete this site?', '<b>' + esc(it.title) + '</b> will be removed from your favorites and any groups.', 'Delete', function() {
                    items = items.filter(function(x) {
                        return x.id !== id
                    });
                    delete sel[id];
                    save();
                    render()
                })
            }

            function setGrouping(on) {
                grouping = on;
                if (!on) sel = {};
                $('groupMode').classList.toggle('on', on);
                $('groupMode').setAttribute('aria-pressed', on);
                closeMenu();
                if (!$('homeView').hidden) render()
            }
            $('groupMode').addEventListener('click', function() {
                setGrouping(!grouping)
            });

            function updateFab() {
                var n = Object.keys(sel).length,
                    f = $('gfab');
                f.hidden = !(grouping && n > 0);
                f.textContent = 'Group selected (' + n + ')'
            }
            $('grid').addEventListener('click', function(e) {
                if (!grouping) return;
                var c = e.target.closest('.card');
                if (!c) return;
                e.preventDefault();
                var id = c.getAttribute('data-id');
                if (sel[id]) {
                    delete sel[id];
                    c.classList.remove('picked')
                } else {
                    sel[id] = 1;
                    c.classList.add('picked')
                }
                updateFab();
            });
            $('gfab').addEventListener('click', function() {
                var ids = items.filter(function(x) {
                    return sel[x.id]
                }).map(function(x) {
                    return x.id
                });
                if (!ids.length) return;
                var s = openModal('<div class="mh"><h2>New group</h2><span class="cnt">' + ids.length + (ids.length === 1 ? ' link' : ' links') + '</span></div><div class="sellist">' + ids.map(function(id) {
                    var it = find(id);
                    return '<div class="selrow">' + icon(it, 's') + '<span>' + esc(it.title) + '</span></div>'
                }).join('') + '</div><label class="f"><span>Group title</span><input id="gTitle" maxlength="40" placeholder="e.g. Morning reads"></label><div class="merr" id="gErr"></div><div class="row"><button class="btn ghost" type="button" id="gCancel">Cancel</button><button class="btn" type="button" id="gOk">Create group</button></div>');
                var inp = s.querySelector('#gTitle');
                inp.focus();

                function make() {
                    var t = inp.value.trim();
                    if (!t) {
                        s.querySelector('#gErr').textContent = 'Give your group a title.';
                        return
                    }
                    groups.unshift({
                        id: Date.now().toString(36),
                        title: t,
                        ids: ids
                    });
                    save();
                    closeModal();
                    setGrouping(false);
                    toast('Group created')
                }
                s.querySelector('#gOk').addEventListener('click', make);
                s.querySelector('#gCancel').addEventListener('click', closeModal);
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        make()
                    }
                });
            });

            /* Open all: anchors clicked synchronously inside the user gesture; falls back to a manual list if the browser blocks pop-ups */
            function openAll(gid) {
                var g = groups.filter(function(x) {
                    return x.id === gid
                })[0];
                if (!g) return;
                var urls = g.ids.map(function(id) {
                        var it = find(id);
                        return it && it.url
                    }).filter(Boolean),
                    opened = 0;
                urls.forEach(function(u) {
                    var w = window.open(u, '_blank');
                    if (w) opened++
                });
                if (opened < urls.length) {
                    var s = openModal('<div class="mh"><h2>Your browser blocked some tabs</h2></div><p>Allow pop-ups for this page to open the whole group at once, or open the links here.</p><div class="glist">' + urls.map(function(u) {
                        var it = items.filter(function(x) {
                            return x.url === u
                        })[0];
                        return '<a class="glink" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + icon(it, 's') + '<span>' + esc(it.title) + '</span></a>'
                    }).join('') + '</div><div class="row"><button class="btn" type="button" id="oc">Close</button></div>');
                    s.querySelector('#oc').addEventListener('click', closeModal);
                }
            }
            $('groups').addEventListener('click', function(e) {
                var b = e.target.closest('[data-open]');
                if (b) openAll(b.getAttribute('data-open'))
            });

            function renameGroup(id) {
                var g = groups.filter(function(x) {
                    return x.id === id
                })[0];
                if (!g) return;
                var s = openModal('<div class="mh"><h2>Rename group</h2></div><label class="f"><span>Group title</span><input id="rT" maxlength="40" value="' + esc(g.title) + '"></label><div class="merr" id="rErr"></div><div class="row"><button class="btn ghost" type="button" id="rC">Cancel</button><button class="btn" type="button" id="rS">Save</button></div>');
                var inp = s.querySelector('#rT');
                inp.focus();
                inp.select();

                function ok() {
                    var t = inp.value.trim();
                    if (!t) {
                        s.querySelector('#rErr').textContent = 'Give your group a title.';
                        return
                    }
                    g.title = t;
                    save();
                    closeModal();
                    renderGroups()
                }
                s.querySelector('#rS').addEventListener('click', ok);
                s.querySelector('#rC').addEventListener('click', closeModal);
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        ok()
                    }
                });
            }

            function delGroup(id) {
                var g = groups.filter(function(x) {
                    return x.id === id
                })[0];
                if (!g) return;
                confirmModal('Delete this group?', '<b>' + esc(g.title) + '</b> will be removed. Your saved sites stay in Favorites.', 'Delete', function() {
                    groups = groups.filter(function(x) {
                        return x.id !== id
                    });
                    save();
                    renderGroups()
                })
            }

            /* settings */
            var TH = [
                ['gold', 'Gold', '#c8921a'],
                ['love', 'Love', '#e0457b'],
                ['github', 'GitHub', '#0969da'],
                ['hacker', 'Hacker', '#00ff66'],
                ['custom', 'Custom', 'conic-gradient(#e0457b,#e6b13a,#00ff66,#0969da,#e0457b)']
            ];

            function settingsModal() {
                var s = openModal('<div class="mh"><h2>Settings</h2></div><h3>Theme</h3><div class="themes">' + TH.map(function(t) {
                        return '<button type="button" class="th' + (S.theme === t[0] ? ' on' : '') + '" data-t="' + t[0] + '"><i style="background:' + t[2] + '"></i>' + t[1] + '</button>'
                    }).join('') + '</div>' +
                    '<div class="cust" id="cust"' + (S.theme === 'custom' ? '' : ' hidden') + '><label>Accent<input type="color" id="cA" value="' + S.custom.accent + '"></label><label>Background<input type="color" id="cB" value="' + S.custom.bg + '"></label></div>' +
                    '<h3>Custom categories</h3><div class="row l" style="margin-bottom:10px" id="ccList"></div><div style="display:flex;gap:8px"><label class="f" style="flex:1;margin:0"><input id="ccIn" maxlength="24" placeholder="New category"></label><button class="btn" type="button" id="ccAdd">Add</button></div><div class="merr" id="ccErr" style="margin-top:8px"></div>' +
                    '<h3>Your data</h3><div class="row l"><button class="btn ghost sm" type="button" id="exp">Export backup</button><button class="btn ghost sm" type="button" id="imp">Import backup</button><button class="btn ghost sm" type="button" id="csv">Export CSV</button><button class="btn danger sm" type="button" id="clr">Erase all</button></div>' +
                    '<input type="file" id="file" accept=".json,application/json" hidden><p style="margin:14px 0 0;font-size:13px">' + items.length + ' favorites, ' + groups.length + ' groups, stored only in this browser.</p>' +
                    '<div class="row"><button class="btn" type="button" id="sDone">Done</button></div>');

                function cats() {
                    s.querySelector('#ccList').innerHTML = S.cats.length ? S.cats.map(function(c, i) {
                        return '<span class="cc">' + esc(c) + '<button type="button" data-i="' + i + '" aria-label="Remove ' + esc(c) + '">×</button></span>'
                    }).join('') : '<span style="font-size:13px;color:var(--muted)">None yet</span>'
                }
                cats();
                s.querySelector('.themes').addEventListener('click', function(e) {
                    var b = e.target.closest('.th');
                    if (!b) return;
                    S.theme = b.getAttribute('data-t');
                    arr(s.querySelectorAll('.th')).forEach(function(x) {
                        x.classList.toggle('on', x === b)
                    });
                    s.querySelector('#cust').hidden = S.theme !== 'custom';
                    applyTheme();
                    save()
                });
                s.querySelector('#cA').addEventListener('input', function(e) {
                    S.custom.accent = e.target.value;
                    applyTheme();
                    save()
                });
                s.querySelector('#cB').addEventListener('input', function(e) {
                    S.custom.bg = e.target.value;
                    applyTheme();
                    save()
                });

                function addCat() {
                    var v = s.querySelector('#ccIn').value.trim(),
                        er = s.querySelector('#ccErr');
                    if (!v) return;
                    if (allCats().some(function(c) {
                            return c.toLowerCase() === v.toLowerCase()
                        })) {
                        er.textContent = 'That category already exists.';
                        return
                    }
                    S.cats.push(v);
                    save();
                    s.querySelector('#ccIn').value = '';
                    er.textContent = '';
                    cats()
                }
                s.querySelector('#ccAdd').addEventListener('click', addCat);
                s.querySelector('#ccIn').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addCat()
                    }
                });
                s.querySelector('#ccList').addEventListener('click', function(e) {
                    var b = e.target.closest('button');
                    if (!b) return;
                    var c = S.cats.splice(+b.getAttribute('data-i'), 1)[0];
                    items.forEach(function(it) {
                        it.cats = it.cats.filter(function(x) {
                            return x !== c
                        })
                    });
                    save();
                    cats();
                    render()
                });

                function dl(name, text, type) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([text], {
                        type: type
                    }));
                    a.download = name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove()
                }
                s.querySelector('#exp').addEventListener('click', function() {
                    dl('favorites-backup.json', JSON.stringify({
                        items: items,
                        groups: groups,
                        settings: S
                    }), 'application/json')
                });
                s.querySelector('#csv').addEventListener('click', function() {
                    dl('favorites.csv', 'title,url,categories\n' + items.map(function(i) {
                        return [i.title, i.url, i.cats.join('|')].map(function(v) {
                            return '"' + String(v).replace(/"/g, '""') + '"'
                        }).join(',')
                    }).join('\n'), 'text/csv')
                });
                s.querySelector('#imp').addEventListener('click', function() {
                    s.querySelector('#file').click()
                });
                s.querySelector('#file').addEventListener('change', function(e) {
                    var f = e.target.files[0];
                    if (!f) return;
                    var r = new FileReader();
                    r.onload = function() {
                        try {
                            var d = JSON.parse(r.result);
                            if (!d || !Array.isArray(d.items)) throw 0;
                            var have = {};
                            items.forEach(function(i) {
                                have[i.id] = 1
                            });
                            var n = 0;
                            d.items.forEach(function(i) {
                                if (i && i.id && i.url && !have[i.id]) {
                                    i.cats = i.cats || [];
                                    i.host = i.host || hostOf(new URL(i.url));
                                    i.title = i.title || titleOf(new URL(i.url));
                                    items.push(i);
                                    n++
                                }
                            });
                            var gh = {};
                            groups.forEach(function(g) {
                                gh[g.id] = 1
                            });
                            (d.groups || []).forEach(function(g) {
                                if (g && g.id && !gh[g.id] && Array.isArray(g.ids)) groups.push(g)
                            });
                            var sc = d.settings && d.settings.cats;
                            if (Array.isArray(sc)) sc.forEach(function(c) {
                                if (S.cats.indexOf(c) < 0) S.cats.push(c)
                            });
                            save();
                            closeModal();
                            route();
                            toast('Imported ' + n + ' new favorites')
                        } catch (x) {
                            toast('That file is not a valid backup')
                        }
                    };
                    r.readAsText(f);
                });
                s.querySelector('#clr').addEventListener('click', function() {
                    closeModal();
                    confirmModal('Erase everything?', 'All favorites, groups and custom categories will be removed. Export a backup first if you may need them.', 'Erase all', function() {
                        items = [];
                        groups = [];
                        S.cats = [];
                        save();
                        route()
                    })
                });
                s.querySelector('#sDone').addEventListener('click', closeModal);
            }
            $('settings').addEventListener('click', settingsModal);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeMenu();
                    if (scrim) closeModal();
                    else if (grouping) setGrouping(false)
                }
            });
            catLabel();
            route();
        })();
    </script>
</body>

</html>
