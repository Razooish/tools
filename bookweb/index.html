<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites</title>
    <link rel="icon" type="image/x-icon" href="/favourites.ico">

    <style>
         :root {
            --bg: #f7f3e8;
            --sf: #fffdf7;
            --ink: #241d0c;
            --mut: #7a7156;
            --ln: #e8dfc6;
            --ac: #c8921a;
            --ac2: #8f6609;
            --ai: #1c1400;
            --dg: #d6455d;
            --ed: #d8cba6;
            --pop: 0 18px 50px -12px rgba(30, 24, 8, .3);
            --sc: rgba(30, 24, 8, .4);
            --font: ui-rounded, "SF Pro Rounded", "Avenir Next", Nunito, "Segoe UI", system-ui, sans-serif
        }
        
         :root[data-mode=dark] {
            --bg: #14120c;
            --sf: #1e1b12;
            --ink: #f1ead6;
            --mut: #a39a7e;
            --ln: #34301f;
            --ac: #e6b13a;
            --ac2: #a87d12;
            --ai: #1a1300;
            --dg: #ff6b85;
            --ed: #0a0905;
            --pop: 0 18px 50px -12px rgba(0, 0, 0, .7);
            --sc: rgba(0, 0, 0, .6);
            color-scheme: dark
        }
        
        * {
            box-sizing: border-box;
            margin: 0
        }
        
        [hidden] {
            display: none!important
        }
        
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            min-height: 100vh;
            transition: background .3s, color .3s;
            -webkit-font-smoothing: antialiased
        }
        
        button,
        input,
        select {
            font: inherit;
            color: inherit
        }
        
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 1040px;
            margin: 0 auto;
            padding: 28px 24px 110px
        }
        
        #sp {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none
        }
        
        #sp i {
            position: absolute;
            bottom: -24px;
            width: 5px;
            height: 14px;
            border-radius: 3px;
            background: var(--ac);
            animation: fl var(--d) linear infinite
        }
        
        #sp i:nth-child(3n) {
            background: var(--ac2);
            width: 4px;
            height: 10px
        }
        
        #sp i:nth-child(3n+1) {
            background: var(--ed)
        }
        
        @keyframes fl {
            from {
                transform: translateY(0) rotate(var(--r))
            }
            to {
                transform: translateY(-115vh) rotate(calc(var(--r) + 360deg))
            }
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px
        }
        
        .ttl {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0
        }
        
        h1 {
            font-size: 22px;
            letter-spacing: -.02em
        }
        
        .tools {
            display: flex;
            gap: 8px
        }
        
        .b {
            height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            background: var(--ac);
            color: var(--ai);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 4px 0 var(--ac2);
            transition: transform .1s, box-shadow .1s, filter .2s
        }
        
        .b:hover {
            filter: brightness(1.06)
        }
        
        .b:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--ac2)
        }
        
        .b.g {
            background: var(--sf);
            color: var(--ink);
            border: 1px solid var(--ln);
            box-shadow: 0 4px 0 var(--ed)
        }
        
        .b.g:active {
            box-shadow: 0 1px 0 var(--ed)
        }
        
        .b.g.on {
            background: var(--ac);
            color: var(--ai);
            border-color: var(--ac);
            box-shadow: 0 4px 0 var(--ac2)
        }
        
        .b.dg {
            background: var(--dg);
            color: #fff;
            box-shadow: 0 4px 0 #9c2a3d
        }
        
        .b.sm {
            height: 34px;
            padding: 0 14px;
            font-size: 13px
        }
        
        .b.sq {
            width: 40px;
            padding: 0
        }
        
        .b svg {
            width: 18px;
            height: 18px;
            flex: none
        }
        
        .sun {
            display: none
        }
        
         :root[data-mode=dark] .sun {
            display: block
        }
        
         :root[data-mode=dark] .moon {
            display: none
        }
        
         :focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }
        
        .bar {
            display: flex;
            gap: 6px;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 999px;
            padding: 6px;
            box-shadow: 0 5px 0 var(--ed)
        }
        
        .bar:focus-within {
            border-color: var(--ac)
        }
        
        .bar input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            padding: 10px 16px
        }
        
        .bar input::placeholder {
            color: var(--mut)
        }
        
        .err {
            min-height: 20px;
            margin: 12px 0 0 20px;
            font-size: 13px;
            color: var(--dg)
        }
        
        .sub {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 8px 0 20px
        }
        
        .chips {
            flex: 1;
            min-width: 0
        }
        
        .chips-in {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 4px 10px
        }
        
        .chip {
            flex: none;
            height: 36px;
            padding: 0 16px;
            font-size: 14px;
            text-transform: capitalize
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px
        }
        
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 26px 16px 20px;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 18px;
            box-shadow: 0 6px 0 var(--ed);
            color: inherit;
            text-decoration: none;
            transition: transform .2s, border-color .2s, box-shadow .1s;
            -webkit-touch-callout: none;
            user-select: none
        }
        
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--ac)
        }
        
        .card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--ed)
        }
        
        .card.ctx,
        .card.picked {
            border-color: var(--ac)
        }
        
        .card.picked {
            box-shadow: 0 0 0 1px var(--ac), 0 6px 0 var(--ed)
        }
        
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: var(--ac);
            opacity: 0;
            pointer-events: none
        }
        
        .card.nudge {
            animation: shk 1.1s
        }
        
        .card.nudge::after {
            animation: glo 1.4s
        }
        
        @keyframes shk {
            0%,
            100% {
                transform: none
            }
            10%,
            50%,
            90% {
                transform: translateX(-3px) rotate(-1deg)
            }
            30%,
            70% {
                transform: translateX(3px) rotate(1deg)
            }
        }
        
        @keyframes glo {
            0%,
            100% {
                opacity: 0
            }
            40% {
                opacity: .3
            }
        }
        
        .ico {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
            flex: none
        }
        
        .ico img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px
        }
        
        .ico.s {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 12px
        }
        
        .ico.s img {
            padding: 2px
        }
        
        .t {
            font-weight: 600;
            font-size: 16px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .h {
            font-size: 13px;
            color: var(--mut);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: -6px
        }
        
        .tags {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 22px
        }
        
        .tags i {
            font-style: normal;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 99px;
            background: var(--bg);
            border: 1px solid var(--ln);
            color: var(--mut);
            text-transform: capitalize;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .check {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--ln);
            background: var(--bg);
            display: grid;
            place-items: center
        }
        
        .check svg {
            width: 13px;
            height: 13px;
            opacity: 0;
            stroke: var(--ai)
        }
        
        .picked .check {
            background: var(--ac);
            border-color: var(--ac)
        }
        
        .picked .check svg {
            opacity: 1
        }
        
        .empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--mut);
            padding: 72px 0
        }
        
        .mut {
            color: var(--mut);
            font-size: 13px
        }
        
        .bulk {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            max-width: 94vw;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 26px;
            box-shadow: var(--pop)
        }
        
        .groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px
        }
        
        .gcard {
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 6px 0 var(--ed)
        }
        
        .gcard.ctx {
            border-color: var(--ac)
        }
        
        .ghead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px
        }
        
        .gt {
            font-size: 18px;
            font-weight: 700;
            word-break: break-word
        }
        
        .gn {
            font-size: 13px;
            color: var(--mut);
            margin-top: 3px
        }
        
        .glist {
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        
        .glink {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            margin: 0 -8px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit
        }
        
        .glink:hover {
            background: var(--bg)
        }
        
        .glink span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .gcard h2 {
            font-size: 18px;
            margin-bottom: 14px
        }
        
        .set {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 0
        }
        
        .rw {
            display: flex;
            flex-wrap: wrap;
            gap: 10px
        }
        
        .gcard p {
            margin-top: 14px
        }
        
        select,
        .f input {
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 10px 12px;
            outline: 0
        }
        
        .f input {
            width: 100%
        }
        
        .f input:focus {
            border-color: var(--ac)
        }
        
        input.sw {
            appearance: none;
            flex: none;
            width: 46px;
            height: 26px;
            border-radius: 99px;
            background: var(--ln);
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--ed);
            transition: background .2s
        }
        
        .sw::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--sf);
            transition: transform .2s
        }
        
        .sw:checked {
            background: var(--ac)
        }
        
        .sw:checked::after {
            transform: translateX(20px)
        }
        
        .cc {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 4px 4px 12px;
            margin: 0 6px 6px 0;
            border-radius: 99px;
            background: var(--bg);
            border: 1px solid var(--ln);
            font-size: 13px;
            text-transform: capitalize
        }
        
        .cc button {
            border: 0;
            background: var(--ln);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer
        }
        
        .menu {
            position: fixed;
            z-index: 50;
            min-width: 160px;
            padding: 6px;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 14px;
            box-shadow: var(--pop)
        }
        
        .mi {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left
        }
        
        .mi:hover {
            background: var(--bg)
        }
        
        .mi.dg {
            color: var(--dg)
        }
        
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: var(--sc);
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            padding: 20px
        }
        
        .modal {
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--pop)
        }
        
        .modal h2 {
            font-size: 19px;
            margin-bottom: 16px
        }
        
        .modal p,
        .modal li {
            color: var(--mut);
            line-height: 1.55;
            font-size: 15px
        }
        
        .modal p b,
        .modal li b {
            color: var(--ink)
        }
        
        .modal ul {
            padding-left: 18px;
            display: grid;
            gap: 10px
        }
        
        .f {
            display: block;
            margin-bottom: 14px
        }
        
        .f>span {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin: 0 0 6px 4px
        }
        
        .row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
            flex-wrap: wrap
        }
        
        .merr {
            color: var(--dg);
            font-size: 13px;
            min-height: 18px
        }
        
        .toast {
            position: fixed;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            background: var(--ink);
            color: var(--bg);
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 14px;
            box-shadow: var(--pop);
            max-width: 90vw
        }
        
        @media(max-width:620px) {
            .wrap {
                padding: 20px 14px 120px
            }
            .lbl {
                display: none
            }
            .b:not(.sq):not(.sm):not(.chip) {
                padding: 0 16px
            }
            .b.tl {
                width: 40px;
                padding: 0
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px
            }
            .card {
                padding: 22px 6px 12px;
                gap: 8px;
                border-radius: 14px
            }
            .card .ico {
                width: 40px;
                height: 40px;
                font-size: 17px
            }
            .t {
                font-size: 12px
            }
            .h {
                display: none
            }
            .tags {
                min-height: 18px
            }
            .tags i {
                font-size: 10px;
                padding: 2px 7px;
                max-width: 70px
            }
            .tags i:nth-child(n+2) {
                display: none
            }
            .check {
                top: 6px;
                left: 6px;
                width: 20px;
                height: 20px
            }
            .cnt {
                display: none
            }
            .sub {
                flex-direction: column
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            #sp {
                display: none
            }
            * {
                animation: none!important;
                transition: none!important
            }
        }
    </style>
</head>

<body>
    <div id="sp" aria-hidden="true"></div>
    <div class="wrap">
        <header>
            <div class="ttl">
                <a class="b g sq" id="back" href="#" aria-label="Back" hidden></a>
                <h1 id="title">Favorites</h1>
            </div>
            <div class="tools">
                <button class="b g sq" id="theme" type="button" aria-label="Switch light or dark mode"></button>
                <button class="b g sq" id="info" type="button" aria-label="How to use"></button>
                <button class="b g tl" id="rnd" type="button" aria-label="Open a random link"></button>
                <a class="b g tl" href="#groups" id="gl" aria-label="Groups"></a>
                <a class="b g sq" href="#settings" id="sl" aria-label="Settings"></a>
            </div>
        </header>
        <section id="homeView">
            <div class="bar"><input id="url" type="text" aria-label="Links and categories" autocomplete="off" spellcheck="false"><button class="b" id="save" type="button">Save</button></div>
            <div class="err" id="err" role="alert"></div>
            <div class="sub">
                <div class="chips" id="chips" hidden>
                    <div class="chips-in" id="chipsIn"></div>
                </div><button class="b g" id="selBtn" type="button" aria-pressed="false" hidden>Select</button></div>
            <main class="grid" id="grid"></main>
        </section>
        <section id="groupsView" hidden>
            <div class="groups" id="groups"></div>
        </section>
        <section id="settingsView" class="groups" hidden></section>
    </div>
    <div class="bulk" id="bulk" hidden><span class="mut cnt" id="bn"></span><button class="b dg sm" id="bDel" type="button">Delete Selected URLs</button><button class="b sm" id="bGrp" type="button">Group Selected URLs</button></div>
    <script>
        (() => {
                const $ = id => document.getElementById(id),
                    Q = (e, s) => e.querySelector(s),
                    root = document.documentElement;
                const K = {
                    i: "favorites.v3",
                    g: "favorites.groups",
                    s: "favorites.settings",
                    m: "favorites.theme"
                };
                const st = {
                    get: k => {
                        try {
                            return localStorage.getItem(k)
                        } catch (e) {
                            return null
                        }
                    },
                    set: (k, v) => {
                        try {
                            localStorage.setItem(k, v);
                            return true
                        } catch (e) {
                            return false
                        }
                    }
                };
                const ld = (k, d) => {
                    try {
                        const v = JSON.parse(st.get(k));
                        return v == null ? d : v
                    } catch (e) {
                        return d
                    }
                };
                const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
                const I = {
                    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
                    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
                    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
                    rnd: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
                    grp: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
                    set: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
                    back: '<path d="M15 6l-6 6 6 6"/>',
                    ok: '<path d="M5 12.5l4.5 4.5L19 7" stroke-width="3.5"/>'
                };
                $("back").innerHTML = SV(I.back);
                $("theme").innerHTML = SV(I.moon).replace("<svg", "<svg class=moon") + SV(I.sun).replace("<svg", "<svg class=sun");
                $("info").innerHTML = SV(I.info);
                $("rnd").innerHTML = SV(I.rnd) + '<span class="lbl">Random</span>';
                $("gl").innerHTML = SV(I.grp) + '<span class="lbl">Groups</span>';
                $("sl").innerHTML = SV(I.set);
                const D = {
                    spr: true,
                    nudge: true,
                    every: 15,
                    rnd: "tab"
                };
                let items = [],
                    groups = [],
                    S = {},
                    mode, filter = "All",
                    sel = {},
                    selecting = false;
                const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                const esc = s => String(s).replace(/[&<>"']/g, c => ({
                    "&": "&amp;",
                    "<": "&lt;",
