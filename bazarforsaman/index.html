<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>My List</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text: #222222;
        --muted: #999999;
        --border: #eeeeee;
        --accent: #222222;
        --soft: #f6f6f6;
        --green: #27845d;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      /* TOP BAR */

      .topbar {
        height: 65px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 25px;
      }

      .history-btn {
        border: 1px solid var(--border);
        background: white;
        padding: 9px 13px;
        border-radius: 9px;
        color: #555;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .history-btn:hover {
        background: var(--soft);
      }

      /* MAIN LIST */

      main {
        width: 100%;
        max-width: 650px;
        margin: 35px auto 110px;
        padding: 0 22px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .item {
        min-height: 67px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 8px;
        border-bottom: 1px solid var(--border);
        animation: appear 0.2s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* CHECKBOX */

      .check {
        width: 21px;
        height: 21px;
        flex-shrink: 0;
        border: 1.5px solid #d5d5d5;
        border-radius: 7px;
        background: white;
        display: grid;
        place-items: center;
        color: white;
        transition: 0.15s;
      }

      .check.done {
        background: var(--green);
        border-color: var(--green);
      }

      .check.done::after {
        content: "✓";
        font-size: 13px;
        font-weight: bold;
      }

      /* ITEM CONTENT */

      .item-info {
        flex: 1;
        min-width: 0;
      }

      .item-name {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .item.completed .item-name {
        color: #aaa;
        text-decoration: line-through;
      }

      .item-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        opacity: 0.55;
      }

      .action {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #666;
        font-size: 16px;
        display: grid;
        place-items: center;
      }

      .action:hover {
        background: var(--soft);
        opacity: 1;
      }

      .action.delete:hover {
        color: #d44;
      }

      /* BOTTOM ADD BUTTON */

      .bottom-area {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        background: linear-gradient(to top, white 75%, rgba(255, 255, 255, 0));
        z-index: 10;
      }

      .add-btn {
        height: 51px;
        min-width: 160px;
        border: none;
        border-radius: 14px;
        padding: 0 24px;
        background: #222;
        color: white;
        font-size: 14px;
        font-weight: 650;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        transition: 0.2s;
      }

      .add-btn:hover {
        background: #444;
        transform: translateY(-2px);
      }

      .add-btn span {
        font-size: 21px;
        font-weight: 400;
      }

      /* MODALS */

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 18px;
      }

      .overlay.active {
        display: flex;
      }

      .modal {
        background: white;
        width: 100%;
        max-width: 430px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 17px;
        padding: 25px;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.15);
        animation: modalIn 0.18s ease;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 21px;
      }

      .modal-header h2 {
        font-size: 19px;
        font-weight: 700;
      }

      .close-btn {
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--soft);
        color: #555;
        font-size: 19px;
      }

      /* INPUT */

      .input-label {
        font-size: 12px;
        color: #777;
        display: block;
        margin-bottom: 9px;
        font-weight: 600;
      }

      #itemInput {
        width: 100%;
        min-height: 105px;
        resize: vertical;
        padding: 15px;
        border: 1px solid #e5e5e5;
        border-radius: 11px;
        outline: none;
        font-size: 15px;
        line-height: 1.6;
        color: #222;
        background: #fff;
      }

      #itemInput:focus {
        border-color: #888;
      }

      #itemInput::placeholder {
        color: #aaa;
      }

      .examples {
        margin-top: 12px;
        font-size: 11px;
        line-height: 1.8;
        color: #999;
      }

      .submit-btn {
        width: 100%;
        height: 46px;
        margin-top: 20px;
        border: none;
        border-radius: 10px;
        background: #222;
        color: white;
        font-size: 13px;
        font-weight: 650;
      }

      .submit-btn:hover {
        background: #444;
      }

      /* HISTORY MODAL */

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .history-entry {
        padding: 13px 0;
        border-bottom: 1px solid var(--border);
      }

      .history-original {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        overflow-wrap: anywhere;
      }

      .history-date {
        margin-top: 5px;
        font-size: 10px;
        color: #aaa;
      }

      .history-empty {
        text-align: center;
        padding: 30px 5px;
        font-size: 13px;
        color: #aaa;
      }

      /* SMALL SCREENS */

      @media (max-width: 480px) {
        .topbar {
          height: 58px;
          padding: 0 17px;
        }

        main {
          margin-top: 18px;
          padding: 0 17px;
        }

        .item-name {
          font-size: 14px;
        }

        .item-actions {
          opacity: 0.8;
        }

        .modal {
          padding: 21px;
        }
      }
    </style>
  </head>

  <body>
    <!-- TOP RIGHT ORIGINAL INPUTS BUTTON -->
    <header class="topbar">
      <button class="history-btn" id="historyBtn">
        <span>☷</span>
      </button>
    </header>

    <!-- SHOPPING LIST -->
    <main>
      <div class="list" id="shoppingList"></div>
    </main>

    <!-- ADD BUTTON -->
    <div class="bottom-area">
      <button class="add-btn" id="addBtn"><span>+</span> Add item</button>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="overlay" id="itemOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">Add item</h2>
          <button class="close-btn" data-close="itemOverlay">×</button>
        </div>

        <label class="input-label" for="itemInput"> WHAT DO YOU NEED? </label>

        <textarea
          id="itemInput"
          placeholder="ek kilo chamal&#10;ada kg maida&#10;ek litre dudh"
          autocomplete="off"
        ></textarea>

        <div class="examples">
          Examples: ek kilo chamal · dui darzan kola · char wota shampoo · pawa
          chini
        </div>

        <button class="submit-btn" id="saveBtn">Add to list</button>
      </div>
    </div>

    <!-- ORIGINAL INPUTS MODAL -->
    <div class="overlay" id="historyOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2>Original inputs</h2>
          <button class="close-btn" data-close="historyOverlay">×</button>
        </div>

        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <script>
      // =============================================
      // 1. STORAGE
      // =============================================

      const STORAGE_KEY = "myShoppingList_v1";
      const HISTORY_KEY = "myShoppingHistory_v1";

      function loadStorage(key, fallback) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return Array.isArray(value) ? value : fallback;
        } catch {
          return fallback;
        }
      }

      let items = loadStorage(STORAGE_KEY, []);
      let inputHistory = loadStorage(HISTORY_KEY, []);

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(inputHistory));
      }

      function makeId() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      // =============================================
      // 2. NUMBER WORDS
      // =============================================

      const numbers = {
        ek: 1,
        aik: 1,
        ak: 1,
        aek: 1,
        eak: 1,
        eka: 1,
        euta: 1,
        auta: 1,
        one: 1,
        dui: 2,
        dwi: 2,
        duita: 2,
        two: 2,
        tin: 3,
        teen: 3,
        tinn: 3,
        tina: 3,
        three: 3,
        char: 4,
        chaar: 4,
        chau: 4,
        four: 4,
        panch: 5,
        paanch: 5,
        pach: 5,
        five: 5,
        chha: 6,
        chhe: 6,
        che: 6,
        six: 6,
        saat: 7,
        sat: 7,
        seven: 7,
        aath: 8,
        ath: 8,
        eight: 8,
        nau: 9,
        naau: 9,
        nine: 9,
        das: 10,
        dasa: 10,
        dus: 10,
        ten: 10,
        gyarah: 11,
        egyarah: 11,
        bara: 12,
        barah: 12,
        twelve: 12,
        bis: 20,
        bees: 20,
        twenty: 20,
      };

      const halfWords = ["adha", "aadha", "ada", "ardha", "half","adi","aadi","adhi","aadhi"];

      // =============================================
      // 3. UNIT CONVERSIONS
      // =============================================

      const unitAliases = {
        kg: "KG",
        kgs: "KG",
        kilo: "KG",
        kilos: "KG",
        kilogram: "KG",
        kilograms: "KG",

        gram: "g",
        grams: "g",
        gm: "g",
        gms: "g",
        g: "g",

        litre: "L",
        liter: "L",
        litres: "L",
        liters: "L",
        ltr: "L",
        ltrs: "L",
        l: "L",

        darzan: "Dozen",
        darjan: "Dozen",
        dozen: "Dozen",
        doz: "Dozen",

        wota: "pcs",
        ota: "pcs",
        wat: "pcs",
        piece: "pcs",
        pieces: "pcs",
        pc: "pcs",
        pcs: "pcs",

        packet: "pack",
        packets: "pack",
        pkt: "pack",
        pack: "pack",

        bottle: "bottle",
        bottles: "bottle",

        box: "box",
        boxes: "box",
      };

      // =============================================
      // 4. ITEM NAME CONVERSIONS
      // =============================================

      const itemAliases = {
        // Rice
        chamal: "Rice",
        chawal: "Rice",
        chaamal: "Rice",
        chaul: "Rice",
        rice: "Rice",

        // Flour
        maida: "Flour",
        meda: "Flour",
        flour: "Flour",

        // Milk
        dudh: "Milk",
        doodh: "Milk",
        dud: "Milk",
        milk: "Milk",

        // Banana
        kola: "Bananas",
        kela: "Bananas",
        kelā: "Bananas",
        banana: "Bananas",
        bananas: "Bananas",

        // Shampoo
        shampoo: "Shampoo",
        sampoo: "Shampoo",
        shampho: "Shampoo",

        // Sugar
        chini: "Sugar",
        cheeni: "Sugar",
        sugar: "Sugar",

        // Salt
        nun: "Salt",
        noon: "Salt",
        namak: "Salt",
        salt: "Salt",

        // Oil
        tel: "Oil",
        tail: "Oil",
        oil: "Oil",

        // Potato
        alu: "Potatoes",
        aloo: "Potatoes",
        potato: "Potatoes",
        potatoes: "Potatoes",

        // Onion
        pyaj: "Onions",
        pyaaj: "Onions",
        pyaz: "Onions",
        onion: "Onions",
        onions: "Onions",

        // Ginger
        aduwa: "Ginger",
        adrak: "Ginger",
        ginger: "Ginger",

        // Garlic
        lasun: "Garlic",
        lahsun: "Garlic",
        garlic: "Garlic",

        // Tomato
        tamatar: "Tomatoes",
        tomato: "Tomatoes",
        tomatoes: "Tomatoes",

        // Eggs
        anda: "Eggs",
        ande: "Eggs",
        egg: "Eggs",
        eggs: "Eggs",

        // Water
        pani: "Water",
        paani: "Water",
        water: "Water",

        // Soap
        sabun: "Soap",
        sabon: "Soap",
        soap: "Soap",

        // Yogurt
        dahi: "Yogurt",
        curd: "Yogurt",
        yogurt: "Yogurt",

        // Tea
        chiya: "Tea",
        chai: "Tea",
        tea: "Tea",

        // Coffee
        coffee: "Coffee",
        kofi: "Coffee",

        // Lentils
        dal: "Lentils",
        daal: "Lentils",
        lentil: "Lentils",
        lentils: "Lentils",

        // Biscuits
        biscuit: "Biscuits",
        biscuits: "Biscuits",

        // Bread
        bread: "Bread",
        roti: "Bread",

        // Vegetables
        gobi: "Cauliflower",
        cauliflower: "Cauliflower",
        bandakopi: "Cabbage",
        cabbage: "Cabbage",
        gajar: "Carrots",
        carrot: "Carrots",
        carrots: "Carrots",

        // Fruits
        syau: "Apples",
        syaau: "Apples",
        apple: "Apples",
        apples: "Apples",
        suntala: "Oranges",
        orange: "Oranges",
        oranges: "Oranges",

        // Other
        detergent: "Detergent",
        washingpowder: "Washing Powder",
        toothpaste: "Toothpaste",
        brush: "Toothbrush",
        toothbrush: "Toothbrush",
        tissue: "Tissue",
        tissues: "Tissues",
        battery: "Battery",
        batteries: "Batteries",
      };

      // =============================================
      // 5. EMOJI MAPPING
      // =============================================

      const emojis = {
        Rice: "🍚",
        Flour: "🌾",
        Milk: "🥛",
        Bananas: "🍌",
        Shampoo: "🧴",
        Sugar: "🍬",
        Salt: "🧂",
        Oil: "🫗",
        Potatoes: "🥔",
        Onions: "🧅",
        Ginger: "🫚",
        Garlic: "🧄",
        Tomatoes: "🍅",
        Eggs: "🥚",
        Water: "💧",
        Soap: "🧼",
        Yogurt: "🥣",
        Tea: "🍵",
        Coffee: "☕",
        Lentils: "🫘",
        Biscuits: "🍪",
        Bread: "🍞",
        Cauliflower: "🥦",
        Cabbage: "🥬",
        Carrots: "🥕",
        Apples: "🍎",
        Oranges: "🍊",
        Detergent: "🧺",
        "Washing Powder": "🧺",
        Toothpaste: "🪥",
        Toothbrush: "🪥",
        Tissue: "🧻",
        Tissues: "🧻",
        Battery: "🔋",
        Batteries: "🔋",
      };

      // =============================================
      // 6. INTELLIGENT INPUT PARSER
      // =============================================

      function parseInput(raw) {
        let words = raw
          .toLowerCase()
          .trim()
          .replace(/[.,!?]/g, "")
          .split(/\s+/)
          .filter(Boolean);

        if (!words.length) return null;

        let quantity = 1;
        let unit = "pcs";

        const remove = new Set();

        // Find quantity.
        let quantityIndex = -1;

        for (let i = 0; i < words.length; i++) {
          if (numbers[words[i]] !== undefined) {
            quantity = numbers[words[i]];
            quantityIndex = i;
            remove.add(i);
            break;
          }

          if (/^\d+(\.\d+)?$/.test(words[i])) {
            quantity = Number(words[i]);
            quantityIndex = i;
            remove.add(i);
            break;
          }
        }

        // Half quantity: adha kg, aadha kilo, half kg.
        for (let i = 0; i < words.length; i++) {
          if (halfWords.includes(words[i])) {
            const next = words[i + 1] || "";

            const nextUnit = unitAliases[next] || null;

            if (nextUnit === "KG" || nextUnit === "g" || nextUnit === "L") {
              quantity = 0.5;

              if (quantityIndex !== -1) {
                remove.delete(quantityIndex);
              }

              quantityIndex = i;
              remove.add(i);

              break;
            }
          }
        }

        // Detect unit.
        for (let i = 0; i < words.length; i++) {
          const word = words[i];

          if (unitAliases[word]) {
            unit = unitAliases[word];
            remove.add(i);
            break;
          }
        }

        // Special handling: Pawa = quarter kilogram.
        const pawaIndex = words.findIndex((word) =>
          ["pawa", "pau", "paau", "paawa"].includes(word),
        );

        if (pawaIndex !== -1) {
          quantity *= 0.25;
          unit = "KG";

          remove.add(pawaIndex);
        }

        // Remove filler words.
        const fillers = [
          "ko",
          "ka",
          "ki",
          "ra",
          "for",
          "of",
          "the",
          "and",
          "kilo",
          "kg",
        ];

        words.forEach((word, index) => {
          if (fillers.includes(word)) {
            remove.add(index);
          }
        });

        // Remove quantity and unit words.
        let remaining = words.filter((word, index) => !remove.has(index));

        // Try matching item aliases, including multiword names.
        let itemName = "";

        const aliases = Object.keys(itemAliases).sort(
          (a, b) => b.length - a.length,
        );

        const joined = remaining.join("");

        for (const alias of aliases) {
          if (joined === alias) {
            itemName = itemAliases[alias];
            remaining = [];
            break;
          }
        }

        // Match aliases with multiple separate tokens.
        if (!itemName) {
          for (const alias of aliases) {
            const aliasWords = alias.split(" ");

            for (let i = 0; i <= remaining.length - aliasWords.length; i++) {
              const matches = aliasWords.every(
                (word, j) => remaining[i + j] === word,
              );

              if (matches) {
                itemName = itemAliases[alias];

                remaining.splice(i, aliasWords.length);

                break;
              }
            }

            if (itemName) break;
          }
        }

        // Fallback: use the original remaining words.
        if (!itemName) {
          itemName = remaining
            .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
        }

        if (!itemName) return null;

        // Format quantity.
        quantity = Number(quantity.toFixed(3));

        return {
          quantity,
          unit,
          name: itemName,
          emoji: emojis[itemName] || "🛒",
        };
      }

      // =============================================
      // 7. MODAL MANAGEMENT
      // =============================================

      const itemOverlay = document.getElementById("itemOverlay");
      const historyOverlay = document.getElementById("historyOverlay");

      const itemInput = document.getElementById("itemInput");

      const modalTitle = document.getElementById("modalTitle");
      const saveBtn = document.getElementById("saveBtn");

      let editingId = null;

      function openItemModal(id = null) {
        editingId = id;

        if (id) {
          const item = items.find((item) => item.id === id);

          if (!item) return;

          itemInput.value = item.rawInput;

          modalTitle.textContent = "Edit item";
          saveBtn.textContent = "Save changes";
        } else {
          itemInput.value = "";

          modalTitle.textContent = "Add item";
          saveBtn.textContent = "Add to list";
        }

        itemOverlay.classList.add("active");

        setTimeout(() => itemInput.focus(), 100);
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("active");
      }

      document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => {
          closeModal(button.dataset.close);
        });
      });

      [itemOverlay, historyOverlay].forEach((overlay) => {
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) {
            overlay.classList.remove("active");
          }
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          itemOverlay.classList.remove("active");
          historyOverlay.classList.remove("active");
        }
      });

      document.getElementById("addBtn").addEventListener("click", () => {
        openItemModal();
      });

      // =============================================
      // 8. SAVE ITEM
      // =============================================

      function saveItem() {
        const raw = itemInput.value.trim();

        if (!raw) {
          itemInput.focus();
          return;
        }

        const parsed = parseInput(raw);

        if (!parsed) return;

        const timestamp = new Date().toISOString();

        if (editingId) {
          const item = items.find((item) => item.id === editingId);

          if (!item) return;

          Object.assign(item, parsed, {
            rawInput: raw,
            updatedAt: timestamp,
          });

          // Preserve the exact newly entered text.
          inputHistory.push({
            id: makeId(),
            itemId: item.id,
            text: raw,
            date: timestamp,
          });
        } else {
          const newItem = {
            id: makeId(),
            ...parsed,
            rawInput: raw,
            completed: false,
            createdAt: timestamp,
          };

          items.push(newItem);

          // Archive exact original input.
          inputHistory.push({
            id: makeId(),
            itemId: newItem.id,
            text: raw,
            date: timestamp,
          });
        }

        saveData();

        renderList();

        closeModal("itemOverlay");

        editingId = null;
      }

      saveBtn.addEventListener("click", saveItem);

      // Ctrl + Enter to submit.
      itemInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          saveItem();
        }
      });

      // =============================================
      // 9. DISPLAY ITEM
      // =============================================

      function formatQuantity(quantity) {
        return Number(quantity).toString();
      }

      function renderList() {
        const list = document.getElementById("shoppingList");

        list.innerHTML = "";

        items.forEach((item) => {
          const row = document.createElement("div");

          row.className = "item" + (item.completed ? " completed" : "");

          // Checkbox.
          const check = document.createElement("button");

          check.className = "check" + (item.completed ? " done" : "");

          check.setAttribute(
            "aria-label",
            item.completed ? "Unmark item" : "Mark item",
          );

          check.addEventListener("click", () => {
            item.completed = !item.completed;

            saveData();

            renderList();
          });

          // Item name.
          const info = document.createElement("div");

          info.className = "item-info";

          const name = document.createElement("div");

          name.className = "item-name";

          name.textContent = `${formatQuantity(item.quantity)} ${item.unit} ${item.name} ${item.emoji}`;

          info.appendChild(name);

          // Actions.
          const actions = document.createElement("div");

          actions.className = "item-actions";

          const edit = document.createElement("button");

          edit.className = "action";

          edit.innerHTML = "✎";

          edit.setAttribute("aria-label", "Edit item");

          edit.addEventListener("click", () => {
            openItemModal(item.id);
          });

          const del = document.createElement("button");

          del.className = "action delete";

          del.innerHTML = "×";

          del.setAttribute("aria-label", "Delete item");

          del.addEventListener("click", () => {
            items = items.filter((i) => i.id !== item.id);

            // Original input archive remains untouched.
            saveData();

            renderList();
          });

          actions.append(edit, del);

          row.append(check, info, actions);

          list.appendChild(row);
        });
      }

      // =============================================
      // 10. ORIGINAL INPUT HISTORY
      // =============================================

      function renderHistory() {
        const historyList = document.getElementById("historyList");

        historyList.innerHTML = "";

        if (!inputHistory.length) {
          const empty = document.createElement("div");

          empty.className = "history-empty";

          empty.textContent = "No original inputs yet.";

          historyList.appendChild(empty);

          return;
        }

        // Newest first.
        [...inputHistory].reverse().forEach((entry) => {
          const row = document.createElement("div");

          row.className = "history-entry";

          const original = document.createElement("div");

          original.className = "history-original";

          // Exact original text, no conversion.
          original.textContent = entry.text;

          const date = document.createElement("div");

          date.className = "history-date";

          const parsedDate = new Date(entry.date);

          date.textContent = Number.isNaN(parsedDate.getTime())
            ? ""
            : parsedDate.toLocaleString();

          row.append(original, date);

          historyList.appendChild(row);
        });
      }

      document.getElementById("historyBtn").addEventListener("click", () => {
        renderHistory();

        historyOverlay.classList.add("active");
      });

      // =============================================
      // 11. INITIALIZATION
      // =============================================

      renderList();
    </script>
  </body>
</html>
