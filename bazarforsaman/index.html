<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>My List</title>

    <style>
        /* =========================================================
           1. DESIGN TOKENS
           ========================================================= */
        
         :root {
            /* Colors */
            --color-background: #ffffff;
            --color-surface: #ffffff;
            --color-text: #222222;
            --color-muted: #999999;
            --color-border: #eeeeee;
            --color-accent: #222222;
            --color-soft: #f6f6f6;
            --color-success: #27845d;
            --color-danger: #d44;
            /* Typography */
            --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-size-xs: 11px;
            --font-size-sm: 12px;
            --font-size-md: 14px;
            --font-size-lg: 15px;
            --font-size-xl: 19px;
            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;
            /* Border radius */
            --radius-sm: 8px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 17px;
            /* Shadows */
            --shadow-button: 0 5px 18px rgba(0, 0, 0, 0.12);
            --shadow-modal: 0 20px 70px rgba(0, 0, 0, 0.15);
            /* Layout */
            --content-width: 650px;
            --modal-width: 430px;
            --header-height: 65px;
        }
        /* =========================================================
           2. RESET
           ========================================================= */
        
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* =========================================================
           3. BASE STYLES
           ========================================================= */
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            min-height: 100vh;
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
        }
        
        button,
        input,
        textarea {
            font: inherit;
        }
        
        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        button:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--color-success);
            outline-offset: 3px;
        }
        /* =========================================================
           4. HEADER
           ========================================================= */
        
        .topbar {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 25px;
        }
        
        .history-btn {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: 9px 13px;
            border-radius: var(--radius-md);
            color: #555555;
            font-size: var(--font-size-sm);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        
        .history-btn:hover {
            background: var(--color-soft);
        }
        /* =========================================================
           5. MAIN LIST
           ========================================================= */
        
        main {
            width: 100%;
            max-width: var(--content-width);
            margin: 35px auto 110px;
            padding: 0 22px;
        }
        
        .list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .item {
            min-height: 67px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 8px;
            border-bottom: 1px solid var(--color-border);
            animation: itemAppear 0.2s ease;
        }
        
        .item-info {
            flex: 1;
            min-width: 0;
        }
        
        .item-name {
            font-size: var(--font-size-lg);
            font-weight: 600;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        
        .item.completed .item-name {
            color: #aaaaaa;
            text-decoration: line-through;
        }
        /* =========================================================
           6. CHECKBOX
           ========================================================= */
        
        .check {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
            border: 1.5px solid #d5d5d5;
            border-radius: 7px;
            background: white;
            display: grid;
            place-items: center;
            color: white;
            transition: 0.15s;
        }
        
        .check.done {
            background: var(--color-success);
            border-color: var(--color-success);
        }
        
        .check.done::after {
            content: "✓";
            font-size: 13px;
            font-weight: bold;
        }
        /* =========================================================
           7. ITEM ACTIONS
           ========================================================= */
        
        .item-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.55;
        }
        
        .action {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: #666666;
            font-size: 16px;
            display: grid;
            place-items: center;
        }
        
        .action:hover {
            background: var(--color-soft);
            opacity: 1;
        }
        
        .action-delete:hover {
            color: var(--color-danger);
        }
        /* =========================================================
           8. BOTTOM ADD BUTTON
           ========================================================= */
        
        .bottom-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            background: linear-gradient( to top, white 75%, rgba(255, 255, 255, 0));
            z-index: 10;
        }
        
        .add-btn {
            height: 51px;
            min-width: 160px;
            border: none;
            border-radius: var(--radius-lg);
            padding: 0 24px;
            background: var(--color-accent);
            color: white;
            font-size: var(--font-size-md);
            font-weight: 650;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            box-shadow: var(--shadow-button);
            transition: 0.2s;
        }
        
        .add-btn:hover {
            background: #444444;
            transform: translateY(-2px);
        }
        
        .add-btn span {
            font-size: 21px;
            font-weight: 400;
        }
        /* =========================================================
           9. MODAL OVERLAY
           ========================================================= */
        
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }
        
        .overlay.active {
            display: flex;
        }
        
        .modal {
            background: var(--color-surface);
            width: 100%;
            max-width: var(--modal-width);
            max-height: 85vh;
            overflow-y: auto;
            border-radius: var(--radius-xl);
            padding: 25px;
            box-shadow: var(--shadow-modal);
            animation: modalAppear 0.18s ease;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 21px;
        }
        
        .modal-header h2 {
            font-size: var(--font-size-xl);
            font-weight: 700;
        }
        
        .close-btn {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--color-soft);
            color: #555555;
            font-size: 19px;
            display: grid;
            place-items: center;
        }
        
        .close-btn:hover {
            background: #eeeeee;
        }
        /* =========================================================
           10. INPUT
           ========================================================= */
        
        .input-label {
            font-size: var(--font-size-sm);
            color: #777777;
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
        }
        
        #itemInput {
            width: 100%;
            min-height: 105px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #e5e5e5;
            border-radius: 11px;
            outline: none;
            font-size: var(--font-size-lg);
            line-height: 1.6;
            color: var(--color-text);
            background: var(--color-surface);
        }
        
        #itemInput:focus {
            border-color: #888888;
        }
        
        #itemInput::placeholder {
            color: #aaaaaa;
        }
        
        .examples {
            margin-top: 12px;
            font-size: var(--font-size-xs);
            line-height: 1.8;
            color: var(--color-muted);
        }
        
        .submit-btn {
            width: 100%;
            height: 46px;
            margin-top: 20px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--color-accent);
            color: white;
            font-size: 13px;
            font-weight: 650;
        }
        
        .submit-btn:hover {
            background: #444444;
        }
        /* =========================================================
           11. HISTORY
           ========================================================= */
        
        .history-list {
            display: flex;
            flex-direction: column;
        }
        
        .history-entry {
            padding: 13px 0;
            border-bottom: 1px solid var(--color-border);
        }
        
        .history-original {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: #333333;
            overflow-wrap: anywhere;
        }
        
        .history-date {
            margin-top: 5px;
            font-size: 10px;
            color: #aaaaaa;
        }
        
        .history-empty {
            text-align: center;
            padding: 30px 5px;
            font-size: 13px;
            color: #aaaaaa;
        }
        /* =========================================================
           12. EMPTY LIST
           ========================================================= */
        
        .list-empty {
            text-align: center;
            padding: 45px 15px;
            color: var(--color-muted);
            font-size: var(--font-size-md);
        }
        /* =========================================================
           13. ANIMATIONS
           ========================================================= */
        
        @keyframes itemAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* =========================================================
           14. RESPONSIVE DESIGN
           ========================================================= */
        
        @media (max-width: 480px) {
            .topbar {
                height: 58px;
                padding: 0 17px;
            }
            main {
                margin-top: 18px;
                padding: 0 17px;
            }
            .item-name {
                font-size: var(--font-size-md);
            }
            .item-actions {
                opacity: 0.8;
            }
            .modal {
                padding: 21px;
            }
        }
        /* =========================================================
           15. REDUCED MOTION
           ========================================================= */
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

            <button class="submit-btn" id="saveBtn" type="button">

    </div>

        /**
         * Converts grouped aliases into a searchable dictionary.
         *
         * Example:
         *
         * {
         *     "Rice": ["chamal", "chawal", "rice"]
         * }
         *
         * Becomes:
         *
         * {
         *     chamal: "Rice",
         *     chawal: "Rice",
         *     rice: "Rice"
         * }
         */

        function createAliasDictionary(groups) {
            const dictionary = {};

            for (const [canonicalName, aliases] of Object.entries(groups)) {
                for (const alias of aliases) {
                    dictionary[alias.toLowerCase()] = canonicalName;
                }

                // Canonical name is also searchable.
                dictionary[canonicalName.toLowerCase()] = canonicalName;
            }

            return dictionary;
        }


        /**
         * Creates a dictionary where each alias points
         * to the same standardized value.
         */

        function createValueDictionary(groups) {
            const dictionary = {};

            for (const [value, aliases] of Object.entries(groups)) {
                for (const alias of aliases) {
                    dictionary[alias.toLowerCase()] = value;
                }
            }

            return dictionary;
        }

        const Storage = {

            /**
             * Safely load data from localStorage.
             */

            load(key, fallback = []) {
                try {
                    const storedValue = localStorage.getItem(key);

                    if (!storedValue) {
                        return fallback;
                    }

                    const parsedValue = JSON.parse(storedValue);

                    return Array.isArray(parsedValue) ?
                        parsedValue :
                        fallback;

                } catch (error) {
                    console.error(
                        `Unable to load storage key "${key}".`,
                        error
                    );

                    return fallback;
                }
            },


            /**
             * Save application state.
             */

            save() {
                try {
                    localStorage.setItem(
                        CONFIG.storage.items,
                        JSON.stringify(state.items)
                    );

                    localStorage.setItem(
                        CONFIG.storage.history,
                        JSON.stringify(state.inputHistory)
                    );

                } catch (error) {
                    console.error(
                        "Unable to save application data.",
                        error
                    );
                }
            },


            /**
             * Load application data.
             */

            initialize() {
                state.items = this.load(CONFIG.storage.items);
                state.inputHistory = this.load(CONFIG.storage.history);
            },
        };

        /**
         * Generate a unique ID.
         */

        function createId() {
            if (crypto.randomUUID) {
                return crypto.randomUUID();
            }

            return (
                Date.now().toString(36) +
                Math.random().toString(36).slice(2)
            );
        }


        /**
         * Normalize input text.
         */

        function normalizeInput(rawInput) {
            return rawInput
                .toLowerCase()
                .trim()
                .replace(/[.,!?]/g, "")
                .split(/\s+/)
                .filter(Boolean);
        }


        /**
         * Format a quantity.
         */

        function formatQuantity(quantity) {
            return Number(quantity).toString();
        }


        /**
         * Format a date safely.
         */

        function formatDate(dateString) {
            const date = new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return date.toLocaleString();
        }


        /**
         * Create a button safely.
         */

        function createButton({
            className,
            text,
            ariaLabel,
            onClick,
        }) {
            const button = document.createElement("button");

            button.type = "button";
            button.className = className;
            button.textContent = text;
            button.setAttribute("aria-label", ariaLabel);

            button.addEventListener("click", onClick);

            return button;
        }

        /**
         * Find a quantity from a number word.
         */

        function getNumberWord(word) {
            return NUMBER_ALIASES[word];
        }


        /**
         * Find a numeric quantity.
         */

        function getNumericQuantity(word) {
            if (/^\d+(\.\d+)?$/.test(word)) {
                return Number(word);
            }

            return null;
        }


        /**
         * Find a unit alias.
         */

        function getUnit(word) {
            return UNIT_ALIASES[word] || null;
        }


        /**
         * Remove a token by index.
         */

        function removeToken(tokens, index) {
            tokens[index] = null;
        }


        /**
         * Find the longest matching item alias.
         *
         * Supports:
         *
         * basmati rice
         * basmatirice
         * brown rice
         * brownrice
         */

        function findItemAlias(tokens) {
            const validTokens = tokens.filter(Boolean);

            if (!validTokens.length) {
                return null;
            }

            const aliases = Object.keys(ITEM_ALIASES)
                .sort((a, b) => b.length - a.length);

            const joinedText = validTokens.join(" ");
            const compactText = validTokens.join("");

            // Exact match.
            for (const alias of aliases) {
                const compactAlias = alias.replace(/\s+/g, "");

                if (
                    joinedText === alias ||
                    compactText === compactAlias
                ) {
                    return {
                        name: ITEM_ALIASES[alias],
                        matchedAlias: alias,
                    };
                }
            }

            // Multi-word match.
            for (const alias of aliases) {
                const aliasTokens = alias.split(/\s+/);

                if (aliasTokens.length > validTokens.length) {
                    continue;
                }

                for (
                    let start = 0; start <= validTokens.length - aliasTokens.length; start++
                ) {
                    const candidate = validTokens
                        .slice(start, start + aliasTokens.length)
                        .join(" ");

                    if (candidate === alias) {
                        return {
                            name: ITEM_ALIASES[alias],
                            matchedAlias: alias,
                        };
                    }
                }
            }

            return null;
        }


        // =========================================================
        // 14. INPUT PARSER
        // =========================================================

        /**
         * Converts natural-language input into a shopping item.
         *
         * Examples:
         *
         * "ek kilo chamal"
         * "dui darzan kola"
         * "adha kg maida"
         * "char wota shampoo"
         * "pawa chini"
         * "2 litres milk"
         */

        function parseInput(rawInput) {
            const words = normalizeInput(rawInput);

            if (!words.length) {
                return null;
            }

            let quantity = 1;
            let unit = CONFIG.defaultUnit;

            const removableWords = new Set();


            // -----------------------------------------------------
            // A. Detect quantity
            // -----------------------------------------------------

            for (let index = 0; index < words.length; index++) {
                const word = words[index];

                const wordQuantity = getNumberWord(word);
                const numericQuantity = getNumericQuantity(word);

                if (wordQuantity !== undefined) {
                    quantity = wordQuantity;
                    removableWords.add(index);

                    break;
                }

                if (numericQuantity !== null) {
                    quantity = numericQuantity;
                    removableWords.add(index);

                    break;
                }
            }


            // -----------------------------------------------------
            // B. Detect half quantity
            // -----------------------------------------------------

            for (let index = 0; index < words.length; index++) {
                const word = words[index];

                if (!HALF_WORDS.includes(word)) {
                    continue;
                }

                const nextWord = words[index + 1] || "";
                const nextUnit = getUnit(nextWord);

                if (
                    nextUnit === "KG" ||
                    nextUnit === "g" ||
                    nextUnit === "L"
                ) {
                    quantity = 0.5;

                    removableWords.add(index);

                    // Remove any previously detected quantity.
                    for (const removableIndex of removableWords) {
                        if (removableIndex !== index) {
                            removableWords.delete(removableIndex);
                        }
                    }

                    removableWords.add(index);

                    break;
                }
            }


            // -----------------------------------------------------
            // C. Detect units
            // -----------------------------------------------------

            for (let index = 0; index < words.length; index++) {
                const word = words[index];

                const detectedUnit = getUnit(word);

                if (detectedUnit) {
                    unit = detectedUnit;
                    removableWords.add(index);

                    break;
                }
            }


            // -----------------------------------------------------
            // D. Detect special quantity expressions
            // -----------------------------------------------------

            for (let index = 0; index < words.length; index++) {
                const word = words[index];

                const specialQuantity =
                    CONFIG.specialQuantityWords[word];

                if (specialQuantity !== undefined) {
                    quantity *= specialQuantity;

                    unit = "KG";

                    removableWords.add(index);

                    break;
                }
            }


            // -----------------------------------------------------
            // E. Remove filler words
            // -----------------------------------------------------

            words.forEach((word, index) => {
                if (FILLER_WORDS.has(word)) {
                    removableWords.add(index);
                }
            });


            // -----------------------------------------------------
            // F. Remove quantity and unit words
            // -----------------------------------------------------

            const remainingWords = words.filter(
                (word, index) => !removableWords.has(index)
            );


            // -----------------------------------------------------
            // G. Find item alias
            // -----------------------------------------------------

            const aliasMatch = findItemAlias(remainingWords);

            let itemName = "";

            if (aliasMatch) {
                itemName = aliasMatch.name;
            } else {
                itemName = remainingWords
                    .map(word => {
                        return (
                            word.charAt(0).toUpperCase() +
                            word.slice(1)
                        );
                    })
                    .join(" ");
            }


            // -----------------------------------------------------
            // H. Validate
            // -----------------------------------------------------

            if (!itemName.trim()) {
                return null;
            }


            // -----------------------------------------------------
            // I. Return parsed item
            // -----------------------------------------------------

            quantity = Number(quantity.toFixed(3));

            return {
                quantity,
                unit,
                name: itemName,
                emoji: ITEM_EMOJIS[itemName] || "🛒",
            };
        }


        // =========================================================
        // 15. MODAL MANAGEMENT
        // =========================================================

        const Modal = {

            open(overlay) {
                overlay.classList.add("active");
            },


            close(overlay) {
                overlay.classList.remove("active");
            },


            closeAll() {
                this.close(DOM.itemOverlay);
                this.close(DOM.historyOverlay);
            },
        };


        /**
         * Open add/edit modal.
         */

        function openItemModal(itemId = null) {
            state.editingId = itemId;

            const item = itemId ?
                state.items.find(item => item.id === itemId) :
                null;

            if (itemId && !item) {
                return;
            }

            DOM.itemInput.value = item && item.rawInput ? item.rawInput : "";
            DOM.modalTitle.textContent = item ?
                "Edit item" :
                "Add item";

            DOM.saveButton.textContent = item ?
                "Save changes" :
                "Add to list";

            Modal.open(DOM.itemOverlay);

            setTimeout(() => {
                DOM.itemInput.focus();
            }, 100);
        }


        // =========================================================
        // 16. HISTORY OPERATIONS
        // =========================================================

        /**
         * Store the original input.
         */

        function addHistoryEntry(itemId, text, date) {
            state.inputHistory.push({
                id: createId(),
                itemId,
                text,
                date,
            });
        }


        /**
         * Render history.
         */

        function renderHistory() {
            DOM.historyList.replaceChildren();

            if (!state.inputHistory.length) {
                const emptyMessage = document.createElement("div");

                emptyMessage.className = "history-empty";
                emptyMessage.textContent = "No original inputs yet.";

                DOM.historyList.appendChild(emptyMessage);

                return;
            }

            // Display newest entries first.
            const entries = [...state.inputHistory].reverse();

            entries.forEach(entry => {
                const row = document.createElement("div");

                row.className = "history-entry";

                const original = document.createElement("div");

                original.className = "history-original";
                original.textContent = entry.text;

                const date = document.createElement("div");

                date.className = "history-date";
                date.textContent = formatDate(entry.date);

                row.append(original, date);

                DOM.historyList.appendChild(row);
            });
        }


        // =========================================================
        // 17. ITEM OPERATIONS
        // =========================================================

        /**
         * Add a new item.
         */

        function addItem(parsedItem, rawInput) {
            const timestamp = new Date().toISOString();

            const newItem = {
                id: createId(),
                ...parsedItem,
                rawInput,
                completed: false,
                createdAt: timestamp,
            };

            state.items.push(newItem);

            addHistoryEntry(
                newItem.id,
                rawInput,
                timestamp
            );

            Storage.save();

            renderList();
        }


        /**
         * Update an existing item.
         */

        function updateItem(itemId, parsedItem, rawInput) {
            const item = state.items.find(
                item => item.id === itemId
            );

            if (!item) {
                return;
            }

            const timestamp = new Date().toISOString();

            Object.assign(item, parsedItem, {
                rawInput,
                updatedAt: timestamp,
            });

            addHistoryEntry(
                item.id,
                rawInput,
                timestamp
            );

            Storage.save();

            renderList();
        }


        /**
         * Toggle completion.
         */

        function toggleItem(itemId) {
            const item = state.items.find(
                item => item.id === itemId
            );

            if (!item) {
                return;
            }

            item.completed = !item.completed;

            Storage.save();

            renderList();
        }


        /**
         * Delete an item.
         *
         * Original input history remains unchanged.
         */

        function deleteItem(itemId) {
            state.items = state.items.filter(
                item => item.id !== itemId
            );

            Storage.save();

            renderList();
        }


        // =========================================================
        // 18. SAVE ITEM
        // =========================================================

        function saveItem() {
            const rawInput = DOM.itemInput.value.trim();

            if (!rawInput) {
                DOM.itemInput.focus();

                return;
            }

            const parsedItem = parseInput(rawInput);

            if (!parsedItem) {
                DOM.itemInput.focus();

                return;
            }

            if (state.editingId) {
                updateItem(
                    state.editingId,
                    parsedItem,
                    rawInput
                );
            } else {
                addItem(
                    parsedItem,
                    rawInput
                );
            }

            Modal.close(DOM.itemOverlay);

            state.editingId = null;

            DOM.itemInput.value = "";
        }


        // =========================================================
        // 19. ITEM COMPONENTS
        // =========================================================

        /**
         * Create checkbox.
         */

        function createCheckbox(item) {
            const checkbox = document.createElement("button");

            checkbox.type = "button";

            checkbox.className = [
                    "check",
                    item.completed ? "done" : "",
                ]
                .filter(Boolean)
                .join(" ");

            checkbox.setAttribute(
                "aria-label",
                item.completed ?
                "Unmark item" :
                "Mark item as completed"
            );

            checkbox.setAttribute(
                "aria-pressed",
                String(item.completed)
            );

            checkbox.addEventListener("click", () => {
                toggleItem(item.id);
            });

            return checkbox;
        }


        /**
         * Create item information.
         */

        function createItemInfo(item) {
            const info = document.createElement("div");

            info.className = "item-info";

            const name = document.createElement("div");

            name.className = "item-name";

            name.textContent = [
                    formatQuantity(item.quantity),
                    item.unit,
                    item.name,
                    item.emoji,
                ]
                .filter(Boolean)
                .join(" ");

            info.appendChild(name);

            return info;
        }


        /**
         * Create item action buttons.
         */

        function createItemActions(item) {
            const actions = document.createElement("div");

            actions.className = "item-actions";

            const editButton = createButton({
                className: "action action-edit",
                text: "✎",
                ariaLabel: "Edit item",

                onClick() {
                    openItemModal(item.id);
                },
            });

            const deleteButton = createButton({
                className: "action action-delete",
                text: "×",
                ariaLabel: "Delete item",

                onClick() {
                    deleteItem(item.id);
                },
            });

            actions.append(
                editButton,
                deleteButton
            );

            return actions;
        }


        /**
         * Create complete list item.
         */

        function createItemElement(item) {
            const row = document.createElement("div");

            row.className = [
                    "item",
                    item.completed ? "completed" : "",
                ]
                .filter(Boolean)
                .join(" ");

            const checkbox = createCheckbox(item);
            const info = createItemInfo(item);
            const actions = createItemActions(item);

            row.append(
                checkbox,
                info,
                actions
            );

            return row;
        }


        // =========================================================
        // 20. LIST RENDERING
        // =========================================================

        function renderList() {
            DOM.shoppingList.replaceChildren();

            if (!state.items.length) {
                const emptyMessage = document.createElement("div");

                emptyMessage.className = "list-empty";
                emptyMessage.textContent = "Your list is empty.";

                DOM.shoppingList.appendChild(emptyMessage);

                return;
            }

            state.items.forEach(item => {
                const itemElement = createItemElement(item);

                DOM.shoppingList.appendChild(itemElement);
            });
        }


        // =========================================================
        // 21. EVENT LISTENERS
        // =========================================================

        function initializeEventListeners() {

            // Open add modal.
            DOM.addButton.addEventListener("click", () => {
                openItemModal();
            });


            // Save item.
            DOM.saveButton.addEventListener("click", saveItem);


            // Open history.
            DOM.historyButton.addEventListener("click", () => {
                renderHistory();

                Modal.open(DOM.historyOverlay);
            });


            // Ctrl + Enter / Cmd + Enter to submit.
            DOM.itemInput.addEventListener("keydown", event => {
                if (
                    event.key === "Enter" &&
                    (event.ctrlKey || event.metaKey)
                ) {
                    event.preventDefault();

                    saveItem();
                }
            });


            // Close modal buttons.
            document.querySelectorAll("[data-close]").forEach(button => {
                button.addEventListener("click", () => {
                    const overlayId = button.dataset.close;

                    const overlay = document.getElementById(overlayId);

                    if (overlay) {
                        Modal.close(overlay);
                    }
                });
            });


            // Close when clicking outside the modal.
            [
                DOM.itemOverlay,
                DOM.historyOverlay,
            ].forEach(overlay => {
                overlay.addEventListener("click", event => {
                    if (event.target === overlay) {
                        Modal.close(overlay);
                    }
                });
            });


            // Close modals with Escape.
            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    Modal.closeAll();
                }
            });
        }


        // =========================================================
        // 22. INITIALIZATION
        // =========================================================

        function initializeApp() {
            Storage.initialize();

            initializeEventListeners();

            renderList();
            renderHistory();
        }


        // Start application.
        initializeApp();
    </script>

</body>
