<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickList</title>

    <style>
         :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #f0f2f5;
            --text: #202124;
            --muted: #777;
            --border: #e5e7eb;
            --accent: #2878f0;
            --danger: #e5484d;
            --shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }
        
        [data-theme="dark"] {
            --bg: #141518;
            --surface: #202226;
            --surface-2: #2a2d32;
            --text: #f2f3f5;
            --muted: #a0a4ab;
            --border: #383b40;
            --accent: #70a5ff;
            --danger: #ff6b70;
            --shadow: 0 8px 30px rgba(0, 0, 0, .35);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: background .2s, color .2s;
        }
        
        button,
        input,
        textarea {
            font: inherit;
        }
        
        button {
            cursor: pointer;
        }
        
        .app {
            max-width: 720px;
            margin: auto;
            padding: 22px 18px 110px;
        }
        /* Header */
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        
        .brand {
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -.7px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-size: 19px;
            transition: transform .15s, background .15s;
        }
        
        .icon-button:hover {
            background: var(--surface-2);
            transform: translateY(-1px);
        }
        /* List */
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        
        .list-header h2 {
            font-size: 17px;
            margin: 0;
        }
        
        .count {
            color: var(--muted);
            font-size: 13px;
        }
        
        .items {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        
        .item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            animation: appear .2s ease;
        }
        
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .item-check {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
            flex-shrink: 0;
            cursor: pointer;
        }
        
        .item-emoji {
            font-size: 25px;
            width: 35px;
            text-align: center;
        }
        
        .item-main {
            flex: 1;
            min-width: 0;
        }
        
        .item-name {
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        
        .item-quantity {
            color: var(--muted);
            font-size: 13px;
            margin-top: 3px;
        }
        
        .item.completed .item-name {
            text-decoration: line-through;
            opacity: .55;
        }
        
        .item-actions {
            display: flex;
            gap: 4px;
        }
        
        .small-button {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 8px;
            border-radius: 9px;
            font-size: 17px;
        }
        
        .small-button:hover {
            background: var(--surface-2);
        }
        
        .empty {
            text-align: center;
            padding: 65px 20px;
            color: var(--muted);
        }
        
        .empty-emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .empty p {
            margin: 6px 0;
        }
        /* Input */
        
        .input-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            z-index: 10;
        }
        
        .input-inner {
            max-width: 720px;
            margin: auto;
            display: flex;
            gap: 10px;
        }
        
        .input-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 0 15px;
            min-height: 54px;
        }
        
        #mainInput {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            font-size: 16px;
            max-height: 120px;
            padding: 15px 0;
        }
        
        #mainInput::placeholder {
            color: var(--muted);
        }
        
        .add-button {
            background: var(--accent);
            color: white;
            border: none;
            width: 54px;
            min-width: 54px;
            border-radius: 17px;
            font-size: 24px;
            font-weight: 600;
        }
        
        .add-button:hover {
            filter: brightness(1.08);
        }
        /* Modal */
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(3px);
        }
        
        .modal-backdrop.show {
            display: flex;
        }
        
        .modal {
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            overflow: auto;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--shadow);
            animation: modalIn .18s ease;
        }
        
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal h2 {
            margin: 0 0 9px;
            font-size: 20px;
        }
        
        .modal p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        
        .modal-input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            margin: 8px 0;
        }
        
        .modal-input:focus {
            border-color: var(--accent);
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .button {
            border: none;
            border-radius: 11px;
            padding: 11px 15px;
            font-weight: 600;
        }
        
        .button-secondary {
            background: var(--surface-2);
            color: var(--text);
        }
        
        .button-primary {
            background: var(--accent);
            color: white;
        }
        
        .button-danger {
            background: var(--danger);
            color: white;
        }
        
        .suggestions {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 12px;
        }
        
        .suggestion {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            text-align: left;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
        }
        
        .suggestion:hover {
            border-color: var(--accent);
        }
        
        .suggestion-emoji {
            font-size: 22px;
        }
        
        .suggestion-info {
            flex: 1;
        }
        
        .suggestion-name {
            font-weight: 600;
        }
        
        .suggestion-sub {
            font-size: 12px;
            color: var(--muted);
        }
        
        .unit-options {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        
        .unit-chip {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 13px;
        }
        
        .unit-chip:hover {
            border-color: var(--accent);
        }
        /* History */
        
        .history-modal {
            max-width: 560px;
        }
        
        .history-container {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }
        
        .history-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 13px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        
        .history-toolbar span {
            font-size: 13px;
            color: var(--muted);
        }
        
        .history-list {
            max-height: 380px;
            overflow-y: auto;
        }
        
        .history-entry {
            padding: 13px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        
        .history-entry:last-child {
            border-bottom: 0;
        }
        
        .history-time {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }
        
        .history-empty {
            text-align: center;
            padding: 30px;
            color: var(--muted);
        }
        /* Emoji blast */
        
        .emoji-blast {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            left: 50%;
            top: 50%;
            font-size: 30px;
            animation: blast 2s ease-in-out;
        }
        
        @keyframes blast {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(.35) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translate(var(--x1), var(--y1)) scale(1.2) rotate(90deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--x2), var(--y2)) scale(.5) rotate(var(--rotation));
            }
        }
        /* Toast */
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 11px 17px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s;
        }
        
        .toast.show {
            opacity: 1;
        }
        /* Responsive */
        
        @media (max-width: 500px) {
            .app {
                padding: 18px 13px 110px;
            }
            .item {
                padding: 12px;
            }
            .item-actions {
                gap: 0;
            }
            .modal {
                padding: 18px;
            }
        }
    </style>
</head>

        /* Units */

        const UNIT_ALIASES = {

            "KG": [
                "kg", "kgs", "kilo", "kilos", "kilogram", "kilograms"
            ],

                "g", "gm", "gms", "gram", "grams"

        const HALF_WORDS = [
            "adha", "aadha", "ada", "ardha",
            "half", "adi", "aadi", "adhi", "aadhi"
        ];

        const QUARTER_WORDS = [
            "pawa", "pau", "paau", "paawa", "quarter"
        ];

        const FILLER_WORDS = [
            "ko", "ka", "ki", "ra", "for", "of", "the", "and"
        ];

        const DOM = {

            modalActions: document.getElementById("modalActions"),

            toast: document.getElementById("toast")

        /* =========================================================
           STORAGE
        ========================================================= */

        const STORAGE_KEYS = {
            items: "quicklist_items_v2",
            history: "quicklist_history_v2",
            theme: "quicklist_theme_v2"
        };

        function loadStorage(key, fallback) {
            try {
                const value = localStorage.getItem(key);
                return value ? JSON.parse(value) : fallback;
            } catch {
                return fallback;
            }
        }

        function saveStorage(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        let items = loadStorage(STORAGE_KEYS.items, []);
        let history = loadStorage(STORAGE_KEYS.history, []);

        let currentTheme = loadStorage(STORAGE_KEYS.theme, "light");

        function saveItems() {
            saveStorage(STORAGE_KEYS.items, items);
        }

        function saveHistory() {
            saveStorage(STORAGE_KEYS.history, history);
        }


        /* =========================================================
           NORMALIZATION
        ========================================================= */

        function normalize(text) {
            return String(text)
                .toLowerCase()
                .replace(/[^\p{L}\p{N}\s]/gu, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function tokenize(text) {
            return normalize(text).split(" ").filter(Boolean);
        }


        /* =========================================================
           NUMBER PARSER
        ========================================================= */

        function parseNumberWords(tokens) {
            if (!tokens.length) return null;

            if (tokens.length === 1) {
                if (/^\d+(\.\d+)?$/.test(tokens[0])) {
                    return Number(tokens[0]);
                }

                if (NUMBERS[tokens[0]] !== undefined) {
                    return NUMBERS[tokens[0]];
                }
            }

            let total = 0;
            let current = 0;
            let found = false;

            for (const token of tokens) {

                if (/^\d+(\.\d+)?$/.test(token)) {
                    current += Number(token);
                    found = true;
                    continue;
                }

                if (NUMBERS[token] !== undefined) {
                    const value = NUMBERS[token];

                    if (value === 100) {
                        current = current || 1;
                        total += current * 100;
                        current = 0;
                    } else {
                        current += value;
                    }

                    found = true;
                } else {
                    return null;
                }
            }

            return found ? total + current : null;
        }


        /* =========================================================
           UNIT LOOKUP
        ========================================================= */

        const UNIT_LOOKUP = {};

        for (const [canonical, aliases] of Object.entries(UNIT_ALIASES)) {
            for (const alias of aliases) {
                UNIT_LOOKUP[normalize(alias)] = canonical;
            }
        }

        function findUnit(token) {
            return UNIT_LOOKUP[normalize(token)] || null;
        }


        /* =========================================================
           ITEM MATCHING
        ========================================================= */

        const ALIAS_LOOKUP = [];

        for (const [canonical, aliases] of Object.entries(ITEM_ALIASES)) {

            for (const alias of aliases) {

                ALIAS_LOOKUP.push({
                    canonical,
                    alias: normalize(alias),
                    tokens: tokenize(alias)
                });
            }
        }

        ALIAS_LOOKUP.sort((a, b) => b.tokens.length - a.tokens.length);


        /* Longest matching known item */

        function findExactItem(tokens) {

            for (const entry of ALIAS_LOOKUP) {

                const aliasTokens = entry.tokens;

                if (!aliasTokens.length) continue;

                for (let i = 0; i <= tokens.length - aliasTokens.length; i++) {

                    const segment = tokens.slice(i, i + aliasTokens.length);

                    if (segment.join(" ") === aliasTokens.join(" ")) {
                        return {
                            canonical: entry.canonical,
                            alias: entry.alias,
                            start: i,
                            length: aliasTokens.length
                        };
                    }
                }
            }

            return null;
        }


        /* =========================================================
           FUZZY MATCHING
        ========================================================= */

        function levenshtein(a, b) {

            const matrix = [];

            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }

            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }

            for (let i = 1; i <= b.length; i++) {

                for (let j = 1; j <= a.length; j++) {

                    const cost = a[j - 1] === b[i - 1] ? 0 : 1;

                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }

            return matrix[b.length][a.length];
        }


        function similarity(a, b) {

            if (!a || !b) return 0;

            const distance = levenshtein(a, b);

            return 1 - distance / Math.max(a.length, b.length);
        }


        function getSuggestions(text) {

            const query = normalize(text);

            if (!query) return [];

            const results = [];

            for (const [canonical, aliases] of Object.entries(ITEM_ALIASES)) {

                let best = 0;

                for (const alias of aliases) {

                    const normalizedAlias = normalize(alias);

                    const score = similarity(query, normalizedAlias);

                    if (score > best) {
                        best = score;
                    }

                    /* Prefix similarity */

                    if (
                        normalizedAlias.startsWith(query) &&
                        query.length >= 3
                    ) {
                        best = Math.max(best, .82);
                    }

                    if (
                        query.startsWith(normalizedAlias) &&
                        normalizedAlias.length >= 3
                    ) {
                        best = Math.max(best, .82);
                    }
                }

                if (best >= .48) {
                    results.push({
                        canonical,
                        emoji: EMOJIS[canonical] || "🛒",
                        score: best
                    });
                }
            }

            return results
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);
        }


        /* =========================================================
           PARSING
        ========================================================= */

        function parseClause(raw) {

            let tokens = tokenize(raw);

            if (!tokens.length) return null;

            let quantity = null;
            let unit = null;

            /*
              Quantity can be:
              4 kg alu
              char kg alu
              half kg potato
              2 potato
            */

            let quantityTokens = [];

            if (/^\d+(\.\d+)?$/.test(tokens[0])) {

                quantity = Number(tokens[0]);
                tokens.shift();

            } else {

                let count = 0;

                while (
                    count < tokens.length &&
                    NUMBERS[tokens[count]] !== undefined
                ) {
                    quantityTokens.push(tokens[count]);
                    count++;
                }

                if (quantityTokens.length) {
                    quantity = parseNumberWords(quantityTokens);
                    tokens.splice(0, quantityTokens.length);
                }
            }


            /* Half quantity */

            const hasHalf = tokens.some(t => HALF_WORDS.includes(t));

            if (hasHalf) {

                if (quantity === null) {
                    quantity = 0.5;
                } else {
                    quantity *= 0.5;
                }

                tokens = tokens.filter(t => !HALF_WORDS.includes(t));
            }


            /* Quarter quantity */

            const hasQuarter = tokens.some(t => QUARTER_WORDS.includes(t));

            if (hasQuarter) {

                if (quantity === null) {
                    quantity = 0.25;
                } else {
                    quantity *= 0.25;
                }

                tokens = tokens.filter(t => !QUARTER_WORDS.includes(t));
            }


            /*
              Unit only recognized when explicitly written.

              IMPORTANT:
              Unknown unit is NOT automatically converted to pcs.
            */

            if (tokens.length) {

                const potentialUnit = findUnit(tokens[0]);

                if (potentialUnit) {
                    unit = potentialUnit;
                    tokens.shift();
                }
            }


            /* Remove filler words */

            tokens = tokens.filter(t => !FILLER_WORDS.includes(t));

            const remaining = tokens.join(" ").trim();

            if (!remaining) return null;


            /* Exact product match */

            const exact = findExactItem(tokens);

            if (exact) {

                return {
                    rawInput: raw.trim(),
                    quantity,
                    unit,
                    item: exact.canonical,
                    emoji: EMOJIS[exact.canonical] || "🛒",
                    recognized: true,
                    suggestions: []
                };
            }


            /* Unknown item */

            const suggestions = getSuggestions(remaining);

            return {
                rawInput: raw.trim(),
                quantity,
                unit,
                item: titleCase(remaining),
                emoji: "🛒",
                recognized: false,
                suggestions
            };
        }


        function titleCase(text) {

            return text
                .split(" ")
                .filter(Boolean)
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(" ");
        }


        /* =========================================================
           DISPLAY
        ========================================================= */

        function formatQuantity(item) {

            const parts = [];

            if (item.quantity !== null && item.quantity !== undefined) {
                parts.push(item.quantity);
            }

            if (item.unit) {
                parts.push(item.unit);
            }

            return parts.join(" ");
        }


        function render() {

            DOM.items.innerHTML = "";

                row.querySelector(".item-emoji").textContent =
                    item.emoji || "🛒";

                row.querySelector(".item-name").textContent =
                    item.item;

                row.querySelector(".item-quantity").textContent =
                    formatQuantity(item);


                row.querySelector(".item-check").addEventListener("change", e => {

                    item.completed = e.target.checked;

                    render();

                row.querySelector(".delete-button").addEventListener("click", () => {

                    items = items.filter(x => x.id !== item.id);

                    saveItems();

                row.querySelector(".edit-button").addEventListener("click", () => {

                DOM.items.appendChild(row);

            });

        }


        /* =========================================================

        function addHistory(raw, products) {

            history.unshift({

                id: createId(),

                    item: p.item,

        /* =========================================================

        }


        /* =========================================================
           UNKNOWN ITEM SUGGESTION

        function openSuggestionModal(parsed, onSelect) {

            openModal(
                "Did you mean?",
                `We couldn't confidently recognize "${parsed.item}". Select a suggestion or keep the original text.`
            );


            const suggestions = document.createElement("div");

            suggestions.className = "suggestions";


            if (parsed.suggestions.length) {

                parsed.suggestions.forEach(suggestion => {

                    const button = document.createElement("button");

                    button.className = "suggestion";

                    button.innerHTML = `
        <span class="suggestion-emoji"></span>

        <span class="suggestion-info">
          <span class="suggestion-name"></span>
          <br>
          <span class="suggestion-sub">Use this item</span>
        </span>

        <span>→</span>
      `;

                    button.querySelector(".suggestion-emoji").textContent =
                        suggestion.emoji;

                    button.querySelector(".suggestion-name").textContent =
                        suggestion.canonical;


                    button.addEventListener("click", () => {

                        parsed.item = suggestion.canonical;
                        parsed.emoji = suggestion.emoji;
                        parsed.recognized = true;

                        closeModal();

                        onSelect(parsed);

                    });

                    suggestions.appendChild(button);

                });

            } else {

                const noSuggestions = document.createElement("p");

                noSuggestions.textContent =
                    "No similar products found. You can keep your original item.";

                suggestions.appendChild(noSuggestions);

            }


            DOM.modalContent.appendChild(suggestions);


            /* Original item */

            const original = document.createElement("button");

            original.className = "suggestion";

            original.innerHTML = `
    <span class="suggestion-emoji">🛒</span>
    <span class="suggestion-info">
      <span class="suggestion-name"></span>
      <br>
      <span class="suggestion-sub">Keep exactly as typed</span>
    </span>
    <span>✓</span>
  `;

            original.querySelector(".suggestion-name").textContent =
                parsed.item;


            original.addEventListener("click", () => {

                parsed.recognized = true;

                closeModal();

                onSelect(parsed);

            });


            DOM.modalContent.appendChild(original);


            addModalButton("Skip", "button-secondary", closeModal);

        }


        /* =========================================================
           UNKNOWN UNIT
        ========================================================= */

        function openUnitModal(parsed, onSelect) {

            openModal(
                "Quantity unit?",
                `You entered ${parsed.quantity ?? ""} for "${parsed.item}", but no recognized unit was provided.`
            );


            const options = [
                "KG",
                "g",
                "L",
                "ml",
                "pcs",
                "Dozen",
                "pack",

        /* =========================================================
           ADD ITEM
        ========================================================= */

        function createId() {

            return Date.now().toString(36) +
                Math.random().toString(36).slice(2, 8);

        }


        function addItem(parsed) {

            const item = {

                id: createId(),

                item: parsed.item,

                quantity: parsed.quantity,

                unit: parsed.unit,

                emoji: parsed.emoji || EMOJIS[parsed.item] || "🛒",

                rawInput: parsed.rawInput,

                completed: false,

                createdAt: Date.now()

            };


            items.push(item);

            saveItems();
            render();

            animateEmoji(item.emoji);

        }


        function processParsed(parsed) {

            if (!parsed) return;


            /*
              Unknown item:
              Ask before silently using a potentially incorrect product.
            */

            if (!parsed.recognized) {

                openSuggestionModal(parsed, processParsed);

                return;
            }


            /*
              Missing unit:
              Never automatically convert it to pcs.
            */

            if (
                parsed.quantity !== null &&
                parsed.unit === null
            ) {

                openUnitModal(parsed, processParsed);

                return;
            }


            addItem(parsed);

        }


        /* =========================================================
           MULTI-ITEM INPUT
        ========================================================= */

        function handleAdd() {

            const raw = DOM.itemInput.value.trim();

            if (!raw) return;


            /*
              Comma-separated entries are independent clauses.

              Example:
              char kg alu, ath kilo pyaj

              Example:
              2 kg potato, half kg tomato, 3 apples
            */

            const clauses = raw
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);


            if (!clauses.length) return;


            const parsedItems = clauses
                .map(parseClause)
                .filter(Boolean);


            if (!parsedItems.length) {

                showToast("Couldn't understand the input");

                return;
            }


            addHistory(raw, parsedItems);


            DOM.itemInput.value = "";

            DOM.itemInput.style.height = "auto";


            /*
              Process sequentially because a spelling suggestion
              or missing unit may need user confirmation.
            */

            processQueue(parsedItems);

        }


        function processQueue(queue) {

            if (!queue.length) return;


            const current = queue.shift();


            processParsed({

                ...current,

                _queue: queue

            });


        }


        /* =========================================================
           QUEUE CONTINUATION
        ========================================================= */

        const originalProcessParsed = processParsed;

        function processQueueItem(parsed) {

            const remaining = parsed._queue || [];

            delete parsed._queue;


            function continueQueue() {

                if (remaining.length) {

                    const next = remaining.shift();

                    processParsed({
                        ...next,
                        _queue: remaining
                    });

                }

            }


            const oldAddItem = addItem;

            addItem = function(item) {

                oldAddItem(item);

                addItem = oldAddItem;

                continueQueue();

            };


            processParsed(parsed);

        }


        /*
          Wrap processParsed so each confirmed product continues
          processing the rest of the comma-separated input.
        */

        const baseProcessParsed = processParsed;

        processParsed = function(parsed) {

            if (!parsed) return;


            const queue = parsed._queue || [];

            const next = () => {

                if (queue.length) {

                    const nextItem = queue.shift();

                    processParsed({
                        ...nextItem,
                        _queue: queue
                    });

                }

            };


            if (!parsed.recognized) {

                openSuggestionModal(parsed, selected => {

                    selected._queue = queue;

                    processParsed(selected);

                });

                return;

            }


            if (
                parsed.quantity !== null &&
                parsed.unit === null
            ) {

                openUnitModal(parsed, selected => {

                    selected._queue = queue;

                    processParsed(selected);

                });

                return;

            }


            addItem(parsed);

            next();

        };


        /* =========================================================
           EMOJI ANIMATION
        ========================================================= */

        function animateEmoji(emoji) {

            const count = 9;

            for (let i = 0; i < count; i++) {

                const particle = document.createElement("div");

                particle.className = "emoji-blast";
                particle.textContent = emoji;


                const angle = Math.random() * Math.PI * 2;

                const distance = 80 + Math.random() * 170;

                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                const x1 = x * .4;
                const y1 = y * .4;


                particle.style.setProperty("--x1", `${x1}px`);
                particle.style.setProperty("--y1", `${y1}px`);

                particle.style.setProperty("--x2", `${x}px`);
                particle.style.setProperty("--y2", `${y}px`);

                particle.style.setProperty(
                    "--rotation",
                    `${Math.random() * 360 - 180}deg`
                );

                particle.style.fontSize =
                    `${20 + Math.random() * 38}px`;

                particle.style.animationDelay =
                    `${Math.random() * .08}s`;


                document.body.appendChild(particle);


                setTimeout(() => particle.remove(), 1000);

            }

        }


        /* =========================================================
           THEME
        ========================================================= */

        function applyTheme(theme) {

            currentTheme = theme;

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );

            DOM.themeToggle.textContent =
                theme === "dark" ? "☀️" : "🌙";

            DOM.themeToggle.title =
                theme === "dark" ? "Switch to light mode" : "Switch to dark mode";

            saveStorage(STORAGE_KEYS.theme, theme);

        }


        DOM.themeToggle.addEventListener("click", () => {

            applyTheme(
                currentTheme === "dark" ?
                "light" :
                "dark"
            );

        });


        /* =========================================================
           DELETE ALL ITEMS
        ========================================================= */

        DOM.deleteAllButton.addEventListener("click", () => {

            if (!items.length) {

                showToast("Your list is already empty");

                return;

            }


            openConfirmModal(
                "Delete all items?",
                "This will permanently remove every item from your shopping list. Your history will remain intact.",
                "Delete everything",
                () => {

                    items = [];

                    saveItems();
                    render();

                    showToast("Shopping list cleared");

                }

            );

        });


        /* =========================================================
           HISTORY BUTTON
        ========================================================= */

        DOM.historyButton.addEventListener("click", () => {

            openModal("Input History");

            renderHistory();

        });


        /* =========================================================
           TOAST
        ========================================================= */

        let toastTimer;

        function showToast(message) {

            DOM.toast.textContent = message;

            DOM.toast.classList.add("show");

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {

                DOM.toast.classList.remove("show");

            }, 2200);

        }


        /* =========================================================
           INPUT EVENTS
        ========================================================= */

        DOM.addButton.addEventListener("click", handleAdd);


        DOM.itemInput.addEventListener("keydown", e => {

            if (e.key === "Enter" && !e.shiftKey) {

                e.preventDefault();

                handleAdd();

            }

        });


        DOM.itemInput.addEventListener("input", () => {

            DOM.itemInput.style.height = "auto";

            DOM.itemInput.style.height =
                Math.min(DOM.itemInput.scrollHeight, 120) + "px";

        });


        DOM.backdrop.addEventListener("click", e => {

            if (e.target === DOM.backdrop) {
                closeModal();
            }

        });


        document.addEventListener("keydown", e => {

            if (e.key === "Escape") {
                closeModal();
            }

        });


        /* =========================================================
           INIT
        ========================================================= */

        applyTheme(currentTheme);

        render();

        DOM.itemInput.focus();
    </script>

</body>

</html>
